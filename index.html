<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AXIOM Dealership Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
/* ---- light (normal) mode: white + blue ---- */
:root{
  --blue:#1d61d8;
  --blue-2:#3d82f2;
  --blue-deep:#0d2f6b;
  --blue-ink:#ffffff;
  --bg:#f3f6fb;
  --surface:#ffffff;
  --surface-2:#f6f9fd;
  --surface-3:#eaf0f9;
  --text:#0d1b2e;
  --text-2:#33455f;
  --muted:#64748b;
  --border:#dbe3ef;
  --border-strong:#bfcbdd;
  --rail:#0c1d33;
  --rail-2:#16304f;
  --rail-text:#a9bcd4;
  --ok:#0a7546; --ok-bg:#e7f6ef; --ok-shadow:rgba(10,117,70,.28);
  --warn:#8a5106; --warn-bg:#fdf2e3;
  --danger:#b42318; --danger-bg:#fdecea;
  --info:#1d61d8; --info-bg:#e9f0fd;
  --shadow:0 1px 2px rgba(13,27,46,.05),0 10px 26px rgba(13,27,46,.07);
  --radius:11px;
}
/* ---- dark mode: black + blue ---- */
:root[data-theme="dark"]{
  --blue:#4c8dff; --blue-2:#79aaff; --blue-deep:#0a1b33; --blue-ink:#061020;
  --bg:#070c14; --surface:#0f1723; --surface-2:#131d2b; --surface-3:#1a2637;
  --text:#e9eff8; --text-2:#c2cee0; --muted:#8798ae; --border:#23324a; --border-strong:#35496a;
  --rail:#050a12; --rail-2:#111d30; --rail-text:#97a9c2;
  --ok:#4ec08d; --ok-bg:#0f271d; --ok-shadow:rgba(78,192,141,.28); --warn:#e2a862; --warn-bg:#2a2013; --danger:#f0897f; --danger-bg:#2b1614;
  --info:#79aaff; --info-bg:#122238;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 26px rgba(0,0,0,.42);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:17px} h3{font-size:15px} h4{font-size:13px}
p{margin:0 0 8px}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12px} .tiny{font-size:11px}
.right{text-align:right} .center{text-align:center} .nowrap{white-space:nowrap} .hidden{display:none !important}

.app{display:flex;min-height:100vh}
.rail{width:242px;flex:0 0 242px;background:var(--rail);color:var(--rail-text);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.rail-brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;gap:11px;align-items:center}
.badge-logo{width:38px;height:38px;border-radius:9px;background:linear-gradient(140deg,var(--blue),var(--blue-2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 38px}
.rail-brand .nm{color:#fff;font-weight:600;font-size:14px;line-height:1.25}
.rail-brand .sb{font-size:11px;color:var(--rail-text)}
.rail nav{padding:10px;flex:1}
.nav-group{font-size:10.5px;letter-spacing:.09em;color:#6d84a3;text-transform:uppercase;padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--rail-text);padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13.5px}
.nav-item:hover{background:var(--rail-2);color:#fff}
.nav-item.active{background:var(--rail-2);color:#fff;box-shadow:inset 3px 0 0 var(--blue)}
.nav-item .ic{width:18px;text-align:center;opacity:.9}
.nav-item .tagx{margin-left:auto;font-size:9.5px;border:1px solid rgba(255,255,255,.2);border-radius:4px;padding:1px 5px;color:#8fa3bf}
.rail-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08)}
.userchip{display:flex;gap:10px;align-items:center;padding:8px;border-radius:8px;background:var(--rail-2)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.userchip .nm{color:#fff;font-size:12.5px;font-weight:500}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.topbar .demo{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.view{padding:20px 22px 48px;max-width:1620px;width:100%}
.menu-btn{display:none}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card-b{padding:16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi{padding:14px 16px}
.kpi .lb{font-size:12px;color:var(--muted)}
.kpi .vl{font-size:26px;font-weight:600;margin-top:4px;letter-spacing:-.02em}
.kpi .dt{font-size:11.5px;color:var(--muted);margin-top:3px}
.btn{border:1px solid var(--border-strong);background:var(--surface);color:var(--text);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.dark{background:var(--rail);border-color:var(--rail);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-3)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--surface-3);color:var(--text-2);border:1px solid var(--border)}
.tag.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.tag.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.tag.danger{background:var(--danger-bg);color:var(--danger);border-color:transparent}
.tag.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.tag.demo{background:var(--warn-bg);color:var(--warn);border-color:transparent;font-weight:600;letter-spacing:.04em}
label.f{display:block;margin-bottom:12px}
label.f > span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=number],input[type=date],input[type=email],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface)}
textarea{font-family:inherit}
input:disabled,select:disabled{background:var(--surface-3);color:var(--muted)}
.inline{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.inline > *{flex:1;min-width:130px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.bar{height:7px;border-radius:4px;background:var(--surface-3);overflow:hidden;min-width:60px}
.bar > i{display:block;height:100%;background:var(--blue)}
.empty{padding:34px 18px;text-align:center;color:var(--muted)}
.notice{padding:11px 13px;border-radius:9px;font-size:13px;display:flex;gap:9px;align-items:flex-start}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.notice.err{background:var(--danger-bg);color:var(--danger)}
.notice.info{background:var(--info-bg);color:var(--info)}
.notice.ok{background:var(--ok-bg);color:var(--ok)}
.divider{height:1px;background:var(--border);margin:14px 0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:13px}
.kv .k{color:var(--muted)}
.kv.total{border-top:1px solid var(--border-strong);margin-top:6px;padding-top:9px;font-weight:600;font-size:15px}
.switch{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;cursor:pointer;user-select:none}
.switch input{accent-color:var(--blue);width:15px;height:15px}
.chiprow{display:flex;gap:7px;flex-wrap:wrap}
.termchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border-strong);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;background:var(--surface)}
.termchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.termchip input{display:none}

.uc{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 20px;text-align:center;gap:10px}
.uc .bigtag{font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--warn);background:var(--warn-bg);padding:8px 16px;border-radius:6px}

/* Finance action bar + step bar, pinned under the header while the page scrolls */
.fin-toolbar{position:sticky;top:var(--topbar-h,57px);z-index:15;background:var(--bg);margin:-20px -22px 16px;padding:12px 22px 0;border-bottom:1px solid var(--border)}
.fin-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.fin-bar-sp{flex:1}
.fin-toolbar .steps{margin-bottom:12px}
.cdmenu.bar-menu{min-width:210px;padding:6px}
.ready-pill{border:1px solid;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;font-family:inherit;line-height:1.3}
.ready-pill.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.ready-pill.todo{border-color:var(--warn);background:var(--warn-bg);color:var(--warn);cursor:pointer}
[id^="step-"]{scroll-margin-top:calc(var(--topbar-h,57px) + var(--finbar-h,110px) + 12px)}
@media (max-width:900px){ .fin-toolbar{position:static;margin:-14px -14px 14px;padding:10px 14px 0} [id^="step-"]{scroll-margin-top:12px} }
.cdmenu-wrap{position:relative;display:inline-block}
.cdmenu{position:absolute;top:calc(100% + 6px);left:0;z-index:45;min-width:270px;padding:10px;border:1px solid var(--border);border-radius:12px;background:var(--surface);box-shadow:0 14px 40px rgba(0,0,0,.22)}
.cdm-lbl{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:2px 4px 8px}
.cdm-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:3px;border-radius:9px;background:var(--surface-3)}
.cdm-seg button{border:0;background:transparent;padding:7px 4px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--text-2);cursor:pointer}
.cdm-seg button.on{background:var(--blue);color:#fff}
.cdm-sep{height:1px;background:var(--border);margin:10px 0 6px}
.cdm-item{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 8px;border-radius:7px;font-size:13px;color:var(--text);cursor:pointer}
.cdm-item:hover{background:var(--surface-3)}
.cd-drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,94vw);z-index:70;display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--border);box-shadow:-14px 0 40px rgba(0,0,0,.3)}
.cd-drawer-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;background:var(--rail);color:#fff;font-size:12px}
.cd-drawer-h .live{width:7px;height:7px;border-radius:50%;background:#37d39b}
.cd-drawer-h .sp{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.cd-drawer-b{flex:1;overflow:auto}
.cd-drawer-b .cd{min-height:100%}
.fin-split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
.fin-split.solo{grid-template-columns:minmax(0,1fr)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.step{display:flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid var(--border);border-radius:999px;background:var(--surface);font-size:12.5px;cursor:pointer}
.step .n{width:19px;height:19px;border-radius:50%;background:var(--surface-3);color:var(--text-2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.step.done .n{background:var(--ok);color:#fff}
.step.done{border-color:var(--ok)}
.step.bad .n{background:var(--danger);color:#fff}
.step.bad{border-color:var(--danger);color:var(--danger)}
/* Fields still blocking Complete, marked once Complete has been pressed */
.need{border-color:var(--danger) !important;box-shadow:0 0 0 3px var(--danger-bg) !important}
.choice-row.need,.mg-row.need,.chiprow.need{border-radius:12px}
.confirm-a{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.ca-cta{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:14px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2)}
.deal-banner{align-items:center;margin-bottom:14px;flex-wrap:wrap}
.deal-banner .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.issue-list{margin:6px 0 0;padding:0;list-style:none}
.issue-list li + li{margin-top:2px}
.issue-list button{all:unset;cursor:pointer;color:inherit;text-decoration:underline;text-underline-offset:2px}
.issue-list button:hover,.issue-list button:focus-visible{text-decoration-thickness:2px}
.issue-list li::before{content:"• ";}
.stack{display:flex;flex-direction:column;gap:14px}
.prodrow{border:1px solid var(--border);border-radius:10px;padding:11px 12px;background:var(--surface-2)}
.prodrow + .prodrow{margin-top:10px}
.prodrow .ph{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.prodrow .ph .nm{font-weight:600}
.prodrow .ph .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.prodrow .phrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.prodrow .phrow .left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prodrow .phrow .right{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.prodrow .phrow .nm{font-weight:600}
.pkgpick{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;padding-top:9px;border-top:1px dashed var(--border)}
.prodrow2{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:1px solid var(--border);border-radius:10px;padding:12px 16px;background:var(--surface-2)}
.prodrow2 + .prodrow2{margin-top:10px}
.prodrow2 .pr-icon{flex:0 0 auto;width:34px;height:34px;border-radius:9px;background:linear-gradient(140deg,var(--blue),var(--blue-2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
.prodrow2 .pr-name{flex:1 1 300px;min-width:220px}
.cfg-sum{margin-top:6px;font-size:12px;color:var(--muted)}
.cfg-inline{display:flex;gap:10px;flex-wrap:wrap;margin-top:9px}
.cfg-f{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);min-width:118px}
.cfg-f select{padding:6px 8px;font-size:12.5px;height:auto;border-radius:7px}
.prodrow2 .pr-name .nm{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prodrow2 .pr-ctrls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* Products menu grid: one row per product, one column per package */
.mg-head,.mg-row{display:grid;grid-template-columns:minmax(220px,1fr) 140px repeat(3,minmax(96px,124px)) 80px;column-gap:8px;align-items:center}
/* header boxes: same height, and every name gets the same two-line space so they line up across */
.mg-head{padding:0 14px 10px;align-items:stretch}
.mg-h-prod,.mg-h-price{align-self:end}
.mg-pk{text-align:center;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:8px 6px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mg-pk-n{font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;line-height:1.25;overflow-wrap:anywhere}
.mg-row{border:1px solid var(--border);border-radius:10px;padding:10px 14px;background:var(--surface-2)}
.mg-row + .mg-row{margin-top:8px}
.mg-row.declined .mg-prod,.mg-row.declined .mg-price{opacity:.7}
.mg-prod{display:flex;gap:12px;align-items:center;min-width:0}
.mg-prod .pr-icon{flex:0 0 auto;width:34px;height:34px;border-radius:9px;background:linear-gradient(140deg,var(--blue),var(--blue-2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
.mg-name{min-width:0}
.mg-name .nm{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mg-price{display:flex;gap:8px;align-items:center}
.mg-cell{display:flex;justify-content:center;align-items:center;gap:7px;min-height:34px;cursor:pointer;user-select:none}
.mg-cell input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.mg-box{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--border-strong);background:var(--surface);color:#fff;display:inline-flex;align-items:center;justify-content:center;transition:background .12s,border-color .12s}
.mg-box svg{width:15px;height:15px}
.mg-cell:hover .mg-box{border-color:var(--blue)}
.mg-cell.on .mg-box{background:var(--blue);border-color:var(--blue)}
.mg-lbl{display:none;font-size:12.5px;color:var(--text-2)}
.mg-dec{text-align:right}
.mg-cfg{grid-column:1 / -1;margin-top:10px;padding-left:46px}
/* Narrow layout, chosen by the room the Finance view really has (measureBars sets .mg-narrow),
   so it also kicks in when the customer display preview is docked beside the form. */
.mg-narrow .mg-head{display:none}
.mg-narrow .mg-row{display:flex;flex-wrap:wrap;gap:10px 14px}
.mg-narrow .mg-prod{flex:1 1 100%}
.mg-narrow .mg-cell{justify-content:flex-start}
.mg-narrow .mg-lbl{display:inline}
.mg-narrow .mg-dec{margin-left:auto}
.mg-narrow .mg-cfg{flex:1 1 100%;margin-top:0;padding-left:0}
/* Compact Finance layout when the view is narrow (e.g. preview docked on a laptop) */
.fin-compact .cv-row,.fin-compact .fs-row,.fin-compact .offers-2col{grid-template-columns:minmax(0,1fr)}
.fin-compact .fs-div{display:none}
.fin-compact .offers-div{height:1px;width:100%}
/* Customer display preview docked beside the form instead of covering it (wide screens only) */
html.cd-docked .main{padding-right:min(520px,94vw)}
/* 5 · Present & close */
.paygrid th,.paygrid td{white-space:nowrap}
.paygrid td:first-child{white-space:normal}
.paygrid i{font-style:normal;color:var(--muted);font-size:12px;margin-left:6px}
.paygrid tr.base td{color:var(--muted)}
.paygrid tr.chosen td{background:var(--info-bg)}
.close-box,.choice-box{margin-top:16px;border:1px solid var(--border);border-radius:12px;padding:16px;background:var(--surface-2)}
.choice-box{margin:0 0 18px}
.close-box > :first-child{margin-top:0}
.close-box .kv.total:first-child{border-top:0;padding-top:0;margin-top:0}
.choice-top{display:flex;gap:8px 12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.choice-none{flex:0 0 auto}
.choice-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:stretch}
.pkgselect:disabled{opacity:.45;cursor:not-allowed}
.close-box .kv.total{margin-top:14px}
.close-finish{display:flex;gap:12px;align-items:center;margin-top:14px;flex-wrap:wrap}
.close-finish .notice{flex:1 1 320px;margin:0}
.close-go{padding:11px 22px;font-size:14px}
@media (max-width:760px){ .close-go{width:100%} }
@media (max-width:560px){ .choice-row{grid-template-columns:minmax(0,1fr)} }
.pricebox{position:relative;width:112px}
.pricebox .pfx{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}
.pricebox input{padding-left:22px}
.pkgchk-row{display:flex;gap:10px;align-items:center}

.axl-feat{width:7.85vw;min-width:96px;padding:0 .6vw;text-align:center;border-left:1px solid var(--line)}

.axl-feat .ic{display:block;color:var(--blue);margin:0 auto .9vh}
.axl-feat .ic svg{width:clamp(22px,1.95vw,36px);height:clamp(22px,1.95vw,36px);display:block;margin:0 auto}
.axl-feat b{display:block;font-size:clamp(10.5px,.72vw,13px);font-weight:700;color:var(--ink);letter-spacing:-.01em}
.axl-feat em{display:block;margin-top:.4vh;font-style:normal;font-size:clamp(9.5px,.64vw,12px);line-height:1.35;color:#5a6b88}
.axl-side{display:flex;justify-content:flex-end}
.axl-card{width:25.5vw;min-width:320px;padding:1.8vw 1.8vw 1.5vw;border-radius:1vw;background:#fff;border:1px solid rgba(200,215,235,.6);

.axl-card h2{margin:0;font-size:clamp(20px,1.5vw,28px);font-weight:700;letter-spacing:-.03em;color:var(--ink)}
.axl-sub{margin:.3vh 0 2vh;font-size:clamp(12px,.88vw,16px);color:var(--ink);letter-spacing:-.01em}
.axl-ok{margin:0 0 14px;padding:10px 12px;border-radius:8px;background:#e9f6ef;border:1px solid #9fd3b6;color:#0a6a3f;font-size:13px;line-height:1.4}
.axl-err{margin:0 0 14px;padding:10px 12px;border-radius:8px;background:#fdecea;border:1px solid #f1a9a1;color:#a3261b;font-size:13px;line-height:1.4}
.axl-field{display:flex;align-items:center;gap:.9vw;height:clamp(40px,2.8vw,50px);margin-bottom:1.3vh;padding:0 1vw;border-radius:.6vw;color:#4a5b7a;background:#f5f8fc;border:1px solid var(--line);transition:border-color .15s,box-shadow .15s}
.axl-field svg{width:clamp(16px,1.15vw,21px);height:clamp(16px,1.15vw,21px);flex:0 0 auto}
.axl-field:hover{border-color:#b9c9e0}
.axl-field:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(10,108,240,.15);background:#fff}
.axl .axl-field input{flex:1;min-width:0;height:100%;border:0 !important;outline:none !important;box-shadow:none !important;background:transparent !important;color:var(--ink) !important;font-family:inherit;font-size:clamp(13px,.9vw,16px);padding:0 !important;border-radius:0 !important}
.axl .axl-field input:-webkit-autofill,.axl .axl-field input:-webkit-autofill:hover,.axl .axl-field input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 1000px #f5f8fc inset !important;box-shadow:0 0 0 1000px #f5f8fc inset !important;-webkit-text-fill-color:#0b1b3a !important;caret-color:#0b1b3a;transition:background-color 99999s ease-out 0s}
.axl .axl-field:focus-within input:-webkit-autofill{-webkit-box-shadow:0 0 0 1000px #fff inset !important;box-shadow:0 0 0 1000px #fff inset !important}
.axl-field input::placeholder{color:#4a5b7a;opacity:1}
.axl-eye{border:0;background:transparent;color:#1f3157;cursor:pointer;display:flex;padding:4px;border-radius:6px}
.axl-row{display:flex;justify-content:space-between;align-items:center;margin:.8vh 0 1.6vh;font-size:clamp(11.5px,.8vw,14px)}
.axl-check{display:flex;align-items:center;gap:.7vw;cursor:pointer;color:var(--ink);white-space:nowrap}
.axl-check input{position:absolute;opacity:0;pointer-events:none}
.axl-check .bx{width:clamp(16px,1.2vw,20px);height:clamp(16px,1.2vw,20px);border-radius:4px;border:1.5px solid #9fb3d1;display:flex;align-items:center;justify-content:center;background:#fff}
.axl-check input:checked + .bx{background:var(--blue);border-color:var(--blue)}
.axl-check input:checked + .bx::after{content:"";width:35%;height:60%;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-8%) rotate(45deg)}
.axl-check input:focus-visible + .bx{box-shadow:0 0 0 3px rgba(10,108,240,.3)}
.axl-link{color:var(--blue);cursor:pointer;white-space:nowrap}
.axl-link:hover{text-decoration:underline}
.axl-btn{width:100%;height:clamp(42px,3vw,52px);border:0;border-radius:.6vw;background:linear-gradient(180deg,#1a8dff,#0a66e8);color:#fff;font-family:inherit;font-size:clamp(14px,1vw,18px);font-weight:600;cursor:pointer;
  box-shadow:0 8px 20px rgba(10,108,240,.28);transition:filter .15s,transform .1s}
.axl-btn:hover{filter:brightness(1.07)}
.axl-btn:active{transform:translateY(1px)}
.axl-btn:focus-visible{outline:3px solid rgba(10,108,240,.4);outline-offset:2px}
.axl-or{display:flex;align-items:center;gap:1vw;margin:2vh 0 1.4vh;font-size:clamp(11px,.82vw,14px);color:#2f4062}
.axl-or::before,.axl-or::after{content:"";flex:1;height:1px;background:var(--line)}
.axl-ben{margin-top:2.2vh;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.axl-ben div{display:flex;flex-direction:column;align-items:center;gap:.8vh;font-size:clamp(11px,.82vw,14px);line-height:1.4;color:#2f4062}
.axl-ben svg{width:clamp(20px,1.6vw,28px);height:clamp(20px,1.6vw,28px);color:#3a4d78}
.axl-wait{text-align:center;padding:48px 28px}
.axl-wait .axl-sub{margin:6px 0 0}
.axl-spin{width:32px;height:32px;margin:0 auto 18px;border-radius:50%;border:3px solid #dbe6f5;border-top-color:var(--blue);animation:axlSpin .8s linear infinite}
.axl-foot{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:5.2vh var(--padr) 3.6vh var(--padl)}
.axl-trust{display:flex;align-items:center;flex-wrap:wrap}
.axl-t{display:flex;align-items:center;gap:.6vw;white-space:nowrap;font-size:clamp(11px,.95vw,17px);color:#2f4062;padding:0 1.5vw;border-left:1px solid var(--line)}
.axl-t:first-child{padding-left:0;border-left:0}
.axl-t svg{width:clamp(18px,1.6vw,30px);height:clamp(18px,1.6vw,30px);color:#3a4d78;flex:0 0 auto}
.axl-tagline{display:flex;align-items:center;gap:1.7vw;font-size:clamp(9px,.78vw,14px);letter-spacing:.3em;text-transform:uppercase;color:#2a3a5c;font-weight:600;white-space:nowrap}
.axl-tagline i{display:block;width:3vw;height:2px;background:var(--blue);border-radius:2px}
.axl-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;max-width:min(520px,calc(100vw - 32px));padding:12px 18px;border-radius:9px;background:#0b1b3a;color:#fff;font-size:14px;line-height:1.45;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.axl-toast.err{background:#a3261b}
@keyframes axlWrite{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 -10% 0 0)}}
@keyframes axlSpin{to{transform:rotate(360deg)}}
@media (max-width:1000px){

  .axl-foot{flex-direction:column;align-items:center;gap:16px;text-align:center;padding-top:28px}
  .axl-trust{justify-content:center;row-gap:10px}

@media (max-width:520px){
  .axl-nav{gap:10px;letter-spacing:.14em}

}

.custb .cb-band{color:#fff;padding:38px 52px 32px}
.custb .cb-row{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.custb .cb-dn{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.92}
.custb .cb-fin{font-size:10.5px;letter-spacing:.16em;opacity:.8;text-align:right}
.custb h1.cb-h{color:#fff;font-size:30px;font-weight:700;margin:26px 0 6px;letter-spacing:-.01em}
.custb .cb-sub{opacity:.88;font-size:13.5px}
.custb .cb-body{padding:28px 52px 20px;flex:1}
.custb .cb-facts{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #dfe6f0;border-radius:10px;overflow:hidden}
.custb .cb-facts > div{padding:12px 14px;border-left:1px solid #dfe6f0}
.custb .cb-facts > div:first-child{border-left:0}
.custb .cb-k{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#5b6b85}
.custb .cb-v{font-size:13px;font-weight:600;margin-top:3px}
.custb .cb-main{display:grid;grid-template-columns:1.5fr 1fr;gap:22px;margin-top:22px;break-inside:avoid;page-break-inside:avoid}
.custb .cb-cov h3{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 8px;padding:0;border:0}
.custb .cb-item{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #dfe6f0}
.custb .cb-dot{flex:0 0 auto;width:26px;height:26px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.custb .cb-item b{font-size:13px}
.custb .cb-item .cb-d{font-size:11.5px;color:#5b6b85;margin-top:1px}
.custb .cb-side{background:#f4f7fb;border-radius:12px;padding:18px;align-self:start}
.custb .cb-pn{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.custb .cb-amt{font-size:30px;font-weight:700;margin:8px 0 0;line-height:1.15}
.custb .cb-amt + .cb-small{margin-bottom:6px}
.custb .cb-small{font-size:11px;color:#5b6b85}
.custb .cb-chip{display:inline-block;margin-top:10px;padding:4px 10px;border-radius:999px;background:#dcfce7;color:#166534;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.custb .cb-sig{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:40px}
.custb .cb-sig div{border-top:1px solid #0f1f38;padding-top:6px;font-size:10.5px;color:#5b6b85}
.custb .cb-foot{padding:14px 52px 26px;font-size:10px;color:#5b6b85;text-align:center;line-height:1.55}
.doc.cust .hero{background:linear-gradient(120deg,#0d2f6b,#1d61d8);color:#fff;padding:26px 30px}
.doc.cust .hero h1{color:#fff;font-size:24px}
.doc.cust .inner{padding:24px 30px}
.doc.cust .ccov{border:1px solid #e3e8ef;border-left:4px solid #1d61d8;border-radius:8px;padding:11px 14px;margin-bottom:9px}
.mailbox{width:100%;min-height:420px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.55}

/* ---------------- AXIOM login / landing ---------------- */
:root{ --axiom-purple:#a78bfa; --axiom-cyan:#5fd4f4; }
.axiom-page{min-height:100vh;width:100%;background:linear-gradient(135deg,#060b22 0%,#0f2160 50%,#1b3a8c 100%);display:flex;align-items:center;justify-content:center;padding:56px 32px;position:relative;overflow:hidden}
.axiom-wave{position:absolute;left:0;right:0;bottom:-10px;width:100%;height:220px;pointer-events:none}
.axiom-grid{display:grid;grid-template-columns:1.15fr 440px;gap:70px;max-width:1360px;width:100%;align-items:center;position:relative;z-index:2}
.axiom-left{position:relative;color:#fff;min-height:480px;display:flex;align-items:center}
.axiom-globe-wrap{position:absolute;right:-30px;top:50%;transform:translateY(-50%);width:480px;height:480px;z-index:1;opacity:.92}
.axiom-globe-wrap svg{width:100%;height:100%}
.axiom-left-inner{position:relative;z-index:2;max-width:500px}
.axiom-brandrow{margin-bottom:22px}
.axiom-brandrow svg{display:block}
.axiom-word{font-size:58px;font-weight:800;letter-spacing:.01em;margin:0 0 12px;line-height:1;color:#fff}
.axiom-tagline{font-size:17px;font-weight:600;margin:0 0 8px;color:#e4eafc}
.axiom-sig{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:21px;color:#c3cdf0;margin:0 0 38px}
.axiom-slogan{font-size:32px;font-weight:800;margin:0 0 16px;letter-spacing:.01em}
.axiom-slogan .s1{color:#fff}
.axiom-slogan .s2{color:var(--axiom-purple)}
.axiom-slogan .s3{color:var(--axiom-cyan)}
.axiom-sub{display:flex;align-items:center;gap:10px;font-size:15.5px;font-weight:600;color:#dbe4fb;margin:0}
.axiom-sub svg{flex:0 0 auto}
.axiom-right{position:relative;z-index:2}
.axiom-card{background:#fff;border-radius:20px;padding:38px 34px;box-shadow:0 30px 80px rgba(2,8,30,.5);color:#0d1b2e}
.axiom-card-brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.axiom-card-brand .nm{font-size:19px;font-weight:800;color:#0d1b2e;line-height:1.15}
.axiom-card-brand .tg{font-size:10px;color:#64748b;line-height:1.35;max-width:200px;font-weight:600}
.axiom-card-brand .sig{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:12px;color:#8b93a8}
.axiom-card h2{font-size:22px;margin:2px 0 4px}
.axiom-card .sub{color:#64748b;font-size:13.5px;margin:0 0 22px}
.axiom-err{background:#fdecea;color:#b42318;border-radius:9px;padding:10px 13px;font-size:12.5px;margin-bottom:16px;font-weight:600}
.axiom-field{margin-bottom:16px}
.axiom-field label{display:block;font-size:12.5px;font-weight:700;color:#33455f;margin-bottom:6px}
.axiom-field input{width:100%;padding:11px 13px;border:1px solid #d7deec;border-radius:9px;font-size:14px;box-sizing:border-box;background:#fff;color:#0d1b2e}
.axiom-field input::placeholder{color:#94a3b8}
.axiom-field input:focus-visible{outline:2px solid #3f7bf0;outline-offset:1px}
.axiom-row{display:flex;align-items:center;justify-content:space-between;margin:2px 0 20px;font-size:13px;color:#33455f}
.axiom-row a{color:#3b6be0;text-decoration:none;font-weight:700;cursor:pointer}
.axiom-signin{width:100%;padding:13px;border-radius:10px;background:linear-gradient(135deg,#2f5fdc,#3f7bf0);color:#fff;font-weight:700;font-size:15px;border:0;cursor:pointer}
.axiom-signin:hover{filter:brightness(1.08)}
@keyframes axiomSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes axiomSpinRev{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}
@keyframes axiomPulse{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.5)}}
@keyframes axiomDrift{from{transform:translateX(0)}to{transform:translateX(-60px)}}
@keyframes axiomCorePulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.axiom-ring1{animation:axiomSpin 50s linear infinite;transform-origin:200px 200px}
.axiom-ring2{animation:axiomSpinRev 65s linear infinite;transform-origin:200px 200px}
.axiom-ring3{animation:axiomSpin 85s linear infinite;transform-origin:200px 200px}
.axiom-ring4{animation:axiomSpinRev 105s linear infinite;transform-origin:200px 200px}
.axiom-ring5{animation:axiomSpin 130s linear infinite;transform-origin:200px 200px}
.axiom-dot{animation:axiomPulse 3.6s ease-in-out infinite}
.axiom-core{animation:axiomCorePulse 5s ease-in-out infinite;transform-origin:200px 200px}
.axiom-wave path{animation:axiomDrift 30s linear infinite alternate}
@media (prefers-reduced-motion:reduce){ .axiom-ring1,.axiom-ring2,.axiom-ring3,.axiom-ring4,.axiom-ring5,.axiom-dot,.axiom-core,.axiom-wave path{animation:none} }
@media (max-width:980px){
  .axiom-grid{grid-template-columns:1fr;justify-items:center;text-align:center}
  .axiom-left{min-height:auto;justify-content:center}
  .axiom-globe-wrap{display:none}
  .axiom-brandrow{display:flex;justify-content:center}
  .axiom-sub{justify-content:center}
  .axiom-card{max-width:440px}
}
@media (max-width:520px){ .axiom-word{font-size:42px} .axiom-slogan{font-size:24px} .axiom-page{padding:32px 18px} }

/* ---- Cash Advantage: customer printout ---- */
.doc.pv{padding:0;overflow:hidden;font-size:12px;line-height:1.45;color:#1a2233}
@media screen{ .doc.pv{min-width:760px} .modal-b:has(.doc.pv){overflow-x:auto} }
.pv-head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 28px;background:linear-gradient(120deg,var(--pv-deep),var(--pv-base));color:#fff}
.pv-brand{display:flex;align-items:center;gap:12px}
.pv-mark{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:.04em}
.pv-dealer{font-size:17px;font-weight:700;letter-spacing:-.01em}
.pv-lender{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.8}
.pv-title{text-align:right}
.pv-doc{font-size:14px;font-weight:700}
.pv-sub{font-size:11px;opacity:.85}
.pv-terms{display:flex;flex-wrap:wrap;gap:0;margin:0 28px;border:1px solid #e3e8ef;border-top:0;border-radius:0 0 12px 12px;background:#fafbfd}
.pv-terms > div{flex:1;min-width:100px;padding:9px 14px;border-right:1px solid #e3e8ef}
.pv-terms > div:last-child{border-right:0}
.pv-terms span,.pv-facts span,.pv-path span{display:block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#667085}
.pv-terms strong{font-size:13px}
.pv-hero{margin:16px 28px 0;border-radius:16px;padding:20px 24px;background:linear-gradient(125deg,var(--pv-deep),var(--pv-base));color:#fff;display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:center;break-inside:avoid}
.pv-hero:not(:has(.pv-paths)){grid-template-columns:1fr}
.pv-eyebrow{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;opacity:.8}
.pv-big{font-size:46px;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin:6px 0 4px}
.pv-hero-sub{font-size:12px;opacity:.92;max-width:44ch}
.pv-basis{display:inline-block;margin-top:9px;font-size:10px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3)}
.pv-paths{display:grid;gap:8px}
.pv-path{padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);opacity:.85}
.pv-path span{color:rgba(255,255,255,.8)}
.pv-path strong{display:block;font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.pv-path em{font-style:normal;font-size:10.5px;opacity:.85}
.pv-path.win{opacity:1;background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.55)}
.pv-two{display:grid;grid-template-columns:1fr 1.15fr;gap:14px;margin:14px 28px 0;break-inside:avoid}
.pv-card,.pv-plan{border:1px solid #e3e8ef;border-radius:14px;padding:13px 16px;background:#fff}
.pv-card-h{font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#667085;margin-bottom:6px}
.pv-line{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #eef1f5;font-size:11.5px}
.pv-line:last-child{border-bottom:0}
.pv-line strong{white-space:nowrap}
.pv-line .pos{color:#0a7546}
.pv-line.total{border-top:2px solid #1a2233;border-bottom:0;margin-top:2px;padding-top:8px;font-weight:700;font-size:12.5px}
.pv-line.total strong{color:var(--pv-base);font-size:16px}
.pv-note{font-size:10px;color:#667085;margin:6px 0 0}
.pv-chartcard .ca-chart{margin-top:2px}
.pv-chartcard .ca-legend{font-size:10px;color:#4b5768;gap:12px}
.pv-plan.win{border:2px solid var(--pv-base);background:var(--pv-soft)}
.pv-plan-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-size:13px}
.pv-plan-h span{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:#eef1f5;color:#4b5768}
.pv-plan.win .pv-plan-h span{background:var(--pv-base);color:#fff}
.doc.pv > .pv-chartcard{margin:14px 28px 0}
.pv-reasons{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:14px 28px 0;font-size:11px}
.pv-reasons > div{padding:8px 12px;border-left:3px solid var(--pv-base);background:#fafbfd;border-radius:0 8px 8px 0}
.pv-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 28px 0}
.pv-facts > div{border:1px solid #e3e8ef;border-radius:12px;padding:8px 12px;background:#fafbfd}
.pv-facts strong{font-size:13px}
.doc.pv > h3{margin:16px 28px 6px;font-size:10px;letter-spacing:.16em;color:#667085;border:0;padding:0}
.doc.pv .ca-ytable{margin:0 28px;width:calc(100% - 56px)}
.doc.pv .ca-ytable th{background:var(--pv-soft);color:#4b5768}
.pv-foot{margin:18px 28px 22px;break-inside:avoid}
.pv-sign{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-bottom:12px}
.pv-sign i{display:block;border-bottom:1px solid #98a2b3;height:26px}
.pv-sign span{font-size:9.5px;color:#667085;letter-spacing:.06em}
.pv-foot p{font-size:8.5px;color:#667085;line-height:1.45;margin:0 0 4px}
.pv-addr{font-size:9px;color:#98a2b3}
@media print{
  .doc.pv{padding:0 !important;font-size:11px}
  .doc.pv .pv-big{font-size:40px}
  .doc.pv .pv-hero{margin-top:12px;padding:16px 20px}
  .doc.pv .pv-two,.doc.pv .pv-facts,.doc.pv .pv-reasons,.doc.pv > .pv-chartcard{margin-top:10px}
  .doc.pv .ca-ytable th,.doc.pv .ca-ytable td{padding:3px 6px;font-size:9.5px}
}
/* ---- Cash Advantage: customer screen ---- */
.cx{min-height:100vh;background:radial-gradient(1200px 600px at 85% -10%,var(--cd-surface-3),transparent 60%),var(--cd-surface);color:var(--cd-text);font-feature-settings:"tnum" 1}
.cx .cx-ic{width:22px;height:22px;flex:0 0 22px}
.cx-head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px clamp(18px,3vw,48px);border-bottom:1px solid var(--cd-border);background:var(--cd-surface-2)}
.cx-brand{display:flex;align-items:center;gap:14px}
.cx-mark{width:46px;height:46px;border-radius:12px;background:linear-gradient(140deg,var(--cd-head-a),var(--cd-head-b));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:.04em;box-shadow:0 6px 18px rgba(10,20,40,.18)}
.cx-dealer{font-size:clamp(16px,1.3vw,20px);font-weight:700;letter-spacing:-.01em}
.cx-lender{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--cd-muted);margin-top:2px}
.cx-meta{text-align:right;font-size:13px;color:var(--cd-muted)}
.cx-meta strong{color:var(--cd-text)}
.cx-main{flex:1;width:100%;max-width:1400px;margin:0 auto;padding:clamp(18px,2.4vw,36px) clamp(18px,3vw,48px);display:flex;flex-direction:column;gap:clamp(14px,1.6vw,22px)}
.cx-eyebrow{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--cd-muted)}
.cx-eyebrow.light{color:rgba(255,255,255,.72)}
.cx-hero{position:relative;overflow:hidden;border-radius:22px;padding:clamp(22px,2.6vw,40px);color:#fff;
  background:linear-gradient(125deg,var(--cd-head-a) 0%,var(--cd-head-b) 100%);box-shadow:0 18px 50px rgba(10,20,40,.22);
  display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(18px,2.4vw,36px);align-items:center}
.cx-hero::after{content:"";position:absolute;right:-120px;top:-160px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 65%);pointer-events:none}
.cx-hero:not(:has(.cx-paths)){grid-template-columns:1fr}
.cx-big{font-size:clamp(56px,6.4vw,104px);font-weight:800;letter-spacing:-.045em;line-height:1;margin:10px 0 8px;text-shadow:0 2px 24px rgba(0,0,0,.18)}
.cx-hero.up .cx-big{color:#fff}
.cx-lead{font-size:clamp(15px,1.2vw,19px);opacity:.9;margin-top:8px}
.cx-hero-sub{font-size:clamp(14px,1.15vw,18px);opacity:.92;max-width:46ch}
.cx-basis{display:inline-block;margin-top:14px;font-size:12.5px;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2)}
.cx-paths{display:grid;gap:12px;position:relative;z-index:1}

.cx-path span{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}

@media print{
  /* The old visibility:hidden trick left every hidden element still taking
     up its normal layout height (visibility doesn't affect layout, only
     paint), so the print engine paginated across the whole app's height —
     one real page of content followed by several blank ones. Removing #root
     from the flow entirely fixes that; only the open modal prints. */
  #root{display:none !important}
  .modal-bg{position:static !important;inset:auto;background:#fff;padding:0;display:block}
  .modal{box-shadow:none;width:100%;max-width:none}
  .modal-h,.no-print{display:none !important}

     under a dozen lines) fits on a single sheet instead of spilling a

  @page{margin:0}

  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
/* The local calendar date (YYYY-MM-DD). toISOString() would give the UTC date,
   which in Ontario is already tomorrow from 8 PM (7 PM in winter). */
function localISO(d){ return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
function todayISO(){ return localISO(new Date()); }
function fmtDate(iso){ if(!iso) return "—";
  var d = new Date(iso + (iso.length === 10 ? "T12:00:00" : ""));
  return d.toLocaleDateString("en-CA",{year:"numeric",month:"short",day:"2-digit"}); }
function freqLabel(f){ return f === "biweekly" ? "bi-weekly" : "monthly"; }

function newTransaction(fsmUserId, dealershipId){
  return {
    id: uid("AX"), createdAt: todayISO(), type:"Finance", status:"Open",
    fsmUserId: fsmUserId || null, dealershipId: dealershipId || null,
    customer:{ id:null, name:"", phone:"", email:"", address:"" },
    vehicle:{ id:null, year:"", make:"", model:"", stock:"", vin:"", odometer:"", condition:"New", price:null },
    finance:{ tradeAllowance:0, tradePayout:0, downPayment:0, fees:[], feeAmount:0, rates:{}, terms:[], frequency:null },
    cash:{ tradeAllowance:0, tradePayout:0, downPayment:0, feeAmount:0 },
    lines:[],   /* { lineId, productId, term, km, interval, deductible, price, priceOverridden, packages{} } */
    display:{ mode:"welcome", showPayment:true, showPrices:false, showConfig:false, selection:null },
    offers:{ discount:{ enabled:false, scope:"package", type:"percent", deal:0, packages:{ preferred:0, essential:0, basic:0 } }, gifts:[] }
  };
}
function primaryTerm(tx){
  var ts = (tx.finance.terms || []).slice().sort(function(a,b){ return a-b; });
  return ts.length ? ts[0] : null;
}
function sortedTerms(tx){ return (tx.finance.terms || []).slice().sort(function(a,b){ return a-b; }); }

function productById(state, id){
  for (var i=0;i<state.products.length;i++) if (state.products[i].id === id) return state.products[i];
  return null;
}
function priceFor(product, line){
  if (!product || !product.pricing) return null;
  var p = product.pricing, total = Number(p.base || 0), part;
  function need(flag, key, val){
    if (!flag) return true;
    if (val === null || val === undefined || val === "") return false;
    part = p[key] ? p[key][val] : undefined;
    if (part === undefined) return false;
    total += part; return true;
  }
  if (!need(product.uses.term, "term", line.term)) return null;
  if (!need(product.uses.km, "km", line.km)) return null;
  if (!need(product.uses.interval, "interval", line.interval)) return null;
  if (!need(product.uses.deductible, "deductible", line.deductible)) return null;
  return Math.round(total);
}
function taxRateFor(product, taxCfg){
  if (!product || product.taxRule === "exempt") return 0;
  if (product.taxRule === "vrc") return Number(taxCfg.vrc)/100;
  return Number(taxCfg.standard)/100;
}
function periodsPerYear(freq){ return freq === "biweekly" ? 26 : 12; }
function payment(principal, aprPct, months, freq){
  if (!principal || principal <= 0 || !months) return 0;
  var ppy = periodsPerYear(freq), n = Math.round(months/12*ppy), r = (Number(aprPct)||0)/100/ppy;
  if (n <= 0) return 0;
  if (r === 0) return principal / n;
  return principal * r / (1 - Math.pow(1+r,-n));
}
/* A dealership's brand: a listed brand, or "custom" (its own name), with an optional
   header text that overrides the default lender line on the customer display. */
function brandOfDealer(d){
  d = d || {};
  var base;
  if (d.brandKey === "custom"){
    var nm = String(d.customBrandName || "").trim() || "Dealership";
    base = { key:"custom", label:nm, mark:nm.slice(0,3).toUpperCase(), color:"#2c5a9b", finLabel:"FINANCIAL SERVICES" };
  } else base = D.BRANDS[d.brandKey] || D.BRANDS.nissan;
  var t = String(d.headerTitle || "").trim();
  return t ? Object.assign({}, base, { finLabel:t.toUpperCase() }) : base;
}
function brandOf(state){ return brandOfDealer(state.config || {}); }
function packageLabel(state, suffix){
  return (brandOf(state).label + " " + suffix).toUpperCase();
}

/* -------- offers: a real discount and complimentary gifts --------
   The discount is a genuine price reduction: it lowers the package subtotal,
   the tax on it, the amount financed and the payments, and it flows into
   reports. Gifts are free to the customer; their cost (if entered) comes off
   the dealer's gross. Older deals have no offers, so read them defensively. */
function normOffers(o){
  o = o || {};
  var d = o.discount || {};
  var pk = d.packages || {};
  var vals = { preferred:Number(pk.preferred)||0, essential:Number(pk.essential)||0, basic:Number(pk.basic)||0 };
  var anyVal = (Number(d.deal) || 0) > 0 || vals.preferred > 0 || vals.essential > 0 || vals.basic > 0;
  return {
    discount:{ enabled: d.enabled === undefined ? anyVal : !!d.enabled,
      scope: d.scope === "deal" ? "deal" : "package", type: d.type === "amount" ? "amount" : "percent",
      deal: Number(d.deal) || 0, packages:vals },
    gifts: Array.isArray(o.gifts) ? o.gifts : []
  };
}
function discountFor(o, pkgKey, base){
  var d = o.discount, v = d.scope === "deal" ? d.deal : (d.packages[pkgKey] || 0);
  if (!d.enabled || !(v > 0) || !(base > 0)) return 0;
  var amt = d.type === "percent" ? base * Math.min(v, 100) / 100 : v;
  return Math.round(Math.min(amt, base) * 100) / 100;
}
function giftsFor(o, pkgKey){
  return o.gifts.filter(function(g){ return g && g.name && g.packages && g.packages[pkgKey]; });
}
function giftCostOf(list){ return Math.round(list.reduce(function(a, g){ return a + (Number(g.cost) || 0); }, 0) * 100) / 100; }

function hasListCost(prod){ return !!prod && prod.cost !== null && prod.cost !== undefined && prod.cost !== "" && !isNaN(Number(prod.cost)); }

/* -------- the single totals engine -------- */
function totals(state, tx){
  var taxCfg = state.config.tax, fin = state.config.finance;
  var lines = [], sub = 0, taxStd = 0, taxVrc = 0, cost = 0, unpriced = 0, i;
  /* Which package did the customer actually buy? Until one is recorded every packaged product counts
     (older deals); once recorded, only that package's products are "sold". "none" = nothing bought. */
  var selRaw = (tx.display && tx.display.selection) ? tx.display.selection.package : null;
  var selKey = (selRaw === "preferred" || selRaw === "essential" || selRaw === "basic" || selRaw === "none") ? selRaw : null;
  var presentedTerms = sortedTerms(tx);

  for (i=0;i<tx.lines.length;i++){
    var l = tx.lines[i], prod = productById(state, l.productId);
    if (!prod) continue;
    if (!l.packages) l.packages = { preferred:true, essential:false, basic:false };
    if (l.declined === undefined) l.declined = false;
    var configured = priceFor(prod, l);
    var price = (l.price === null || l.price === undefined || l.price === "") ? configured : Number(l.price);
    var rate = taxRateFor(prod, taxCfg);
    var priced = !(price === null || price === undefined || isNaN(price));
    var anyPkg = l.packages.preferred || l.packages.essential || l.packages.basic;
    if (!priced && !l.declined && anyPkg) unpriced++;
    var amount = priced ? price : 0;
    var tax = Math.round(amount*rate*100)/100;
    /* Cost is a flat dollar figure for providing this product on the deal —
       it does not scale with whichever term/km/deductible the customer
       picked. Real per-tier dealer cost sheets exist, but the FSM asked for
       one simple optional number rather than a full cost table; that's a
       future refinement (mirroring the pricing table) if ever needed. */
    /* Dealer cost comes from the product list; if the list has none, the Finance Manager can
       enter one for this deal only (line.cost). Missing cost still counts as $0. */
    var listCost = hasListCost(prod);
    var lineCost = priced ? (listCost ? Number(prod.cost) : (Number(l.cost) || 0)) : 0;
    var sold = !l.declined && anyPkg && (selKey === null || (selKey !== "none" && !!l.packages[selKey]));
    if (sold){
      if (prod.taxRule === "vrc") taxVrc += tax; else taxStd += tax;
      sub += amount; cost += lineCost;
    }
    var termForDay = (prod.uses.term && l.term) ? Number(l.term) : (primaryTerm(tx) || 60);
    var days = termForDay * 30.44;
    var perDay = (priced && days > 0) ? Math.round((amount/days)*100)/100 : null;
    var perDayByTerm = (presentedTerms.length ? presentedTerms : [termForDay]).map(function(tm){
      var d = tm * 30.44;
      return { term:tm, perDay: (priced && d > 0) ? Math.round((amount/d)*100)/100 : null };
    });
    lines.push({ lineId:l.lineId, product:prod, cfg:l, price: priced ? amount : null, configuredPrice:configured,
      sold:sold, costMissing: !listCost && !(Number(l.cost) > 0), overridden: !!l.priceOverridden, rate:rate, ratePct:Math.round(rate*10000)/100, tax:tax, perDayByTerm:perDayByTerm,
      total:Math.round((amount+tax)*100)/100, cost:lineCost, gross:priced?Math.round((amount-lineCost)*100)/100:null, perDay:perDay });
  }

  var productsSub = Math.round(sub*100)/100;
  var offers = normOffers(tx.offers);
  var aggDisc = 0, aggGifts;
  if (offers.discount.scope === "deal") aggDisc = discountFor(offers, null, productsSub);
  else if (selKey){
    var selBase = 0;
    lines.forEach(function(L){ if ((L.cfg.packages||{})[selKey] && L.price !== null) selBase += L.price; });
    aggDisc = Math.min(discountFor(offers, selKey, selBase), productsSub);
  }
  aggGifts = selKey ? giftsFor(offers, selKey)
    : offers.gifts.filter(function(g){ return g && g.name && g.packages && g.packages.preferred && g.packages.essential && g.packages.basic; });
  var aggGiftCost = giftCostOf(aggGifts);
  var aggFactor = productsSub > 0 ? (productsSub - aggDisc) / productsSub : 1;
  taxStd = taxStd * aggFactor; taxVrc = taxVrc * aggFactor;
  var productsNet = Math.round((productsSub - aggDisc)*100)/100;
  var productsTax = Math.round((taxStd+taxVrc)*100)/100;
  var productsTotal = Math.round((productsNet+productsTax)*100)/100;

  var vPrice = Number(tx.vehicle.price)||0;
  /* No vehicle price yet means there's no deal to speak of — don't let the
     admin fee/licensing/tax show up as a phantom balance on a brand new,
     untouched transaction before the FSM has entered anything. */
  var adminFee = vPrice > 0 ? (Number(fin.adminFee)||0) : 0, lic = vPrice > 0 ? (Number(fin.licensing)||0) : 0;
  var isCash = tx.type === "Cash";
  var src = isCash ? (tx.cash||{}) : tx.finance;
  var tradeAll = Number(src.tradeAllowance)||0, tradePay = Number(src.tradePayout)||0, down = Number(src.downPayment)||0;
  var fees = isCash ? [] : (tx.finance.fees || []);
  var feeAmount = Number(src.feeAmount) || 0;
  var feesTotal = Math.round((fees.reduce(function(sum, f){ return sum + (Number(f.amount)||0); }, 0) + feeAmount) * 100) / 100;
  var taxableVehicle = Math.max(0, vPrice + adminFee - tradeAll);
  var vehicleTax = Math.round(taxableVehicle*(Number(taxCfg.standard)/100)*100)/100;
  var baseAmount = Math.max(0, vPrice + adminFee + vehicleTax + lic - tradeAll + tradePay - down + feesTotal);
  var financed = isCash ? null : Math.round((baseAmount + productsTotal)*100)/100;
  var cashDueTotal = isCash ? Math.round((baseAmount + productsTotal)*100)/100 : null;

  var terms = isCash ? [] : presentedTerms, rates = isCash ? {} : (tx.finance.rates || {});
  var freq = isCash ? null : (tx.finance.frequency || null);

  function quotesFor(extraTotal){
    if (isCash || !freq || !terms.length) return [];
    return terms.map(function(tm){
      var rateRaw = rates[tm];
      var hasRate = !(rateRaw === undefined || rateRaw === null || rateRaw === "");
      var rate = hasRate ? Number(rateRaw) : null;
      var paymentsCount = Math.round(tm/12*periodsPerYear(freq));
      if (!hasRate){
        return { term:tm, frequency:freq, rate:null, basePayment:null, payment:null, difference:null, paymentsCount:paymentsCount };
      }
      var base = payment(baseAmount, rate, tm, freq);
      var full = payment(baseAmount + extraTotal, rate, tm, freq);
      return { term:tm, frequency:freq, rate:rate, basePayment:Math.round(base*100)/100,
        payment:Math.round(full*100)/100, difference:Math.round((full-base)*100)/100,
        paymentsCount:paymentsCount };
    });
  }

  /* -------- the three presentation packages -------- */
  var anyPackaged = lines.some(function(L){
    var p = L.cfg.packages || {}; return p.preferred || p.essential || p.basic;
  });
  var packages = D.PACKAGES.map(function(def){
    var pl = lines.filter(function(L){ return (L.cfg.packages||{})[def.key]; });
    var s = 0, tx1 = 0, c = 0, missing = false;
    pl.forEach(function(L){
      if (L.price === null) { missing = true; return; }
      s += L.price; tx1 += L.tax; c += L.cost;
    });
    var listSub = Math.round(s*100)/100;
    var disc = discountFor(offers, def.key, listSub);
    var pf = listSub > 0 ? (listSub - disc) / listSub : 1;
    var netSub = Math.round((listSub - disc)*100)/100, netTax = Math.round(tx1*pf*100)/100;
    var pGifts = giftsFor(offers, def.key), pGiftCost = giftCostOf(pGifts);
    var tot = Math.round((netSub+netTax)*100)/100;
    return { key:def.key, suffix:def.suffix, blurb:def.blurb, label:packageLabel(state, def.suffix),
      lines:pl, count:pl.length, hasUnpriced:missing,
      listSub:listSub, discount:disc, discountPct: listSub > 0 ? Math.round(disc/listSub*1000)/10 : 0,
      gifts:pGifts, giftCost:pGiftCost,
      sub:netSub, tax:netTax, total:tot,
      cost:c, gross:Math.round((netSub-c-pGiftCost)*100)/100, quotes:quotesFor(tot),
      dueTotal: isCash ? Math.round((baseAmount+tot)*100)/100 : null };
  });

  return {
    lines:lines, soldLines:lines.filter(function(L){ return L.sold; }), selectedPackage:selKey, unpricedCount:unpriced, packages:packages, packagesUsed:anyPackaged,
    productsSub:productsSub, productsDiscount:aggDisc, productsNet:productsNet, giftCost:aggGiftCost, offers:offers,
    taxStandard:Math.round(taxStd*100)/100, taxVrc:Math.round(taxVrc*100)/100,
    productsTax:productsTax, productsTotal:productsTotal, productCost:cost,
    productGross:Math.round((productsNet-cost-aggGiftCost)*100)/100,
    vehiclePrice:vPrice, adminFee:adminFee, licensing:lic, vehicleTax:vehicleTax,
    tradeAllowance:tradeAll, tradePayout:tradePay, downPayment:down,
    baseAmount:Math.round(baseAmount*100)/100, amountFinanced:financed, isCash:isCash, cashDueTotal:cashDueTotal,
    fees:fees, feeAmount:feeAmount, feesTotal:feesTotal, terms:terms, term:primaryTerm(tx), rates:rates, frequency:freq,
    quotes:quotesFor(productsTotal), baseQuotes:quotesFor(0)
  };
}

/* Each error also comes back as an "issue" saying which step it belongs to and which field
   to jump to, so the Finance screen can mark the problem fields and scroll to the first one.
   step "fm" is the Finance Manager picker in the toolbar; 5 is the customer's package choice. */
function validate(state, tx){
  var t = totals(state, tx), errs = [], warns = [], issues = [];
  function fail(msg, step, target, more){
    errs.push(msg);
    var it = { msg:msg, step:step, target:target };
    for (var k in (more || {})) it[k] = more[k];
    issues.push(it);
  }
  if (!tx.fsmUserId) fail("Assign a Finance Manager to this deal before completing it.", "fm", '[data-bind="tx.fsmUserId"]');
  if (!tx.customer.name) fail("Add a customer before completing the transaction.", 1, '[data-bind="tx.customer.name"]');
  if (!tx.vehicle.model || !tx.vehicle.stock) fail("Enter the vehicle model and stock number.", 2,
    !tx.vehicle.model ? '[data-bind="tx.vehicle.model"]' : '[data-bind="tx.vehicle.stock"]');
  if (!tx.vehicle.price) fail("Enter the vehicle selling price.", 2, '[data-bind="tx.vehicle.price"]');
  if (tx.type !== "Cash"){
    if (!t.terms.length) fail("Select at least one finance term to present.", 3, "#term-chips");
    if (!tx.finance.frequency) fail("Select a payment frequency.", 3, "#freq-chips");
    t.terms.forEach(function(tm){
      var r = (tx.finance.rates || {})[tm];
      if (r === undefined || r === null || r === "") fail("Enter the interest rate for " + tm + " months.", 3, '[data-act="term-rate"][data-term="' + tm + '"]');
    });
  }
  if (t.packagesUsed && !t.selectedPackage) fail("Select the package the customer chose, or \"Customer didn't buy a package\", before completing the deal.", 5, "#step-choice");
  if (!tx.lines.length) warns.push("No products are selected. The customer display will show the welcome screen only.");
  else if (!t.packagesUsed) warns.push("No product has been assigned to a package yet, so the customer display is showing every selected product as one package.");
  for (var i=0;i<t.lines.length;i++){
    var L = t.lines[i], p = L.product, c = L.cfg;
    if (c.declined) continue;
    if (!(c.packages && (c.packages.preferred || c.packages.essential || c.packages.basic))) continue;
    var row = '.mg-row[data-pid="' + p.id + '"]', at = function(f){ return '[data-bind="line:' + c.lineId + ':' + f + '"]'; };
    var opt = { product:p.id, row:row, cfg:true };
    if (p.uses.term && !c.term) fail(p.name + ": select a term.", 4, at("term"), opt);
    if (p.uses.km && !c.km) fail(p.name + ": select kilometres.", 4, at("km"), opt);
    if (p.uses.interval && !c.interval) fail(p.name + ": select a maintenance interval.", 4, at("interval"), opt);
    if (p.uses.deductible && (c.deductible === null || c.deductible === undefined || c.deductible === "")) fail(p.name + ": select a deductible.", 4, at("deductible"), opt);
    if (L.price === null) fail(p.name + ": price is not configured — enter a price to continue.", 4, at("price"), { product:p.id, row:row });
  }
  return { ok: errs.length === 0, errors:errs, issues:issues, warnings:warns, totals:t };
}

/* Key-order-independent JSON: a deal that has been through the database (which reorders
   keys) must still compare equal to the same deal on screen. */
function stableJSON(v){
  if (v === null || v === undefined || typeof v !== "object") return JSON.stringify(v === undefined ? null : v);
  if (Array.isArray(v)) return "[" + v.map(stableJSON).join(",") + "]";
  return "{" + Object.keys(v).filter(function(k){ return v[k] !== undefined; }).sort()
    .map(function(k){ return JSON.stringify(k) + ":" + stableJSON(v[k]); }).join(",") + "}";
}
/* What a deal "says", ignoring bookkeeping (status, dates, who saved it) and which screen the
   customer display is on. Two deals with the same signature need no saving. */
function dealSig(d){
  if (!d) return "";
  var c = clone(d);
  delete c.status; delete c.createdAt; delete c.savedAt; delete c.savedBy;
  if (c.display) delete c.display.mode;
  c.offers = normOffers(c.offers);
  return stableJSON(c);
}


/* ---------------- CASH ADVANTAGE (cash-to-finance comparison) ----------------
   Calendar-year total returns in CAD, 1990–2025.
   S&P 500: total return in USD (Damodaran, NYU Stern) converted to CAD with
   December USD/CAD averages (Federal Reserve EXCAUS).
   S&P/TSX Composite: total return from 2018; before 2018 the price return plus
   an estimated 2.5% a year of dividends. */
var MARKET_FIRST_YEAR = 1990;
var MARKETS = {
  sp500: { label:"S&P 500", long:"S&P 500 (in Canadian dollars)", returns:[-3.14,28.7,19.28,15.01,5.78,35.22,22.04,39.44,38.79,15.32,-5.96,-8.55,-22.94,8.08,2.82,-0.11,14.78,-8.34,-21.89,7.57,9.85,3.66,12.07,42.04,23.05,20.55,8.72,16.41,0.77,28.6,14.79,28.38,-13.01,24.49,32.62,14.04] },
  tsx:   { label:"TSX", long:"S&P/TSX Composite (Canada)", returns:[-15.46,10.35,-2.11,31.48,0,14.36,28.24,15.53,-0.69,32.22,8.68,-11.44,-11.47,26.79,14.98,24.41,17.01,9.66,-32.53,33.19,16.44,-8.17,6.5,12.05,9.92,-8.59,20.01,8.53,-8.89,22.88,5.6,25.09,-5.84,11.75,21.65,31.46] }
};
function periodRate(pct, ppy){ return Math.pow(1 + pct/100, 1/ppy) - 1; }
function monthlyFromAnnual(pct){ return periodRate(pct, 12); }
/* One growth rate per payment period (12 or 26 a year), from the yearly returns. */
function marketPeriods(key, ppy){
  var out = [];
  MARKETS[key].returns.forEach(function(r){ var m = periodRate(r, ppy); for (var i = 0; i < ppy; i++) out.push(m); });
  return out;
}
function caFreq(o){ return o.freq === "biweekly" ? "biweekly" : "monthly"; }
/* The customer's cash goes into an investment account today and every car
   payment is taken out of that account. Paying cash leaves $0 to invest, so
   what is left (less any loan still owing) is the advantage of financing:
     advantage = investment earnings − loan interest paid − cash discount given up
   Everything steps one payment period at a time (monthly or bi-weekly).
   `start` (periods since Jan of MARKET_FIRST_YEAR) only labels the years. */
var CA_MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function caPeriodLabel(s, ppy){ ppy = ppy || 12; return CA_MON[Math.floor((s % ppy) * 12 / ppy)] + " " + (MARKET_FIRST_YEAR + Math.floor(s/ppy)); }
function caRun(o, rates, start){
  var freq = caFreq(o), ppy = periodsPerYear(freq);
  var amount = Number(o.amount)||0, lost = Number(o.lost)||0, cash = Math.max(0, amount - lost);
  var term = Number(o.term)||0, apr = Number(o.apr)||0, N = rates.length, n = Math.round(term/12*ppy);
  var pmt = payment(amount, apr, term, freq), lr = apr/100/ppy;
  var acct = cash, bal = amount, earnTot = 0, intTot = 0, paidTot = 0, payCount = 0, growthAll = 1;
  /* Budget view: the cash stays invested untouched (unt) and payments come from income;
     the cash buyer invests those same payments instead (port). unt − loan owing − port = advantage. */
  var unt = cash, port = 0;
  var acctPath = [acct], loanPath = [bal], untPath = [unt], portPath = [0], years = [];
  var yr = { start:acct, earn:0, pay:0, int:0, growth:1, from:1 };
  for (var t = 1; t <= N; t++){
    var e = acct * rates[t-1];
    acct += e; earnTot += e; yr.earn += e; yr.growth *= 1 + rates[t-1]; growthAll *= 1 + rates[t-1];
    unt *= 1 + rates[t-1]; port *= 1 + rates[t-1];
    if (t <= n && bal > 0){
      var i = bal * lr, p = t === n ? bal + i : Math.min(pmt, bal + i);
      bal = bal + i - p; acct -= p; intTot += i; paidTot += p; yr.pay += p; yr.int += i; payCount++; port += p;
    }
    acctPath.push(acct); loanPath.push(bal); untPath.push(unt); portPath.push(port);
    if (t % ppy === 0 || t === N){
      var label = typeof start === "number"
        ? caPeriodLabel(start + yr.from - 1, ppy) + " – " + caPeriodLabel(start + t - 1, ppy) : null;
      years.push({ n:years.length + 1, label:label, ret:(yr.growth - 1)*100, start:yr.start, earn:yr.earn,
        pay:yr.pay, int:yr.int, end:acct, owing:bal, periods:t - yr.from + 1, unt:unt, port:port });
      yr = { start:acct, earn:0, pay:0, int:0, growth:1, from:t + 1 };
    }

/* A step ticks only when that part of the deal is really finished: finance setup needs a
   selling price to work from (its term and rate are pre-filled, so they alone prove nothing),
   and Presentation needs the customer's package choice recorded. "bad" marks the steps
   holding a problem once Complete has been pressed (state.ui.finCheck). */
function stepState(tx, v){
  var t = v.totals, has = function(n){ return v.issues.some(function(i){ return i.step === n; }); };
  var priced = Number(tx.vehicle.price) > 0, check = !!state.ui.finCheck;
  var chosen = t.selectedPackage !== null || (!t.packagesUsed && tx.lines.length > 0);
  return [
    { n:1, label:"Customer", done: !has(1), bad: check && has(1) },
    { n:2, label:"Vehicle", done: !has(2), bad: check && has(2) },
    { n:3, label:tx.type==="Cash"?"Cash setup":"Finance setup", done: priced && !has(3), bad: check && has(3) },
    { n:4, label:"Products & packages", done: tx.lines.length > 0 && !has(4), bad: check && has(4) },
    { n:5, label:"Present & close", done: chosen, bad: check && has(5), target: !chosen && t.packagesUsed ? "step-choice" : "step-5" }
  ];
}
function selectOptions(list, current, fmt){
  return list.map(function(v){ return `<option value="${v}" ${String(current)===String(v)?"selected":""}>${esc(fmt?fmt(v):v)}</option>`; }).join("");

/* Money fields on the Finance screen are text boxes showing "$42,995.00" (or "1,885.00" beside a
   "$" prefix). Focusing one swaps in the plain number to edit, from data-raw (see the focusin

  var has = v !== null && v !== undefined && v !== "" && !isNaN(Number(v));

}

function parseList(s){
  if (!s) return [];
  return String(s).split(",").map(function(x){ return Number(String(x).replace(/[^0-9.\-]/g,"")); }).filter(function(x){ return !isNaN(x); });
}
function saveProduct(){
  var p = state.ui.productEdit, root = document.querySelector(".modal");
  if (!p || !root) return;
  function f(k){ return root.querySelector('[data-pf="'+k+'"]'); }
  var name = f("name").value.trim();
  if (!name){ toast("Give the product a name before saving.","err"); return; }
  p.name = name;
  p.code = f("code").value.trim() || name.slice(0,3).toUpperCase();
  p.category = f("category").value.trim() || "General";
  p.taxRule = f("taxRule").value;
  p.desc = f("desc").value.trim();
  p.benefit = f("benefit").value.trim();
  p.active = f("active").checked;
  var costRaw = f("cost").value;
  p.cost = costRaw === "" ? null : (Number(costRaw) || 0);
  p.uses = { term:f("use-term").checked, km:f("use-km").checked, interval:f("use-interval").checked, deductible:f("use-deductible").checked };
  p.terms = parseList(f("terms").value).filter(function(x){ return x>0 && x<=120; });
  p.kms = parseList(f("kms").value);
  p.intervals = parseList(f("intervals").value);
  p.deductibles = parseList(f("deductibles").value);
  var baseRaw = f("base").value;
  if (baseRaw === "") p.pricing = null;
  else {
    var pricing = { base:Number(baseRaw)||0, term:{}, km:{}, interval:{}, deductible:{} };
    var adders = root.querySelectorAll("[data-pa]");
    for (var i=0;i<adders.length;i++){
      var parts = adders[i].getAttribute("data-pa").split(":");
      pricing[parts[0]][parts[1]] = Number(adders[i].value)||0;
    }
    ["term","km","interval","deductible"].forEach(function(k){
      var list = k==="term"?p.terms:k==="km"?p.kms:k==="interval"?p.intervals:p.deductibles;
      if (!p.uses[k]){ delete pricing[k]; return; }
      list.forEach(function(o){ if (pricing[k][o] === undefined) pricing[k][o] = 0; });
    });
    p.pricing = pricing;
  }
  if (!p.id){ p.id = C.uid("p"); state.products.push(p); }
  else for (var j=0;j<state.products.length;j++) if (state.products[j].id === p.id) state.products[j] = p;
  state.ui.productEdit = null;
  toast("Product saved.","ok");
  commit();
}

function presetRange(period){
  var now = new Date(), to = C.todayISO(), from;
  if (period === "daily") from = to;
  else if (period === "weekly"){ var wk = new Date(now); wk.setDate(wk.getDate() - 6); from = C.localISO(wk); }
  else if (period === "monthly") from = to.slice(0,7) + "-01";
  else from = to.slice(0,4) + "-01-01";
  return { from:from, to:to };
}
function canSeeAllReports(){
  return V.isAdmin();
}
function filteredDeals(){
  var f = state.ui.reports;
  if (!f.from || !f.to){ var r = presetRange(f.period); f.from = f.from||r.from; f.to = f.to||r.to; }
  var pool = (V.isMaster() && f.dealership === "all") ? V.allDeals() : V.dealsForStore();
  /* An FSM only ever sees their own deals here — "all" or someone else's
     selection is only honoured for a GM, FSM Manager or master admin. */
  var fsmFilter = canSeeAllReports() ? f.fsm : state.currentUserId;
  return pool.filter(function(d){
    if (d.createdAt < f.from || d.createdAt > f.to) return false;
    if (fsmFilter !== "all" && d.fsmUserId !== fsmFilter) return false;
    if (f.type !== "all" && d.type !== f.type) return false;
    if (f.product !== "all" && !C.totals(state, d).soldLines.some(function(L){ return L.product.id === f.product; })) return false;
    return true;
  });
}
function viewReports(){
  var f = state.ui.reports, deals = filteredDeals(), i, j;
  var gross = 0, retail = 0, productCount = 0, withProduct = 0, byFsm = {}, byProduct = {};

    gross += t.productGross; retail += t.productsSub; productCount += t.soldLines.length;
    if (t.soldLines.length) withProduct++;
    if (!byFsm[d.fsmUserId]) byFsm[d.fsmUserId] = { deals:0, gross:0, retail:0, products:0 };
    byFsm[d.fsmUserId].deals++; byFsm[d.fsmUserId].gross += t.productGross;
    byFsm[d.fsmUserId].retail += t.productsSub; byFsm[d.fsmUserId].products += t.soldLines.length;
    for (j=0;j<t.soldLines.length;j++){
      var L = t.soldLines[j];
      if (!byProduct[L.product.id]) byProduct[L.product.id] = { n:0, retail:0, gross:0 };
      byProduct[L.product.id].n++; byProduct[L.product.id].retail += (L.price||0); byProduct[L.product.id].gross += (L.price||0)-L.cost;

  var fsmRows = Object.keys(byFsm).map(function(k){ return { u:userById(k), v:byFsm[k] }; }).sort(function(a,b){ return b.v.gross-a.v.gross; });

    <label class="f"><span>To</span><input type="date" value="${esc(f.to)}" data-bind="ui.reports.to"></label>
    ${V.isMaster() ? `<label class="f"><span>Dealership</span><select data-bind="ui.reports.dealership">

    ${canSeeAllReports() ? `<label class="f"><span>Finance Manager</span><select data-bind="ui.reports.fsm">

      ${state.users.filter(function(u){ return V.isDealOwnerRole(u.role); }).map(function(u){
        return `<option value="${u.id}" ${f.fsm===u.id?"selected":""}>${esc(u.name)}</option>`; }).join("")}</select></label>`
      : `<label class="f"><span>FSM</span><input type="text" value="${esc(V.currentUser().name)} (you)" disabled></label>`}
    <label class="f"><span>Product</span><select data-bind="ui.reports.product">
      <option value="all">All products</option>
      ${state.products.map(function(p){ return `<option value="${p.id}" ${f.product===p.id?"selected":""}>${esc(p.name)}</option>`; }).join("")}</select></label>
    <label class="f"><span>Transaction type</span><select data-bind="ui.reports.type">
      ${["all","Finance","Cash"].map(function(x){ return `<option value="${x}" ${f.type===x?"selected":""}>${x==="all"?"All types":x}</option>`; }).join("")}</select></label>
  </div></div></div>`;

  var kpis = `<div class="grid g4" style="margin-bottom:16px">
    ${V.kpiCard("Transactions", deals.length, C.fmtDate(f.from)+" to "+C.fmtDate(f.to))}
    ${V.kpiCard("Product gross", money0(gross), money0(retail)+" retail")}
    ${V.kpiCard("Products sold", productCount, deals.length ? Math.round(productCount/deals.length*100)/100+" per deal" : "—")}

  var body = deals.length ? `<div class="grid g2">

      <tbody>${fsmRows.map(function(r){ return `<tr><td>${esc(r.u.name)}<div class="tiny muted">${esc(r.u.role)}</div></td>

        <td class="right num">${money0(r.v.gross)}</td><td class="right num">${money0(r.v.gross/r.v.deals)}</td>
        <td><div class="bar"><i style="width:${Math.max(4,Math.round(r.v.gross/maxG*100))}%"></i></div></td></tr>`; }).join("")}
      </tbody></table></div></div></div>
    <div class="card"><div class="card-h"><h2>Product sales</h2></div><div class="card-b"><div class="tablewrap"><table>
      <thead><tr><th>Product</th><th class="right">Sold</th><th class="right">Retail</th><th class="right">Gross</th><th class="right">Penetration</th></tr></thead>

    <div class="card" style="margin-top:16px"><div class="card-h"><h2>Transactions</h2>
      <div class="sp"><span class="muted small">${deals.length} in range</span></div></div>

          <td><span class="tag">${esc(d.type)}</span></td><td>${esc(userById(d.fsmUserId).name)}</td>
          <td class="right num">${t.soldLines.length}</td><td class="right num">${money0(t.productsSub)}</td>
          <td class="right num">${money0(t.productGross)}</td>

/* Show only the fields that apply: a Salesperson has a username and a password you share;
   everyone else has an email and, by default, an invite link to set their own password. */
function syncUserForm(){
  var root = document.querySelector(".modal");
  if (!root) return;
  var roleEl = root.querySelector('[data-uf="role"]'), inv = root.querySelector('[data-uf="invite"]');
  var sp = !!roleEl && roleEl.value === "Salesperson", emailing = !sp && !!(inv && inv.checked);
  function show(id, on){ var e = root.querySelector(id); if (e) e.style.display = on ? "" : "none"; }
  show("#ufEmailBox", !sp); show("#ufUserBox", sp); show("#ufPwBox", !emailing); show("#ufAccessBox", !sp);
  var note = root.querySelector("#ufNote");
  if (note) note.textContent = sp
    ? "A Salesperson signs in to Axiom Pulse with a username and this password. Share both with them yourself; they can't be emailed."
    : emailing ? "They'll get an email with a button to set their own password, then sign in and get a short welcome walkthrough."
    : "No email will be sent. Share the temporary password with them; they'll choose their own the first time they sign in.";
}
function saveUser(){
  var root = document.querySelector(".modal");
  if (!root) return;
  function f(k){ var el = root.querySelector('[data-uf="'+k+'"]'); return el ? el : null; }
  var name = f("name").value.trim(), pw = f("password").value.trim();
  var role = f("role").value;
  var wantInvite = role !== "Salesperson" && !!(f("invite") && f("invite").checked);
  if (!name){ toast("Enter the user's name.","err"); return; }
  /* When emailing an invite the person sets their own password, so we use a random placeholder one. */
  if (wantInvite && !pw) pw = genTempPassword() + "!9";
  if (pw.length < 8){ toast("The temporary password needs at least 8 characters.","err"); return; }
  var payload = { action:"create", password:pw, name:name, role:role,
    dealership_id: role === "Master Administrator" ? null : (f("dealership").value || null) };
  if (role === "Salesperson"){
    var usernameEl = f("username");
    var username = usernameEl ? usernameEl.value.trim().toLowerCase() : "";
    if (!/^[a-z0-9._-]{3,30}$/.test(username)){ toast("Username must be 3-30 characters: letters, numbers, dots, underscores or hyphens only.","err"); return; }
    payload.username = username;
  } else {
    var emailEl = f("email");
    var email = emailEl ? emailEl.value.trim().toLowerCase() : "";
    if (!/^\S+@\S+\.\S+$/.test(email)){ toast("Enter a valid email address.","err"); return; }
    payload.email = email;
  }
  var access = f("access").value;
  var expDate = wheelDate(state.ui.inviteSel || defaultWheelSel(Date.now() + 7*86400000));
  if (access === "demo" && !(expDate.getTime() > Date.now())){ toast("Pick a demo end date and time in the future.","err"); return; }
  payload.access_type = access;
  payload.expires_at = access === "demo" ? expDate.toISOString() : null;
  var pulseBox = f("pulse");
  payload.pulse_enabled = role === "Salesperson" ? true : !!(pulseBox && pulseBox.checked);
  payload.cc_enabled = role !== "Salesperson";
  payload.app = "command";
  var inviteBox = f("invite");
  payload.send_invite = wantInvite;
  toast("Creating user…","info");
  adminCall(payload)
  .then(function(r){
    state.ui.userForm = false;
    var first = name.split(" ")[0];
    if (role !== "Salesperson"){
      inviteSecret = { title:"User created", first:first, email:payload.email, password:pw, url:"https://finance.rahulchamp.ca/", emailed:!!(r && r.invite_sent), setOwn:wantInvite };
    } else toast("User created — share the temporary username and password with " + first + ".","ok");
    refreshUsers(); commit(); })
  .catch(function(e){ toast(e.message, "err"); });
}

function deleteDealer(id){
  if (state.dealerships.length <= 1){ toast("Keep at least one dealership.","err"); return; }
  cloud.del.d.push(id); delete state.cloud.productsByDealer[id];
  state.dealerships = state.dealerships.filter(function(d){ return d.id !== id; });
  state.users.forEach(function(u){ if (u.dealershipId === id) u.active = false; });
  if (state.activeDealershipId === id){
    if (state.dealerships.length) V.setDealership(state.dealerships[0].id);
    else { state.activeDealershipId = null; state.config = null; state.tx = null; }
  }
  toast("Dealership removed. Its users were deactivated.","ok");
  commit();
}

   onlyKey = the package the customer chose (or null to list every package). */
function offersPrintBlock(t, onlyKey){
  var pk = t.packages.filter(function(p){ return !onlyKey || p.key === onlyKey; });
  var gifts = [], seen = {};
  pk.forEach(function(p){ (p.gifts || []).forEach(function(g){
    if (!seen[g.id]){ seen[g.id] = { g:g, pkgs:[] }; gifts.push(seen[g.id]); }

  }); });
  var disc = pk.filter(function(p){ return p.discount > 0; });
  if (!gifts.length && !disc.length) return "";
  var cap = function(x){ return String(x || "").split(" ").map(function(w){ return w.charAt(0) + w.slice(1).toLowerCase(); }).join(" "); };
