<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dealership Command Center — FSM Preview</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
/* ---- light (normal) mode: white + blue ---- */
:root{
  --blue:#1d61d8;
  --blue-2:#3d82f2;
  --blue-deep:#0d2f6b;
  --blue-ink:#ffffff;
  --bg:#f3f6fb;
  --surface:#ffffff;
  --surface-2:#f6f9fd;
  --surface-3:#eaf0f9;
  --text:#0d1b2e;
  --text-2:#33455f;
  --muted:#64748b;
  --border:#dbe3ef;
  --border-strong:#bfcbdd;
  --rail:#0c1d33;
  --rail-2:#16304f;
  --rail-text:#a9bcd4;
  --ok:#0a7546; --ok-bg:#e7f6ef; --ok-shadow:rgba(10,117,70,.28);
  --warn:#8a5106; --warn-bg:#fdf2e3;
  --danger:#b42318; --danger-bg:#fdecea;
  --info:#1d61d8; --info-bg:#e9f0fd;
  --shadow:0 1px 2px rgba(13,27,46,.05),0 10px 26px rgba(13,27,46,.07);
  --radius:11px;
}
/* ---- dark mode: black + blue ---- */
:root[data-theme="dark"]{
  --blue:#4c8dff; --blue-2:#79aaff; --blue-deep:#0a1b33; --blue-ink:#061020;
  --bg:#070c14; --surface:#0f1723; --surface-2:#131d2b; --surface-3:#1a2637;
  --text:#e9eff8; --text-2:#c2cee0; --muted:#8798ae; --border:#23324a; --border-strong:#35496a;
  --rail:#050a12; --rail-2:#111d30; --rail-text:#97a9c2;
  --ok:#4ec08d; --ok-bg:#0f271d; --ok-shadow:rgba(78,192,141,.28); --warn:#e2a862; --warn-bg:#2a2013; --danger:#f0897f; --danger-bg:#2b1614;
  --info:#79aaff; --info-bg:#122238;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 26px rgba(0,0,0,.42);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:17px} h3{font-size:15px} h4{font-size:13px}
p{margin:0 0 8px}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12px} .tiny{font-size:11px}
.right{text-align:right} .center{text-align:center} .nowrap{white-space:nowrap} .hidden{display:none !important}

.app{display:flex;min-height:100vh}
.rail{width:242px;flex:0 0 242px;background:var(--rail);color:var(--rail-text);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.rail-brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;gap:11px;align-items:center}
.badge-logo{width:38px;height:38px;border-radius:9px;background:linear-gradient(140deg,var(--blue),var(--blue-2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 38px}
.rail-brand .nm{color:#fff;font-weight:600;font-size:14px;line-height:1.25}
.rail-brand .sb{font-size:11px;color:var(--rail-text)}
.rail nav{padding:10px;flex:1}
.nav-group{font-size:10.5px;letter-spacing:.09em;color:#6d84a3;text-transform:uppercase;padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--rail-text);padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13.5px}
.nav-item:hover{background:var(--rail-2);color:#fff}
.nav-item.active{background:var(--rail-2);color:#fff;box-shadow:inset 3px 0 0 var(--blue)}
.nav-item .ic{width:18px;text-align:center;opacity:.9}
.nav-item .tagx{margin-left:auto;font-size:9.5px;border:1px solid rgba(255,255,255,.2);border-radius:4px;padding:1px 5px;color:#8fa3bf}
.rail-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08)}
.userchip{display:flex;gap:10px;align-items:center;padding:8px;border-radius:8px;background:var(--rail-2)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.userchip .nm{color:#fff;font-size:12.5px;font-weight:500}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.topbar .demo{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.view{padding:20px 22px 48px;max-width:1620px;width:100%}
.menu-btn{display:none}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card-b{padding:16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi{padding:14px 16px}
.kpi .lb{font-size:12px;color:var(--muted)}
.kpi .vl{font-size:26px;font-weight:600;margin-top:4px;letter-spacing:-.02em}
.kpi .dt{font-size:11.5px;color:var(--muted);margin-top:3px}
.btn{border:1px solid var(--border-strong);background:var(--surface);color:var(--text);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.dark{background:var(--rail);border-color:var(--rail);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-3)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--surface-3);color:var(--text-2);border:1px solid var(--border)}
.tag.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.tag.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.tag.danger{background:var(--danger-bg);color:var(--danger);border-color:transparent}
.tag.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.tag.demo{background:var(--warn-bg);color:var(--warn);border-color:transparent;font-weight:600;letter-spacing:.04em}
label.f{display:block;margin-bottom:12px}
label.f > span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=number],input[type=date],input[type=email],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface)}
textarea{font-family:inherit}
input:disabled,select:disabled{background:var(--surface-3);color:var(--muted)}
.inline{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.inline > *{flex:1;min-width:130px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.bar{height:7px;border-radius:4px;background:var(--surface-3);overflow:hidden;min-width:60px}
.bar > i{display:block;height:100%;background:var(--blue)}
.empty{padding:34px 18px;text-align:center;color:var(--muted)}
.notice{padding:11px 13px;border-radius:9px;font-size:13px;display:flex;gap:9px;align-items:flex-start}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.notice.err{background:var(--danger-bg);color:var(--danger)}
.notice.info{background:var(--info-bg);color:var(--info)}
.notice.ok{background:var(--ok-bg);color:var(--ok)}
.divider{height:1px;background:var(--border);margin:14px 0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:13px}
.kv .k{color:var(--muted)}
.kv.total{border-top:1px solid var(--border-strong);margin-top:6px;padding-top:9px;font-weight:600;font-size:15px}
.switch{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;cursor:pointer;user-select:none}
.switch input{accent-color:var(--blue);width:15px;height:15px}
.chiprow{display:flex;gap:7px;flex-wrap:wrap}
.termchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border-strong);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;background:var(--surface)}
.termchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.termchip input{display:none}

.uc{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 20px;text-align:center;gap:10px}
.uc .bigtag{font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--warn);background:var(--warn-bg);padding:8px 16px;border-radius:6px}

.fin-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.fin-toolbar .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.fin-split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
.fin-split.solo{grid-template-columns:minmax(0,1fr)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.step{display:flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid var(--border);border-radius:999px;background:var(--surface);font-size:12.5px;cursor:pointer}
.step .n{width:19px;height:19px;border-radius:50%;background:var(--surface-3);color:var(--text-2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.step.done .n{background:var(--ok);color:#fff}
.step.done{border-color:var(--ok)}
.stack{display:flex;flex-direction:column;gap:14px}
.prodrow{border:1px solid var(--border);border-radius:10px;padding:11px 12px;background:var(--surface-2)}
.prodrow + .prodrow{margin-top:10px}
.prodrow .ph{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.prodrow .ph .nm{font-weight:600}
.prodrow .ph .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.prodrow .phrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.prodrow .phrow .left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prodrow .phrow .right{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.prodrow .phrow .nm{font-weight:600}
.pkgpick{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;padding-top:9px;border-top:1px dashed var(--border)}
.prodrow2{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:1px solid var(--border);border-radius:10px;padding:12px 16px;background:var(--surface-2)}
.prodrow2 + .prodrow2{margin-top:10px}
.prodrow2 .pr-icon{flex:0 0 auto;width:34px;height:34px;border-radius:9px;background:linear-gradient(140deg,var(--blue),var(--blue-2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
.prodrow2 .pr-name{flex:1;min-width:180px}
.prodrow2 .pr-name .nm{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prodrow2 .pr-ctrls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pricebox{position:relative;width:112px}
.pricebox .pfx{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}
.pricebox input{padding-left:22px}
.pkgchk-row{display:flex;gap:10px;align-items:center}
.pkgchk{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--text-2);cursor:pointer;user-select:none}
.pkgchk input{accent-color:var(--blue);width:15px;height:15px}
.pkgchk.on{color:var(--text);font-weight:600}
.declinebtn{display:inline-flex;align-items:center;border:1px solid var(--border-strong);background:var(--rail);color:#fff;padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.declinebtn input{display:none}
.declinebtn.on{background:var(--danger);border-color:var(--danger)}
.declinebtn:hover{filter:brightness(1.1)}
.pkgpick .lb{font-size:11.5px;color:var(--muted);align-self:center;margin-right:2px}
.pkgbox{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);border-radius:8px;padding:4px 9px;font-size:12px;cursor:pointer;background:var(--surface)}
.pkgbox.on{border-color:var(--blue);background:var(--info-bg);color:var(--info);font-weight:600}
.pkgbox input{accent-color:var(--blue)}
.pkgbox.decline{border-color:var(--border)}
.pkgbox.decline.on{border-color:var(--danger);background:var(--danger-bg);color:var(--danger)}
.pkgselect-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pkgselect{display:flex;flex-direction:column;align-items:center;gap:4px;border:1.5px solid var(--border-strong);border-radius:11px;padding:16px 12px;background:var(--surface);cursor:pointer;text-align:center}
.pkgselect:hover{background:var(--surface-3)}
.pkgselect.on{border-color:var(--blue);background:var(--info-bg);box-shadow:inset 0 0 0 1px var(--blue)}
.pkgselect .pks-name{font-weight:700;font-size:13px;letter-spacing:.04em}
.pkgselect .pks-count{font-size:11.5px;color:var(--muted)}
.pkgselect .pks-total{font-size:20px;font-weight:700;margin-top:2px}
.pkgselect.on .pks-total{color:var(--blue)}
.cd-waiver{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)}
.wv-lbl{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--warn);margin-bottom:8px}
.wv-card{display:flex;align-items:center;gap:10px;border:1px solid var(--warn);background:var(--warn-bg);border-radius:9px;padding:9px 12px}
.wv-card + .wv-card{margin-top:8px}
.wv-x{flex:0 0 auto;width:22px;height:22px;border-radius:6px;background:var(--warn);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.wv-name{font-weight:700;font-size:13px;color:var(--warn)}
.wv-sub{font-size:11px;color:var(--warn);opacity:.85;margin-top:1px}
.cfgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:9px;margin-top:10px}
.cfgrid label.f{margin-bottom:0}
.cfg-popover{background:var(--surface-2);border:1px dashed var(--border-strong);padding:11px;border-radius:9px}
.gearbtn{border:1px solid var(--border-strong);background:var(--surface);color:var(--text-2);width:24px;height:24px;border-radius:6px;cursor:pointer;font-size:12.5px;line-height:1;padding:0}
.gearbtn:hover{background:var(--surface-3)}
.gearbtn.on{background:var(--info-bg);color:var(--info);border-color:var(--info)}
.price-inline{margin:0;max-width:160px}
.catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:10px}
.catcard{border:1px solid var(--border);border-radius:10px;padding:11px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.catcard.sel{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.catcard .nm{font-weight:600;font-size:13.5px}
.catcard .ds{font-size:11.5px;color:var(--muted);line-height:1.4}
.catcard .ft{margin-top:auto;display:flex;align-items:center;gap:8px;padding-top:6px}

.monitor{position:sticky;top:78px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.monitor-bar{background:var(--rail);color:#b7c7dd;font-size:11px;padding:7px 12px;display:flex;align-items:center;gap:8px;letter-spacing:.06em}
.monitor-bar .live{width:7px;height:7px;border-radius:50%;background:#37d39b}
.monitor-bar .sp{margin-left:auto;display:flex;gap:6px}
.cd{--cd-surface:#eef2f8;--cd-surface-2:#f7f9fc;--cd-surface-3:#e6edf6;--cd-border:#d2deed;--cd-blue:#2c5a9b;--cd-blue-2:#4577b8;--cd-blue-deep:#1b3d6d;--cd-text:#1c2b40;--cd-muted:#5c6e88;--cd-head-a:#1b3d6d;--cd-head-b:#2c5a9b;--cd-price-bg:#fbfcfd;--cd-shadow:0 1px 3px rgba(20,40,80,.1);
  background:var(--cd-surface);color:var(--cd-text);min-height:430px;display:flex;flex-direction:column}
:root[data-theme="dark"] .cd{--cd-surface:#0f1826;--cd-surface-2:#16223a;--cd-surface-3:#1b2942;--cd-border:#2b3c5c;--cd-blue:#4c86d6;--cd-blue-2:#6aa0ea;--cd-blue-deep:#0a1830;--cd-text:#eaf0fb;--cd-muted:#93a5c4;--cd-head-a:#0a1830;--cd-head-b:#1d4d85;--cd-price-bg:#111d33;--cd-shadow:0 1px 3px rgba(0,0,0,.35)}
.cd-head{background:linear-gradient(120deg,var(--cd-head-a),var(--cd-head-b));color:#fff;padding:26px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px}
.cd-head .fs{font-size:clamp(22px,2vw,34px);font-weight:800;letter-spacing:.1em;padding-left:.1em;line-height:1.1}
.cd-head .sb{font-size:11.5px;opacity:.82}
.cd-tagline{font-size:clamp(12px,1vw,16px);opacity:.9;margin-top:8px;font-style:italic;letter-spacing:.03em}
.cd-sub1{font-size:16px;font-weight:600;color:var(--cd-blue);margin-top:2px}
.cd-note{background:var(--cd-surface-3);border-top:1px solid var(--cd-border);padding:12px 20px;text-align:center}
.cd-note .nt1{font-weight:700;font-size:13.5px}
.cd-note .nt2{font-size:11px;color:var(--cd-muted);margin-top:3px}
.cd-mid-veh{font-size:22px;font-weight:600;letter-spacing:-.01em;margin-top:2px}
.cd-body{padding:28px 40px;flex:1;max-width:1620px;width:100%;margin:0 auto;box-sizing:border-box}
.cd-welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:56px 24px;flex:1}
.cd-welcome .hw{font-size:30px;font-weight:600;letter-spacing:-.02em}
.cd-veh{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;justify-content:center;text-align:center;border-bottom:1px solid var(--cd-border);padding-bottom:16px;margin-bottom:24px}
.cd-veh .v1{font-size:19px;font-weight:600}
.pkgrid{display:flex;flex-wrap:wrap;gap:26px;justify-content:center;align-items:flex-start}
.pkgcard{border:1px solid var(--cd-border);border-radius:11px;overflow:hidden;background:var(--cd-surface-2);display:flex;flex-direction:column;flex:1 1 380px;max-width:460px;min-width:300px;box-shadow:var(--cd-shadow)}
.pkgcard .ph{background:linear-gradient(180deg,var(--cd-blue-2),var(--cd-blue-deep));color:#fff;padding:20px 14px;font-weight:700;font-size:28px;letter-spacing:.05em;text-align:center;display:flex;align-items:center;justify-content:center;gap:10px}
.pkgcard .ph-icon{opacity:.9;font-size:18px}
.pkgcard .pb{padding:14px 16px;flex:1}
.pkgcard .pi{padding:8px 0;border-bottom:1px solid var(--cd-border);font-size:13px;display:flex;align-items:flex-start;gap:9px}
.pkgcard .pi:last-child{border-bottom:0}
.pkgcard .pi-icon{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:linear-gradient(140deg,var(--cd-blue),var(--cd-blue-2));color:#fff;display:flex;align-items:center;justify-content:center;margin-top:1px}
.pkgcard .pi-icon svg{width:19px;height:19px;display:block}
.pkgcard .pi-txt{min-width:0;flex:1}
.pkgcard .pi .n2{font-weight:600}
.pkgcard .pi .c2{color:var(--cd-muted);font-size:11.5px}
.pkgcard .pi-price{flex:0 0 auto;font-weight:700;font-size:12.5px;color:var(--cd-text);margin-top:1px;white-space:nowrap}

.axl{

.axl-side{display:flex;justify-content:flex-end}

.axl .axl-field input:-webkit-autofill,.axl .axl-field input:-webkit-autofill:hover,.axl .axl-field input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 1000px #f5f8fc inset !important;box-shadow:0 0 0 1000px #f5f8fc inset !important;-webkit-text-fill-color:#0b1b3a !important;caret-color:#0b1b3a;transition:background-color 99999s ease-out 0s}

.axl-link{color:var(--blue);cursor:pointer;white-space:nowrap}

.axl-btn{width:100%;height:clamp(42px,3vw,52px);border:0;border-radius:.6vw;background:linear-gradient(180deg,#1a8dff,#0a66e8);color:#fff;font-family:inherit;font-size:clamp(14px,1vw,18px);font-weight:600;cursor:pointer;

@keyframes axiomSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes axiomSpinRev{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}
@keyframes axiomPulse{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.5)}}
@keyframes axiomDrift{from{transform:translateX(0)}to{transform:translateX(-60px)}}

.axiom-ring1{animation:axiomSpin 50s linear infinite;transform-origin:200px 200px}
.axiom-ring2{animation:axiomSpinRev 65s linear infinite;transform-origin:200px 200px}

@media print{
  /* The old visibility:hidden trick left every hidden element still taking
     up its normal layout height (visibility doesn't affect layout, only
     paint), so the print engine paginated across the whole app's height —
     one real page of content followed by several blank ones. Removing #root
     from the flow entirely fixes that; only the open modal prints. */
  #root{display:none !important}
  .modal-bg{position:static !important;inset:auto;background:#fff;padding:0;display:block}
  .modal{box-shadow:none;width:100%;max-width:none}
  .modal-h,.no-print{display:none !important}
  .modal-b{max-height:none;overflow:visible;padding:0}
  /* Tighter than the on-screen preview so a normal deal (one package,
     under a dozen lines) fits on a single sheet instead of spilling a
     mostly-empty second page. */
  @page{margin:10mm}
  .doc{border:0;border-radius:0;padding:0;font-size:11px;line-height:1.4}

  .doc .selectbox .big{font-size:16px}
  .doc .kv{padding:3px 0}
  .doc .watermark{margin-top:8px;font-size:9px}
  .doc, .doc *{page-break-inside:avoid}
}
@media (max-width:1180px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .fin-split{grid-template-columns:minmax(0,1fr)} .monitor{position:static} }

/* -------- the single totals engine -------- */
function totals(state, tx){
  var taxCfg = state.config.tax, fin = state.config.finance;
  var lines = [], sub = 0, taxStd = 0, taxVrc = 0, cost = 0, unpriced = 0, i;
  var presentedTerms = sortedTerms(tx);

  for (i=0;i<tx.lines.length;i++){
    var l = tx.lines[i], prod = productById(state, l.productId);
    if (!prod) continue;
    if (!l.packages) l.packages = { preferred:true, essential:false, basic:false };
    if (l.declined === undefined) l.declined = false;
    var configured = priceFor(prod, l);
    var price = (l.price === null || l.price === undefined || l.price === "") ? configured : Number(l.price);
    var rate = taxRateFor(prod, taxCfg);
    var priced = !(price === null || price === undefined || isNaN(price));
    var anyPkg = l.packages.preferred || l.packages.essential || l.packages.basic;
    if (!priced && !l.declined && anyPkg) unpriced++;
    var amount = priced ? price : 0;
    var tax = Math.round(amount*rate*100)/100;
    /* Cost is a flat dollar figure for providing this product on the deal —
       it does not scale with whichever term/km/deductible the customer
       picked. Real per-tier dealer cost sheets exist, but the FSM asked for
       one simple optional number rather than a full cost table; that's a
       future refinement (mirroring the pricing table) if ever needed. */
    var lineCost = priced ? (Number(prod.cost) || 0) : 0;
    if (!l.declined && anyPkg){
      if (prod.taxRule === "vrc") taxVrc += tax; else taxStd += tax;
      sub += amount; cost += lineCost;
    }
    var termForDay = (prod.uses.term && l.term) ? Number(l.term) : (primaryTerm(tx) || 60);
    var days = termForDay * 30.44;
    var perDay = (priced && days > 0) ? Math.round((amount/days)*100)/100 : null;
    var perDayByTerm = (presentedTerms.length ? presentedTerms : [termForDay]).map(function(tm){
      var d = tm * 30.44;
      return { term:tm, perDay: (priced && d > 0) ? Math.round((amount/d)*100)/100 : null };
    });
    lines.push({ lineId:l.lineId, product:prod, cfg:l, price: priced ? amount : null, configuredPrice:configured,
      overridden: !!l.priceOverridden, rate:rate, ratePct:Math.round(rate*10000)/100, tax:tax, perDayByTerm:perDayByTerm,
      total:Math.round((amount+tax)*100)/100, cost:lineCost, gross:priced?Math.round((amount-lineCost)*100)/100:null, perDay:perDay });
  }

  var productsSub = Math.round(sub*100)/100;
  var productsTax = Math.round((taxStd+taxVrc)*100)/100;
  var productsTotal = Math.round((productsSub+productsTax)*100)/100;

  var vPrice = Number(tx.vehicle.price)||0;
  /* No vehicle price yet means there's no deal to speak of — don't let the
     admin fee/licensing/tax show up as a phantom balance on a brand new,
     untouched transaction before the FSM has entered anything. */
  var adminFee = vPrice > 0 ? (Number(fin.adminFee)||0) : 0, lic = vPrice > 0 ? (Number(fin.licensing)||0) : 0;
  var isCash = tx.type === "Cash";
  var src = isCash ? (tx.cash||{}) : tx.finance;
  var tradeAll = Number(src.tradeAllowance)||0, tradePay = Number(src.tradePayout)||0, down = Number(src.downPayment)||0;
  var fees = isCash ? [] : (tx.finance.fees || []);
  var feeAmount = Number(src.feeAmount) || 0;
  var feesTotal = Math.round((fees.reduce(function(sum, f){ return sum + (Number(f.amount)||0); }, 0) + feeAmount) * 100) / 100;
  var taxableVehicle = Math.max(0, vPrice + adminFee - tradeAll);
  var vehicleTax = Math.round(taxableVehicle*(Number(taxCfg.standard)/100)*100)/100;
  var baseAmount = Math.max(0, vPrice + adminFee + vehicleTax + lic - tradeAll + tradePay - down + feesTotal);
  var financed = isCash ? null : Math.round((baseAmount + productsTotal)*100)/100;
  var cashDueTotal = isCash ? Math.round((baseAmount + productsTotal)*100)/100 : null;

  var terms = isCash ? [] : presentedTerms, rates = isCash ? {} : (tx.finance.rates || {});
  var freq = isCash ? null : (tx.finance.frequency || null);

  function quotesFor(extraTotal){
    if (isCash || !freq || !terms.length) return [];
    return terms.map(function(tm){
      var rateRaw = rates[tm];
      var hasRate = !(rateRaw === undefined || rateRaw === null || rateRaw === "");
      var rate = hasRate ? Number(rateRaw) : null;
      var paymentsCount = Math.round(tm/12*periodsPerYear(freq));
      if (!hasRate){
        return { term:tm, frequency:freq, rate:null, basePayment:null, payment:null, difference:null, paymentsCount:paymentsCount };
      }
      var base = payment(baseAmount, rate, tm, freq);
      var full = payment(baseAmount + extraTotal, rate, tm, freq);
      return { term:tm, frequency:freq, rate:rate, basePayment:Math.round(base*100)/100,
        payment:Math.round(full*100)/100, difference:Math.round((full-base)*100)/100,
        paymentsCount:paymentsCount };
    });
  }

  /* -------- the three presentation packages -------- */
  var anyPackaged = lines.some(function(L){
    var p = L.cfg.packages || {}; return p.preferred || p.essential || p.basic;
  });
  var packages = D.PACKAGES.map(function(def){
    var pl = lines.filter(function(L){ return (L.cfg.packages||{})[def.key]; });
    var s = 0, tx1 = 0, c = 0, missing = false;
    pl.forEach(function(L){
      if (L.price === null) { missing = true; return; }
      s += L.price; tx1 += L.tax; c += L.cost;
    });
    var tot = Math.round((s+tx1)*100)/100;
    return { key:def.key, suffix:def.suffix, blurb:def.blurb, label:packageLabel(state, def.suffix),
      lines:pl, count:pl.length, hasUnpriced:missing,
      sub:Math.round(s*100)/100, tax:Math.round(tx1*100)/100, total:tot,
      cost:c, gross:Math.round((s-c)*100)/100, quotes:quotesFor(tot),
      dueTotal: isCash ? Math.round((baseAmount+tot)*100)/100 : null };
  });

  return {
    lines:lines, unpricedCount:unpriced, packages:packages, packagesUsed:anyPackaged,
    productsSub:productsSub, taxStandard:Math.round(taxStd*100)/100, taxVrc:Math.round(taxVrc*100)/100,
    productsTax:productsTax, productsTotal:productsTotal, productCost:cost,
    productGross:Math.round((productsSub-cost)*100)/100,
    vehiclePrice:vPrice, adminFee:adminFee, licensing:lic, vehicleTax:vehicleTax,
    tradeAllowance:tradeAll, tradePayout:tradePay, downPayment:down,
    baseAmount:Math.round(baseAmount*100)/100, amountFinanced:financed, isCash:isCash, cashDueTotal:cashDueTotal,
    fees:fees, feeAmount:feeAmount, feesTotal:feesTotal, terms:terms, term:primaryTerm(tx), rates:rates, frequency:freq,
    quotes:quotesFor(productsTotal), baseQuotes:quotesFor(0)
  };
}

function validate(state, tx){
  var t = totals(state, tx), errs = [], warns = [];
  if (!tx.fsmUserId) errs.push("Assign an FSM to this deal before completing it.");
  if (!tx.customer.name) errs.push("Add a customer before completing the transaction.");
  if (!tx.vehicle.model || !tx.vehicle.stock) errs.push("Enter the vehicle model and stock number.");
  if (!tx.vehicle.price) errs.push("Enter the vehicle selling price.");
  if (tx.type !== "Cash"){
    if (!t.terms.length) errs.push("Select at least one finance term to present.");
    if (!tx.finance.frequency) errs.push("Select a payment frequency.");
    t.terms.forEach(function(tm){
      var r = (tx.finance.rates || {})[tm];
      if (r === undefined || r === null || r === "") errs.push("Enter the interest rate for " + tm + " months.");
    });
  }
  if (!tx.lines.length) warns.push("No products are selected. The customer display will show the welcome screen only.");
  else if (!t.packagesUsed) warns.push("No product has been assigned to a package yet, so the customer display is showing every selected product as one package.");
  for (var i=0;i<t.lines.length;i++){
    var L = t.lines[i], p = L.product, c = L.cfg;
    if (c.declined) continue;
    if (!(c.packages && (c.packages.preferred || c.packages.essential || c.packages.basic))) continue;
    if (p.uses.term && !c.term) errs.push(p.name + ": select a term.");
    if (p.uses.km && !c.km) errs.push(p.name + ": select kilometres.");
    if (p.uses.interval && !c.interval) errs.push(p.name + ": select a maintenance interval.");
    if (p.uses.deductible && (c.deductible === null || c.deductible === undefined || c.deductible === "")) errs.push(p.name + ": select a deductible.");
    if (L.price === null) errs.push(p.name + ": price is not configured — enter a price to continue.");
  }
  return { ok: errs.length === 0, errors:errs, warnings:warns, totals:t };
}

/* -------- demo reporting history -------- */
function buildHistory(state){
  var rnd = D.lcg(20260916), out = [], i, j;
  var roster = { d1:["u2","u3","u4","u5"], d2:["u7"] };
  var today = new Date();
  for (i=0;i<200;i++){
    var dealershipId = rnd() < 0.82 ? "d1" : "d2";
    var fsms = roster[dealershipId];
    var d = new Date(today.getTime() - Math.floor(rnd()*400)*86400000);
    var iso = d.toISOString().slice(0,10);
    var r = rnd(), type = r < 0.78 ? "Finance" : "Cash";
    var tx = newTransaction(fsms[Math.floor(rnd()*fsms.length)], dealershipId);
    tx.id = "DEMO-" + (10000+i); tx.createdAt = iso; tx.type = type; tx.status = "Completed";
    tx.customer = { id:null, name:D.DEMO_NAMES[Math.floor(rnd()*D.DEMO_NAMES.length)], phone:"", email:"", address:"" };
    tx.vehicle = { id:null, year:2024+Math.floor(rnd()*3), make: dealershipId === "d2" ? "INFINITI" : "Nissan",
      model: D.DEMO_MODELS[Math.floor(rnd()*D.DEMO_MODELS.length)], stock:"N-"+(1000+Math.floor(rnd()*8999)),
      vin:"DEMOVIN"+(100000+Math.floor(rnd()*899999)), odometer:Math.floor(rnd()*30000), condition:"New",
      price:28000+Math.floor(rnd()*36000) };
    var tm = type === "Cash" ? null : [48,60,72,84,96][Math.floor(rnd()*5)];
    var histRate = type === "Cash" ? 0 : Math.round((4+rnd()*6)*100)/100;
    var histTradeAll = rnd() < .4 ? Math.floor(rnd()*18000) : 0, histDown = Math.floor(rnd()*6)*1000;
    if (type === "Cash"){
      tx.cash = { tradeAllowance:histTradeAll, tradePayout:0, downPayment:histDown, feeAmount:0 };
    } else {
      tx.finance = { tradeAllowance:histTradeAll, tradePayout:0,
        downPayment:histDown, rates: tm ? (function(){ var o={}; o[tm]=histRate; return o; })() : {},
        terms: tm ? [tm] : [], frequency: rnd() < .6 ? "biweekly" : "monthly" };
    }
    var count = Math.floor(rnd()*4.4);
    var pool = state.products.filter(function(p){ return p.active && p.pricing; });
    var used = {};
    for (j=0;j<count;j++){
      var prod = pool[Math.floor(rnd()*pool.length)];
      if (!prod || used[prod.id]) continue;
      used[prod.id] = 1;
      var line = { lineId:uid("L"), productId:prod.id, term:null, km:null, interval:null, deductible:null,
        price:null, priceOverridden:false, packages:{ preferred:true, essential:rnd()<.5, basic:rnd()<.25 } };
      if (prod.uses.term) line.term = prod.terms[Math.floor(rnd()*prod.terms.length)];
      if (prod.uses.km) line.km = prod.kms[Math.floor(rnd()*prod.kms.length)];
      if (prod.uses.interval) line.interval = prod.intervals[Math.floor(rnd()*prod.intervals.length)];
      if (prod.uses.deductible) line.deductible = prod.deductibles[Math.floor(rnd()*prod.deductibles.length)];
      line.price = priceFor(prod, line);
      tx.lines.push(line);
    }
    out.push(tx);
  }
  return out;
}

   Product name plus the term and kilometres chosen. No explanations,

function lineConfigText(L){
  var bits = [];
  if (L.product.uses.term && L.cfg.term) bits.push(L.cfg.term + " months");
  if (L.product.uses.km && L.cfg.km) bits.push(km(L.cfg.km));
  if (L.product.uses.interval && L.cfg.interval) bits.push("every " + km(L.cfg.interval));
  if (L.product.uses.deductible && L.cfg.deductible !== null && L.cfg.deductible !== undefined && L.cfg.deductible !== "")
    bits.push(Number(L.cfg.deductible) === 0 ? "no deductible" : "$" + L.cfg.deductible + " deductible");
  return bits.join(" · ");
}
/* If the FSM has recorded which package and term the customer chose,
   every customer-facing surface (this screen, the customer print, the
   emailed follow-up) narrows to that one package and that one term.
   Until then they show everything that has been assigned to a package. */
function packagesToShow(t, tx){
  var list, nonDeclined = t.lines.filter(function(L){ return !L.cfg.declined &&
    L.cfg.packages && (L.cfg.packages.preferred || L.cfg.packages.essential || L.cfg.packages.basic); });
  if (t.packagesUsed) list = t.packages.filter(function(p){ return p.count > 0; });
  else if (nonDeclined.length){
    var s=0, tx1=0, c=0;
    nonDeclined.forEach(function(L){ if (L.price!==null){ s+=L.price; tx1+=L.tax; c+=L.cost; } });
    list = [{ key:"selected", label:"SELECTED PACKAGE", blurb:"", lines:nonDeclined,
      count:nonDeclined.length, quotes:t.quotes, dueTotal:t.isCash?t.cashDueTotal:null,
      sub:Math.round(s*100)/100, tax:Math.round(tx1*100)/100, total:Math.round((s+tx1)*100)/100,
      cost:c, gross:Math.round((s-c)*100)/100 }];
  }
  else list = [];
  /* Keep every field a package object carries (dueTotal, sub, total, etc.) —
     allow-listing fields here has silently dropped new ones more than once
     when a package gets selected on the customer display. */
  var sel = tx && tx.display && tx.display.selection;
  if (sel && sel.package){
    list = list.filter(function(p){ return p.key === sel.package; });
    list = list.map(function(p){
      var np = {}; for (var k in p) np[k] = p[k];
      np.quotes = sel.term ? p.quotes.filter(function(x){ return x.term === sel.term; }) : p.quotes;
      return np;
    });
  }
  return list;
}

/* Pick a product-specific icon: exact product id first (the built-ins), then
   keywords in the name/category so dealership-added products get a fitting one. */
function productIconSvg(p){
  var k = PI_BY_ID[p && p.id];
  if (!k){
    var n = ((p && p.name) || "") + " " + ((p && p.category) || "");
    n = n.toLowerCase();
    k = /tire|rim|wheel/.test(n) ? "tire"
      : /rust|undercoat|corrosion|inhibit/.test(n) ? "drop"
      : /tint|window|film|glass/.test(n) ? "sun"
      : /ghost|immobil|theft|alarm|security|recovery|tracking/.test(n) ? "lock"
      : /ceramic|paint|appearance|gloss|interior|fabric|leather|detail/.test(n) ? "sparkle"
      : /gap|guaranteed asset|loan|balance/.test(n) ? "gap"
      : /key|fob/.test(n) ? "key"
      : /maint|service|oil|inspection/.test(n) ? "wrench"
      : /replacement|total loss/.test(n) ? "car"
      : "shield";
  }
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + PI_SVG[k] + '</svg>';
}

        <label class="switch"><input type="checkbox" data-pf="use-deductible" ${p.uses.deductible?"checked":""}> Uses a deductible</label>

      </div>

      <div class="inline">
        ${numListInput("Term options (months, max 120)","terms",p.terms)}
        ${numListInput("Kilometre options","kms",p.kms)}
        ${numListInput("Service intervals (km)","intervals",p.intervals)}
        ${numListInput("Deductible options ($)","deductibles",p.deductibles)}
      </div>
      <div class="inline">
        <label class="f"><span>Base retail price (blank = not configured)</span><input type="number" data-pf="base" value="${p.pricing?p.pricing.base:""}"></label>
        <label class="f"><span>Dealer cost (optional, $)</span><input type="number" step="0.01" data-pf="cost" value="${p.cost===null||p.cost===undefined?"":p.cost}" placeholder="Leave blank if unknown"></label>
      </div>
      <p class="small muted">Cost is a single flat dollar figure regardless of which term, kilometres or deductible get picked — it's used to show gross profit on reports and internal print. Leave it blank if you don't track cost; gross will just show as full retail. If you ever need cost to vary by term or kilometres the way price does, ask and we can add a cost table to match.</p>
      <p class="small muted">Adders are added to the base price for each option the FSM picks. Change an option list above and save to regenerate this grid.</p>
      ${adderGrid("Term adders (months)","term",p.uses.term?p.terms:null,p.pricing&&p.pricing.term)}
      ${adderGrid("Kilometre adders","km",p.uses.km?p.kms:null,p.pricing&&p.pricing.km)}
      ${adderGrid("Interval adders","interval",p.uses.interval?p.intervals:null,p.pricing&&p.pricing.interval)}
      ${adderGrid("Deductible adders","deductible",p.uses.deductible?p.deductibles:null,p.pricing&&p.pricing.deductible)}
    </div></div></div>`;
}
function parseList(s){
  if (!s) return [];
  return String(s).split(",").map(function(x){ return Number(String(x).replace(/[^0-9.\-]/g,"")); }).filter(function(x){ return !isNaN(x); });
}
function saveProduct(){
  var p = state.ui.productEdit, root = document.querySelector(".modal");
  if (!p || !root) return;
  function f(k){ return root.querySelector('[data-pf="'+k+'"]'); }
  var name = f("name").value.trim();
  if (!name){ toast("Give the product a name before saving.","err"); return; }
  p.name = name;
  p.code = f("code").value.trim() || name.slice(0,3).toUpperCase();
  p.category = f("category").value.trim() || "General";
  p.taxRule = f("taxRule").value;
  p.desc = f("desc").value.trim();
  p.benefit = f("benefit").value.trim();
  p.active = f("active").checked;
  var costRaw = f("cost").value;
  p.cost = costRaw === "" ? null : (Number(costRaw) || 0);
  p.uses = { term:f("use-term").checked, km:f("use-km").checked, interval:f("use-interval").checked, deductible:f("use-deductible").checked };
  p.terms = parseList(f("terms").value).filter(function(x){ return x>0 && x<=120; });
  p.kms = parseList(f("kms").value);
  p.intervals = parseList(f("intervals").value);
  p.deductibles = parseList(f("deductibles").value);
  var baseRaw = f("base").value;
  if (baseRaw === "") p.pricing = null;
  else {
    var pricing = { base:Number(baseRaw)||0, term:{}, km:{}, interval:{}, deductible:{} };
    var adders = root.querySelectorAll("[data-pa]");
    for (var i=0;i<adders.length;i++){
      var parts = adders[i].getAttribute("data-pa").split(":");
      pricing[parts[0]][parts[1]] = Number(adders[i].value)||0;
    }
    ["term","km","interval","deductible"].forEach(function(k){
      var list = k==="term"?p.terms:k==="km"?p.kms:k==="interval"?p.intervals:p.deductibles;
      if (!p.uses[k]){ delete pricing[k]; return; }
      list.forEach(function(o){ if (pricing[k][o] === undefined) pricing[k][o] = 0; });
    });
    p.pricing = pricing;
  }
  if (!p.id){ p.id = C.uid("p"); state.products.push(p); }
  else for (var j=0;j<state.products.length;j++) if (state.products[j].id === p.id) state.products[j] = p;
  state.ui.productEdit = null;
  toast("Product saved.","ok");
  commit();
}

/* ---------------- REPORTS ---------------- */
function presetRange(period){
  var now = new Date(), to = C.todayISO(), from;
  if (period === "daily") from = to;
  else if (period === "weekly") from = new Date(now.getTime()-6*86400000).toISOString().slice(0,10);
  else if (period === "monthly") from = to.slice(0,7) + "-01";
  else from = to.slice(0,4) + "-01-01";
  return { from:from, to:to };
}
function canSeeAllReports(){
  return V.isAdmin();
}
function filteredDeals(){
  var f = state.ui.reports;
  if (!f.from || !f.to){ var r = presetRange(f.period); f.from = f.from||r.from; f.to = f.to||r.to; }
  var pool = (V.isMaster() && f.dealership === "all") ? V.allDeals() : V.dealsForStore();
  /* An FSM only ever sees their own deals here — "all" or someone else's
     selection is only honoured for a GM, FSM Manager or master admin. */
  var fsmFilter = canSeeAllReports() ? f.fsm : state.currentUserId;
  return pool.filter(function(d){
    if (d.createdAt < f.from || d.createdAt > f.to) return false;
    if (fsmFilter !== "all" && d.fsmUserId !== fsmFilter) return false;
    if (f.type !== "all" && d.type !== f.type) return false;
    if (f.product !== "all" && !d.lines.some(function(l){ return l.productId === f.product; })) return false;
    return true;
  });
}
function viewReports(){
  var f = state.ui.reports, deals = filteredDeals(), i, j;
  var gross = 0, retail = 0, productCount = 0, withProduct = 0, byFsm = {}, byProduct = {};
  for (i=0;i<deals.length;i++){
    var d = deals[i], t = C.totals(state, d);
    gross += t.productGross; retail += t.productsSub; productCount += t.lines.length;
    if (t.lines.length) withProduct++;
    if (!byFsm[d.fsmUserId]) byFsm[d.fsmUserId] = { deals:0, gross:0, retail:0, products:0 };
    byFsm[d.fsmUserId].deals++; byFsm[d.fsmUserId].gross += t.productGross;
    byFsm[d.fsmUserId].retail += t.productsSub; byFsm[d.fsmUserId].products += t.lines.length;
    for (j=0;j<t.lines.length;j++){
      var L = t.lines[j];
      if (!byProduct[L.product.id]) byProduct[L.product.id] = { n:0, retail:0, gross:0 };
      byProduct[L.product.id].n++; byProduct[L.product.id].retail += (L.price||0); byProduct[L.product.id].gross += (L.price||0)-L.cost;
    }
  }
  var fsmRows = Object.keys(byFsm).map(function(k){ return { u:userById(k), v:byFsm[k] }; }).sort(function(a,b){ return b.v.gross-a.v.gross; });
  var prodRows = Object.keys(byProduct).map(function(k){ return { p:C.productById(state,k), v:byProduct[k] }; }).sort(function(a,b){ return b.v.n-a.v.n; });
  var maxG = fsmRows.length ? Math.max(1, fsmRows[0].v.gross) : 1;

  var filters = `<div class="card" style="margin-bottom:16px"><div class="card-b"><div class="inline">

      ${["daily","weekly","monthly","yearly"].map(function(p){ return `<option value="${p}" ${f.period===p?"selected":""}>${p.charAt(0).toUpperCase()+p.slice(1)}</option>`; }).join("")}</select></label>
    <label class="f"><span>From</span><input type="date" value="${esc(f.from)}" data-bind="ui.reports.from"></label>
    <label class="f"><span>To</span><input type="date" value="${esc(f.to)}" data-bind="ui.reports.to"></label>
    ${V.isMaster() ? `<label class="f"><span>Dealership</span><select data-bind="ui.reports.dealership">
      <option value="active" ${f.dealership==="active"?"selected":""}>${esc(state.config.name)}</option>
      <option value="all" ${f.dealership==="all"?"selected":""}>All dealerships</option></select></label>` : ""}
    ${canSeeAllReports() ? `<label class="f"><span>FSM</span><select data-bind="ui.reports.fsm">
      <option value="all">All FSM users</option>
      ${state.users.filter(function(u){ return u.role !== "Demo" && u.role !== "Master Administrator"; }).map(function(u){
        return `<option value="${u.id}" ${f.fsm===u.id?"selected":""}>${esc(u.name)}</option>`; }).join("")}</select></label>`
      : `<label class="f"><span>FSM</span><input type="text" value="${esc(V.currentUser().name)} (you)" disabled></label>`}
    <label class="f"><span>Product</span><select data-bind="ui.reports.product">
      <option value="all">All products</option>
      ${state.products.map(function(p){ return `<option value="${p.id}" ${f.product===p.id?"selected":""}>${esc(p.name)}</option>`; }).join("")}</select></label>
    <label class="f"><span>Transaction type</span><select data-bind="ui.reports.type">
      ${["all","Finance","Cash"].map(function(x){ return `<option value="${x}" ${f.type===x?"selected":""}>${x==="all"?"All types":x}</option>`; }).join("")}</select></label>
  </div></div></div>`;

  var kpis = `<div class="grid g4" style="margin-bottom:16px">
    ${V.kpiCard("Transactions", deals.length, C.fmtDate(f.from)+" to "+C.fmtDate(f.to))}
    ${V.kpiCard("Product gross", money0(gross), money0(retail)+" retail")}
    ${V.kpiCard("Products sold", productCount, deals.length ? Math.round(productCount/deals.length*100)/100+" per deal" : "—")}
    ${V.kpiCard("Penetration", (deals.length?Math.round(withProduct/deals.length*100):0)+"%", withProduct+" deals with a product")}</div>`;

  var body = deals.length ? `<div class="grid g2">
    <div class="card"><div class="card-h"><h2>FSM performance</h2></div><div class="card-b"><div class="tablewrap"><table>
      <thead><tr><th>FSM</th><th class="right">Deals</th><th class="right">Products</th><th class="right">Retail</th><th class="right">Gross</th><th class="right">Per deal</th><th style="width:110px"></th></tr></thead>
      <tbody>${fsmRows.map(function(r){ return `<tr><td>${esc(r.u.name)}<div class="tiny muted">${esc(r.u.role)}</div></td>
        <td class="right num">${r.v.deals}</td><td class="right num">${r.v.products}</td><td class="right num">${money0(r.v.retail)}</td>
        <td class="right num">${money0(r.v.gross)}</td><td class="right num">${money0(r.v.gross/r.v.deals)}</td>
        <td><div class="bar"><i style="width:${Math.max(4,Math.round(r.v.gross/maxG*100))}%"></i></div></td></tr>`; }).join("")}
      </tbody></table></div></div></div>
    <div class="card"><div class="card-h"><h2>Product sales</h2></div><div class="card-b"><div class="tablewrap"><table>
      <thead><tr><th>Product</th><th class="right">Sold</th><th class="right">Retail</th><th class="right">Gross</th><th class="right">Penetration</th></tr></thead>
      <tbody>${prodRows.map(function(r){ return `<tr><td>${esc(r.p?r.p.name:"—")}</td><td class="right num">${r.v.n}</td>

      </tbody></table></div></div></div></div>
    <div class="card" style="margin-top:16px"><div class="card-h"><h2>Transactions</h2>
      <div class="sp"><span class="muted small">${deals.length} in range</span></div></div>
      <div class="card-b"><div class="tablewrap"><table>

      <tbody>${deals.slice().sort(function(a,b){ return a.createdAt<b.createdAt?1:-1; }).slice(0,60).map(function(d){

        return `<tr><td class="nowrap">${C.fmtDate(d.createdAt)}</td><td class="nowrap">${esc(d.id)}</td>
          <td>${esc(d.customer.name||"—")}</td><td>${esc(d.vehicle.year+" "+d.vehicle.model)}</td>
          <td><span class="tag">${esc(d.type)}</span></td><td>${esc(userById(d.fsmUserId).name)}</td>
          <td class="right num">${t.lines.length}</td><td class="right num">${money0(t.productsSub)}</td>
          <td class="right num">${money0(t.productGross)}</td>
          <td class="right nowrap">${editable ? `<button class="btn sm" data-act="deal-open" data-deal="${esc(d.id)}">Open</button>
            <button class="btn sm danger" data-act="deal-delete" data-deal="${esc(d.id)}">Delete</button>` : ""}</td></tr>`; }).join("")}
      </tbody></table></div>
      ${deals.length>60?`<p class="small muted" style="margin-top:10px">Showing the 60 most recent of ${deals.length}.</p>`:""}</div></div>`
    : `<div class="card"><div class="empty">No transactions match these filters. Widen the date range or clear a filter.</div></div>`;
  return filters + kpis + body;
}

function saveUser(){
  var root = document.querySelector(".modal");
  if (!root) return;
  function f(k){ var el = root.querySelector('[data-uf="'+k+'"]'); return el ? el : null; }
  var name = f("name").value.trim(), pw = f("password").value.trim();
  var role = f("role").value;
  if (!name){ toast("Enter the user's name.","err"); return; }
  if (pw.length < 8){ toast("The temporary password needs at least 8 characters.","err"); return; }
  var payload = { action:"create", password:pw, name:name, role:role,
    dealership_id: role === "Master Administrator" ? null : (f("dealership").value || null) };
  if (role === "Salesperson"){
    var usernameEl = f("username");
    var username = usernameEl ? usernameEl.value.trim().toLowerCase() : "";
    if (!/^[a-z0-9._-]{3,30}$/.test(username)){ toast("Username must be 3-30 characters: letters, numbers, dots, underscores or hyphens only.","err"); return; }
    payload.username = username;
  } else {
    var emailEl = f("email");
    var email = emailEl ? emailEl.value.trim().toLowerCase() : "";
    if (!/^\S+@\S+\.\S+$/.test(email)){ toast("Enter a valid email address.","err"); return; }
    payload.email = email;
  }
  var access = f("access").value;
  var expDate = wheelDate(state.ui.inviteSel || defaultWheelSel(Date.now() + 7*86400000));
  if (access === "demo" && !(expDate.getTime() > Date.now())){ toast("Pick a demo end date and time in the future.","err"); return; }
  payload.access_type = access;
  payload.expires_at = access === "demo" ? expDate.toISOString() : null;
  toast("Creating user…","info");
  adminCall(payload)
  .then(function(){ state.ui.userForm = false; toast("User created — share the temporary " + (role==="Salesperson"?"username and ":"") + "password with " + name.split(" ")[0] + ".","ok"); refreshUsers(); commit(); })
  .catch(function(e){ toast(e.message, "err"); });
}

function saveDealer(){
  var d = state.ui.dealerForm, root = document.querySelector(".modal");
  if (!d || !root) return;
  function f(k){ return root.querySelector('[data-df="'+k+'"]'); }
  var name = f("name").value.trim();
  if (!name){ toast("Give the dealership a name.","err"); return; }
  d.name = name;
  d.brandKey = f("brandKey").value;
  d.logoMark = (f("logoMark").value.trim() || (D.BRANDS[d.brandKey]||D.BRANDS.nissan).mark).toUpperCase();
  d.dealerCode = f("dealerCode").value.trim() || "DLR-" + Math.floor(1000+Math.random()*8999);
  d.address = f("address").value.trim();
  d.city = f("city").value.trim();
  d.phone = f("phone").value.trim();
  d.email = f("email").value.trim();
  d.tax = { standard:Number(f("taxStandard").value)||13, vrc:Number(f("taxVrc").value)||8 };
  d.finance.defaultApr = Number(f("apr").value)||0;
  d.finance.defaultTerm = Number(f("term").value)||72;
  var wasNew = !d.id;
  if (wasNew){
    d.id = C.uid("d"); d.active = true;
    state.dealerships.push(d);
    toast("Dealership created. You're now signed into it — add a general manager or salesperson from Users and access.","ok");
  } else {
    for (var i=0;i<state.dealerships.length;i++) if (state.dealerships[i].id === d.id) state.dealerships[i] = d;
    if (d.id === state.activeDealershipId) state.config = d;
    toast("Dealership saved.","ok");
  }
  state.ui.dealerForm = null;
  if (wasNew) V.setDealership(d.id);
  commit();
}
function deleteDealer(id){
  if (state.dealerships.length <= 1){ toast("Keep at least one dealership.","err"); return; }
  cloud.del.d.push(id); delete state.cloud.productsByDealer[id];
  state.dealerships = state.dealerships.filter(function(d){ return d.id !== id; });
  state.users.forEach(function(u){ if (u.dealershipId === id) u.active = false; });
  if (state.activeDealershipId === id){
    if (state.dealerships.length) V.setDealership(state.dealerships[0].id);
    else { state.activeDealershipId = null; state.config = null; state.tx = null; }
  }
  toast("Dealership removed. Its users were deactivated.","ok");
  commit();
}

/* ---------------- EMAILED PRESENTATION ----------------

   package the customer is interested in, the term or terms selected, the

function buildEmail(tx){
  var t = C.totals(state, tx), b = V.brand(), c = state.config, u = userById(tx.fsmUserId);
  var sel = state.ui.email;
  var shown = V.packagesToShow(t).filter(function(p){ return sel.pkg === "all" || sel.pkg === p.key; });
  var first = tx.customer.name ? tx.customer.name.split(" ")[0] : "there";
  var vehicle = (tx.vehicle.year + " " + tx.vehicle.make + " " + tx.vehicle.model).trim();
  var L = [];
  L.push("Hi " + first + ",");
  L.push("");
  L.push("Thanks for your time today at " + c.name + ". Here is the protection we looked at for your " + vehicle + ", with the payments exactly as they appeared on screen. Nothing here is a commitment; it is so you can read it at your own pace.");
  L.push("");
  shown.forEach(function(p){
    L.push(p.label);
    L.push(new Array(p.label.length + 1).join("-"));
    if (tx.type === "Cash"){
      L.push("Total due in full with this package: " + money(p.dueTotal));
      L.push("");
    } else {
      var quotes = p.quotes.filter(function(q){ return sel.term === "all" || Number(sel.term) === q.term; });
      if (quotes.length){
        L.push("Payment with this package:");
        quotes.forEach(function(q){
          if (q.payment === null){ L.push("  - " + q.term + " months: rate still to be entered"); return; }
          L.push("  - " + money(q.payment) + " " + C.freqLabel(q.frequency) + " over " + q.term + " months at " + q.rate + "%"
            + " (" + money(q.difference) + " more than the vehicle on its own)");
        });
        L.push("");
      }
    }
    L.push("What is included:");
    p.lines.forEach(function(line){
      var cfg = V.lineConfigText(line);
      L.push("");
      L.push("  " + line.product.name + (cfg ? " (" + cfg + ")" : ""));
      if (line.product.desc) L.push("    " + line.product.desc);
      if (line.product.benefit) L.push("    Why it matters: " + line.product.benefit);
    });
    L.push("");
  });
  L.push("Every payment above is exactly what we reviewed together, taxes included.");
  L.push("If you want any of this added, or want to swap between the packages, reply to this email or call me at " + c.phone + " and I will have it ready before you come in.");
  L.push("");
  L.push(u.name);
  L.push(u.role + ", " + c.name);
  L.push(b.finLabel);
  L.push(c.phone + " · " + c.email);
  L.push("");
  L.push("[ DEMONSTRATION PREVIEW — sample wording, not a contract or a binding quote ]");
  var subjectPkg = shown.length === 1 ? shown[0].label : "protection options";
  return {
    to: tx.customer.email || "",
    subject: "Your " + subjectPkg + " for the " + vehicle + " — " + c.name,
    body: L.join("\n")
  };
}

  if (fp && active && typeof active.selectionStart === "number"){
    try { selStart = active.selectionStart; selEnd = active.selectionEnd; } catch (e) {}

function makeLine(p){

    price:null, priceOverridden:false, declined:false, packages:{ preferred:false, essential:false, basic:false } };

    var want = C.primaryTerm(state.tx);
    if (want){ var best = p.terms[0];

    } else line.term = p.terms[Math.min(2, p.terms.length-1)];

  if (p.uses.km) line.km = p.kms[Math.min(2, p.kms.length-1)];
  if (p.uses.interval) line.interval = p.intervals[1] !== undefined ? p.intervals[1] : p.intervals[0];

function positionTour(){
  var t = state.ui.tour; if (!t) return;
  var st = TOUR_STEPS[t.i], spot = document.getElementById("tourSpot"), bar = document.getElementById("tourBar");
  var vh = window.innerHeight, bh = bar ? bar.offsetHeight : 200;
  function placeBar(top){ if (!bar) return; bar.style.top = top + "px"; bar.style.bottom = "auto"; }
  if (!st.sel || !spot){ placeBar(Math.max(12, (vh - bh) / 2)); return; }
  var el = document.querySelector(st.sel);
  if (!el){ spot.style.display = "none"; placeBar(Math.max(12, (vh - bh) / 2)); return; }
  if (t.scrolled !== t.i){
    t.scrolled = t.i;
    el.scrollIntoView({ block:"start" });
    window.scrollBy(0, -96);
  }
  var r = el.getBoundingClientRect(), pad = 8;
  var maxSpot = vh - bh - 44 - Math.max(r.top, 0) - pad;
  var spotH = Math.min(r.height, Math.max(120, maxSpot));
  spot.style.display = "";
  spot.style.left = (r.left - pad) + "px"; spot.style.top = (r.top - pad) + "px";
  spot.style.width = (r.width + pad*2) + "px"; spot.style.height = (spotH + pad*2) + "px";
  var bottomEdge = r.top + spotH + pad;
  if (vh - bottomEdge >= bh + 24) placeBar(bottomEdge + 16);
  else if (r.top - pad >= bh + 24) placeBar(r.top - pad - bh - 16);
  else placeBar(Math.max(12, vh - bh - 14));
}
window.addEventListener("scroll", function(){ if (state.ui.tour) positionTour(); }, { passive:true });
window.addEventListener("resize", function(){ if (state.ui.tour) positionTour(); });
document.addEventListener("keydown", function(ev){
  if (!state.ui.tour) return;
  if (ev.key === "ArrowRight" || ev.key === "Enter"){ ev.preventDefault(); tourStep(1); }
  else if (ev.key === "ArrowLeft"){ ev.preventDefault(); tourStep(-1); }
  else if (ev.key === "Escape"){ ev.preventDefault(); tourEnd(); }
});

function copyEmailText(){
  var box = document.getElementById("emailBody");
  var text = box ? box.value : buildEmail(state.tx).body;
  var done = false;
  try { if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text); done = true; } } catch (e) {}
  if (!done && box){
    try { box.focus(); box.select(); done = document.execCommand("copy"); } catch (e) { done = false; }
  }
  toast(done ? "Plain text copied to the clipboard." : "Copy was blocked — select the text and copy it manually.", done ? "ok" : "err");
}
function copyEmailHtml(){
  var mail = buildEmailHtml(state.tx), text = buildEmail(state.tx).body, done = false;
  try {
    if (navigator.clipboard && navigator.clipboard.write && window.ClipboardItem){
      var htmlBlob = new Blob([mail.html], { type:"text/html" });
      var textBlob = new Blob([text], { type:"text/plain" });
      navigator.clipboard.write([ new ClipboardItem({ "text/html":htmlBlob, "text/plain":textBlob }) ]);
      done = true;
    }
  } catch (e) { done = false; }
  if (!done){
    try { if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text); done = true; } } catch (e) {}
  }
  toast(done ? "Formatted email copied — paste it (Ctrl/Cmd+V) into your email draft." : "Rich copy isn't supported in this browser — use the HTML source box instead.", done ? "ok" : "err");
}
function sendEmail(){
  var subject = document.getElementById("emailSubject");
  var text = buildEmail(state.tx).body;
  var to = state.tx.customer.email || "";
  var href = "mailto:" + encodeURIComponent(to) + "?subject=" + encodeURIComponent(subject ? subject.value : "") +
    "&body=" + encodeURIComponent(text);
  var opened = null;
  try { opened = window.open(href, "_blank"); } catch (e) { opened = null; }
  if (!opened) toast("The browser blocked the mail app from this preview. Use Copy formatted email instead.","err");
  else toast("Opening your email app with the plain-text version.","ok");
}

/* ---------------- EVENTS ---------------- */
document.addEventListener("keydown", function(ev){
  if (ev.key === "Enter" && ev.target && (ev.target.id === "loginEmail" || ev.target.id === "loginPassword")){
    ev.preventDefault(); doLogin();
  }
});
document.addEventListener("click", function(ev){
  var el = ev.target.closest ? ev.target.closest("[data-act]") : null;
  if (!el) return;
  var act = el.getAttribute("data-act");
  if (act === "close-modal-bg" && ev.target !== el) return;
  if (/^product-(new|edit|save|toggle|delete)$/.test(act) && !V.isAdmin()){ toast("Only a General Manager can add, edit or delete products.","err"); return; }
  switch (act){
    case "route": state.route = el.getAttribute("data-route"); state.ui.railOpen = false; commit(); break;
    case "toggle-rail": state.ui.railOpen = !state.ui.railOpen; commit(); break;
    case "toggle-product-config": {
      var pcid = el.getAttribute("data-product");
      state.ui.productConfigOpen = (state.ui.productConfigOpen === pcid) ? null : pcid;
      commit(); break; }
    case "toggle-theme": state.ui.theme = state.ui.theme === "dark" ? "light" : "dark"; commit(); break;
    case "toggle-split": state.ui.split = !state.ui.split; commit(); break;
    case "present": state.ui.present = true; commit(); break;
    case "exit-present": state.ui.present = false; commit(); break;
    case "open-customer-window": openCustomerWindow(); break;
    case "new-deal": newDeal(); break;
    case "deal-open": openSavedDeal(el.getAttribute("data-deal")); break;
    case "deal-delete": {
      var delId = el.getAttribute("data-deal");
      if (!window.confirm("Delete this completed deal? This can't be undone.")) break;
      state.completed = state.completed.filter(function(d){ return d.id !== delId; });
      cloud.del.x.push(delId);
      toast("Deal " + delId + " deleted.","ok");
      commit(); break; }
    case "complete": completeDeal(); break;
    case "email":
      state.ui.modal = { kind:"email" };
      if (state.tx.display.selection){
        state.ui.email.pkg = state.tx.display.selection.package;
        state.ui.email.term = state.tx.display.selection.term ? String(state.tx.display.selection.term) : "all";
      }
      commit(); break;
    case "copy-email-html": copyEmailHtml(); break;
    case "copy-email-text": copyEmailText(); break;
    case "send-email": sendEmail(); break;
    case "select-final-package": {
      var fpk = el.getAttribute("data-package");
      state.tx.display.selection = (state.tx.display.selection && state.tx.display.selection.package === fpk)
        ? null : { package: fpk };
      commit(); break; }
    case "clear-selection": state.tx.display.selection = null; commit(); break;
    case "remove-line": {
      var lid = el.getAttribute("data-line");
      state.tx.lines = state.tx.lines.filter(function(l){ return l.lineId !== lid; });
      if (!state.tx.lines.length && state.tx.display.mode === "package") state.tx.display.mode = "welcome";
      commit(); break; }
    case "reset-price": {
      var ln = findLine(el.getAttribute("data-line"));
      if (ln){ ln.price = null; ln.priceOverridden = false; } commit(); break; }
    case "set-frequency": state.tx.finance.frequency = el.getAttribute("data-freq"); commit(); break;
    case "set-deal-type": state.tx.type = el.getAttribute("data-deal-type"); commit(); break;
    case "cd-mode": state.tx.display.mode = el.getAttribute("data-mode"); commit(); break;
    case "scroll-step": {
      var target = document.getElementById("step-" + el.getAttribute("data-step"));
      if (target && target.scrollIntoView) target.scrollIntoView({ behavior:"smooth", block:"start" }); break; }
    case "print-internal": state.ui.modal = { kind:"internal" }; commit(); break;
    case "print-customer": state.ui.modal = { kind:"customer" }; commit(); break;
    case "close-modal": case "close-modal-bg":
      state.ui.modal = null; state.ui.productEdit = null; state.ui.userForm = false; state.ui.dealerForm = null; state.ui.extendForm = null; commit(); break;
    case "do-print": try { window.print(); } catch (e) { toast("The browser blocked printing in this preview window.","err"); } break;
    case "product-new": state.ui.productEdit = { id:null, name:"", code:"", category:"", active:true, taxRule:"standard",
      uses:{term:true,km:false,interval:false,deductible:false}, terms:[36,48,60,72], kms:[], intervals:[], deductibles:[],
      cost:null, desc:"", benefit:"", pricing:{ base:0, term:{} } }; commit(); break;
    case "product-edit": state.ui.productEdit = C.clone(C.productById(state, el.getAttribute("data-product"))); commit(); break;
    case "product-cancel": state.ui.productEdit = null; commit(); break;
    case "product-save": saveProduct(); break;
    case "product-toggle": {
      var pr = C.productById(state, el.getAttribute("data-product"));
      if (pr){ pr.active = !pr.active;
        if (!pr.active) state.tx.lines = state.tx.lines.filter(function(l){ return l.productId !== pr.id; }); }
      commit(); break; }
    case "product-delete": {
      var did = el.getAttribute("data-product");
      state.products = state.products.filter(function(p){ return p.id !== did; });
      cloud.del.p.push({ dealer:state.activeDealershipId, id:did });
      state.tx.lines = state.tx.lines.filter(function(l){ return l.productId !== did; });
      toast("Product removed from the master list.","ok"); commit(); break; }
    case "user-new": state.ui.userForm = true; state.ui.inviteSel = null; commit(); break;
    case "user-cancel": state.ui.userForm = false; commit(); break;
    case "user-save": saveUser(); break;
    case "user-setpw": {
      var upw = userById(el.getAttribute("data-user"));
      var next = window.prompt("Set a temporary password for " + upw.name + " (min 8 characters). They'll choose their own at next sign-in:", "");
      if (next === null) break;
      next = next.trim();
      if (next.length < 8){ toast("Password not changed — use at least 8 characters.","err"); break; }
      adminCall({ action:"reset_password", id:upw.id, password:next })
        .then(function(){ toast("Temporary password set for " + upw.name + ".","ok"); refreshUsers(); })
        .catch(function(e){ toast(e.message,"err"); });
      break; }
    case "user-toggle": {
      var uu = userById(el.getAttribute("data-user"));
      if (uu.role === "Master Administrator") { toast("A master administrator can't be deactivated.","err"); break; }
      if (!/^[0-9a-f]{8}-[0-9a-f]{4}-/.test(uu.id)){ uu.active = !uu.active; commit(); break; }
      adminCall({ action:"update", id:uu.id, active:!uu.active })
        .then(function(){ refreshUsers(); }).catch(function(e){ toast(e.message,"err"); });
      break; }
    case "user-delete": {
      var uid2 = el.getAttribute("data-user");
      var ud = userById(uid2);
      if (ud.role === "Master Administrator") { toast("A master administrator can't be removed.","err"); break; }
      if (uid2 === state.currentUserId) { toast("You can't remove your own account.","err"); break; }
      if (!window.confirm("Remove " + ud.name + "? They will no longer be able to sign in.")) break;
      if (!/^[0-9a-f]{8}-[0-9a-f]{4}-/.test(uid2)){
        /* A leftover from before real accounts existed — it only lives in this browser, so there's nothing on the server to delete. */
        state.users = state.users.filter(function(u){ return u.id !== uid2; }); toast("User removed.","ok"); commit(); break;
      }
      adminCall({ action:"delete", id:uid2 }).then(function(r){
        if (r && r.deactivated){
          ud.active = false; toast(ud.name + " has linked records, so the account was deactivated and can no longer sign in.","ok"); commit(); refreshUsers(); return;
        }
        state.users = state.users.filter(function(u){ return u.id !== uid2; }); toast("User removed.","ok"); commit();
      }).catch(function(e){ toast(e.message,"err"); });
      break; }
    case "uf-access": {
      var mr = document.querySelector(".modal"); if (!mr) break;
      var av = el.getAttribute("data-val");
      mr.querySelector('[data-uf="access"]').value = av;
      Array.prototype.forEach.call(el.parentNode.children, function(b){ b.classList.toggle("on", b === el); });
      mr.querySelector("#ufDemoBox").style.display = av === "demo" ? "" : "none";
      initWheels(); break; }
    case "demo-extend": state.ui.extendForm = { id:el.getAttribute("data-user") }; commit(); break;
    case "extend-save": {
      var ef = state.ui.extendForm;
      if (!ef || !ef.sel){ toast("Pick a date and time.","err"); break; }
      var dt = wheelDate(ef.sel);
      if (!(dt.getTime() > Date.now())){ toast("Pick a moment in the future.","err"); break; }
      var newExp = dt.toISOString();
      adminCall({ action:"update", id:ef.id, access_type:"demo", expires_at:newExp })
        .then(function(){ state.ui.extendForm = null; toast("Demo extended to " + fmtExpiry(newExp) + ".","ok"); refreshUsers(); commit(); })
        .catch(function(e){ toast(e.message,"err"); });
      break; }
    case "demo-convert": {
      var dc = userById(el.getAttribute("data-user"));
      if (!window.confirm("Give " + dc.name + " full access with no time limit?")) break;
      adminCall({ action:"update", id:dc.id, access_type:"full" })
        .then(function(){ toast(dc.name + " now has full access.","ok"); refreshUsers(); })
        .catch(function(e){ toast(e.message,"err"); });
      break; }
    case "do-change-password": doChangePassword(); break;
    case "toggle-pw": {
      var pwi = document.getElementById("loginPassword");
      if (pwi) pwi.type = pwi.type === "password" ? "text" : "password";
      break; }
    case "demo-ack": state.ui.welcome = null; maybeStartTour(); commit(); break;
    case "set-theme": state.ui.theme = el.getAttribute("data-theme"); commit(); break;
    case "tour-next": tourStep(1); break;
    case "tour-back": tourStep(-1); break;
    case "tour-skip": tourEnd(); break;
    case "extend-cancel": state.ui.extendForm = null; commit(); break;
    case "dealer-new": state.ui.dealerForm = { id:null, name:"", brandKey:"ford", logoMark:"", active:true,
      address:"", city:"", phone:"", email:"", dealerCode:"",
      finance:{ defaultApr:7.49, defaultTerm:72, defaultFrequency:"biweekly", adminFee:699, licensing:120 },
      tax:{ standard:13, vrc:8 } }; commit(); break;
    case "dealer-edit": state.ui.dealerForm = C.clone(V.dealershipById(el.getAttribute("data-dealership"))); commit(); break;
    case "dealer-cancel": state.ui.dealerForm = null; commit(); break;
    case "dealer-save": saveDealer(); maybeStartTour(); break;
    case "dealer-delete": deleteDealer(el.getAttribute("data-dealership")); break;
    case "switch-to-dealership": V.setDealership(el.getAttribute("data-dealership")); state.route = "finance"; commit(); break;
    case "reset-demo": resetDemo(); break;
    case "do-login": doLogin(); break;
    case "logout": doLogout(); break;
    case "forgot-password": toast("Ask your administrator to reset your password — they can set a new temporary one for you under Users and access.","info"); commit(); break;
  }
});

document.addEventListener("change", function(ev){
  var el = ev.target;
  if (el.getAttribute && el.getAttribute("data-pf") === "category" && state.ui.productEdit){
    var proot = document.querySelector(".modal");
    if (!proot) return;
    var descEl = proot.querySelector('[data-pf="desc"]'), benEl = proot.querySelector('[data-pf="benefit"]');
    var nameEl = proot.querySelector('[data-pf="name"]');
    if (descEl && benEl && !descEl.value.trim() && !benEl.value.trim()){
      var tmpl = categoryTemplate(el.value, nameEl ? nameEl.value.trim() : "");
      descEl.value = tmpl.desc; benEl.value = tmpl.benefit;
    }
  }
});
document.addEventListener("change", function(ev){
  var el = ev.target, act = el.getAttribute("data-act");
  if (act === "switch-user"){
    state.currentUserId = el.value;
    var u = userById(el.value);
    if (u.dealershipId && u.dealershipId !== state.activeDealershipId) V.setDealership(u.dealershipId);
    if (!V.isMaster() && state.route === "dealerships") state.route = "dashboard";
    commit(); return;
  }
  if (act === "switch-dealership"){ V.setDealership(el.value); commit(); return; }
  if (act === "assign-dealership"){
    var target = userById(el.getAttribute("data-user"));
    target.dealershipId = el.value;
    adminCall({ action:"update", id:target.id, dealership_id:el.value }).catch(function(e){ toast(e.message,"err"); });
    commit(); return;
  }
  if (act === "dealer-brand"){
    if (state.ui.dealerForm){
      state.ui.dealerForm.brandKey = el.value;
      state.ui.dealerForm.logoMark = (D.BRANDS[el.value]||D.BRANDS.nissan).mark;
    }
    commit(); return;
  }
  if (act === "toggle-term"){
    var tm = Number(el.getAttribute("data-term")), list = state.tx.finance.terms.slice();
    if (!state.tx.finance.rates) state.tx.finance.rates = {};
    if (el.checked){
      if (list.indexOf(tm) === -1) list.push(tm);
      if (state.tx.finance.rates[tm] === undefined) state.tx.finance.rates[tm] = state.config.finance.defaultApr;
    } else {
      list = list.filter(function(x){ return x !== tm; });
      delete state.tx.finance.rates[tm];
      if (state.tx.display.selection && state.tx.display.selection.term === tm) state.tx.display.selection = null;
    }
    state.tx.finance.terms = list.sort(function(a,b){ return a-b; });
    commit(); return;
  }
  if (act === "term-rate"){
    var trm = Number(el.getAttribute("data-term"));
    if (!state.tx.finance.rates) state.tx.finance.rates = {};
    state.tx.finance.rates[trm] = el.value === "" ? null : Number(el.value);
    commit(); return;
  }
  if (act === "toggle-package-list"){
    var pid2 = el.getAttribute("data-product"), pkgKey = el.getAttribute("data-package");
    var line2 = state.tx.lines.filter(function(l){ return l.productId === pid2; })[0];
    if (!line2){
      if (!el.checked) return;
      var prod2 = C.productById(state, pid2);
      if (!prod2) return;
      line2 = makeLine(prod2);
      state.tx.lines.push(line2);
    }
    if (!line2.packages) line2.packages = { preferred:false, essential:false, basic:false };
    var wasInAnyPkg = line2.packages.preferred || line2.packages.essential || line2.packages.basic;
    line2.packages[pkgKey] = el.checked;
    if (el.checked) line2.declined = false;
    /* The customer display lists products in the order they were selected
       into a package. A price typed in before any package is picked (or a
       product declined and later brought back) shouldn't count as "selected"
       yet — only the moment it first joins a package sets its display order,
       so move it to the end of the line-up right then. */
    if (el.checked && !wasInAnyPkg){
      state.tx.lines = state.tx.lines.filter(function(l){ return l.lineId !== line2.lineId; });
      state.tx.lines.push(line2);
    }
    /* Unchecking every package used to delete the whole line, which silently
       wiped out a price the FSM had already typed in — a price now only
       ever goes away if the FSM explicitly clears it (Reset) or removes the
       line, never as a side effect of package checkboxes. */
    if (state.tx.lines.length && state.tx.display.mode === "welcome") state.tx.display.mode = "package";
    if (!state.tx.lines.length && state.tx.display.mode === "package") state.tx.display.mode = "welcome";
    commit(); return;
  }
  if (act === "toggle-decline"){
    var pid3 = el.getAttribute("data-product");
    var line3 = state.tx.lines.filter(function(l){ return l.productId === pid3; })[0];
    if (el.checked){
      if (!line3){
        var prod3 = C.productById(state, pid3);
        if (!prod3) return;
        line3 = makeLine(prod3);
        state.tx.lines.push(line3);
      }
      /* Remember exactly which packages it was in so "Undo" can put it back
         without the FSM re-checking every box, and never remove the line
         while declined — that's what was silently wiping out the price and
         its position in the line-up on undo before. */
      line3.declinedFrom = C.clone(line3.packages || { preferred:false, essential:false, basic:false });
      line3.packages = { preferred:false, essential:false, basic:false };
      line3.declined = true;
    } else if (line3){
      line3.declined = false;
      var restored = line3.declinedFrom || { preferred:true, essential:false, basic:false };
      line3.packages = restored;
      line3.declinedFrom = null;
    }
    if (state.tx.lines.length && state.tx.display.mode === "welcome") state.tx.display.mode = "package";
    commit(); return;
  }
  if (act === "toggle-payment"){ state.tx.display.showPayment = el.checked; commit(); return; }
  if (act === "toggle-prices"){ state.tx.display.showPrices = el.checked; commit(); return; }
  if (act === "toggle-config"){ state.tx.display.showConfig = el.checked; commit(); return; }
  if (act === "report-preset"){
    state.ui.reports.period = el.value;
    var r = presetRange(el.value);
    state.ui.reports.from = r.from; state.ui.reports.to = r.to;
    commit(); return;
  }
  var bind = el.getAttribute("data-bind");
  if (!bind) return;
  var raw = el.type === "checkbox" ? el.checked : el.value;
  var num = el.getAttribute("data-type") === "num";
  if (bind.indexOf("newline:") === 0){
    var nparts = bind.split(":"), nprod = C.productById(state, nparts[1]);
    if (!nprod || raw === "") return;
    var nline = state.tx.lines.filter(function(l){ return l.productId === nprod.id; })[0];
    if (!nline){ nline = makeLine(nprod); state.tx.lines.push(nline); }
    nline.price = num ? Number(raw) : raw;
    var nconf = C.priceFor(nprod, nline);
    nline.priceOverridden = !(nline.price === null || nconf === null || Number(nline.price) === Number(nconf));
    commit(); return;
  }
  if (bind.indexOf("line:") === 0){
    var parts = bind.split(":"), ln2 = findLine(parts[1]), field = parts[2];
    if (!ln2) return;
    if (raw === "") ln2[field] = null; else ln2[field] = num ? Number(raw) : raw;
    if (field === "price"){
      var prod = C.productById(state, ln2.productId), conf = C.priceFor(prod, ln2);
      ln2.priceOverridden = !(ln2.price === null || conf === null || Number(ln2.price) === Number(conf));
    } else if (!ln2.priceOverridden) ln2.price = null;
    commit(); return;
  }
  var value = raw === "" ? (num ? null : "") : (num ? Number(raw) : raw);
  V.setPath(state, bind, value);
  if (bind === "config.brandKey"){
    var bd = D.BRANDS[value];
    if (bd) state.config.logoMark = bd.mark;
  }
  commit();
});

/* ---------------- BOOT ---------------- */
function boot(){
  if (state.tx) V.applyFinanceDefaults(state.tx);
  var r = presetRange("monthly");
  state.ui.reports.from = r.from; state.ui.reports.to = r.to;
  authInit();
  commit();
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();

function addToPackage(pid, pkgKey){
  var line = state.tx.lines.filter(function(l){ return l.productId === pid; })[0];
  if (!line){
    var prod = C.productById(state, pid);
    if (!prod) return;
    line = makeLine(prod);
    state.tx.lines.push(line);
  }
  if (!line.packages) line.packages = { preferred:false, essential:false, basic:false };
  line.packages[pkgKey || "preferred"] = true;
}

  viewProducts:viewProducts, viewReports:viewReports, viewUsers:viewUsers, viewSettings:viewSettings,

  saveDealer:saveDealer, deleteDealer:deleteDealer, customerWindowDoc:customerWindowDoc, renderOnboarding:renderOnboarding };
})();
