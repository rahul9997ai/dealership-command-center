<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dealership Command Center — FSM Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---- light (normal) mode: white + blue ---- */
:root{
  --blue:#1d61d8;
  --blue-2:#3d82f2;
  --blue-deep:#0d2f6b;
  --blue-ink:#ffffff;
  --bg:#f3f6fb;
  --surface:#ffffff;
  --surface-2:#f6f9fd;
  --surface-3:#eaf0f9;
  --text:#0d1b2e;
  --text-2:#33455f;
  --muted:#64748b;
  --border:#dbe3ef;
  --border-strong:#bfcbdd;
  --rail:#0c1d33;
  --rail-2:#16304f;
  --rail-text:#a9bcd4;
  --ok:#0a7546; --ok-bg:#e7f6ef;
  --warn:#8a5106; --warn-bg:#fdf2e3;
  --danger:#b42318; --danger-bg:#fdecea;
  --info:#1d61d8; --info-bg:#e9f0fd;
  --shadow:0 1px 2px rgba(13,27,46,.05),0 10px 26px rgba(13,27,46,.07);
  --radius:11px;
}
/* ---- dark mode: black + blue ---- */
:root[data-theme="dark"]{
  --blue:#4c8dff; --blue-2:#79aaff; --blue-deep:#0a1b33; --blue-ink:#061020;
  --bg:#070c14; --surface:#0f1723; --surface-2:#131d2b; --surface-3:#1a2637;
  --text:#e9eff8; --text-2:#c2cee0; --muted:#8798ae; --border:#23324a; --border-strong:#35496a;
  --rail:#050a12; --rail-2:#111d30; --rail-text:#97a9c2;
  --ok:#4ec08d; --ok-bg:#0f271d; --warn:#e2a862; --warn-bg:#2a2013; --danger:#f0897f; --danger-bg:#2b1614;
  --info:#79aaff; --info-bg:#122238;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 26px rgba(0,0,0,.42);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:17px} h3{font-size:15px} h4{font-size:13px}
p{margin:0 0 8px}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12px} .tiny{font-size:11px}
.right{text-align:right} .center{text-align:center} .nowrap{white-space:nowrap} .hidden{display:none !important}

.app{display:flex;min-height:100vh}
.rail{width:242px;flex:0 0 242px;background:var(--rail);color:var(--rail-text);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.rail-brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;gap:11px;align-items:center}
.badge-logo{width:38px;height:38px;border-radius:9px;background:linear-gradient(140deg,var(--blue),var(--blue-2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 38px}
.rail-brand .nm{color:#fff;font-weight:600;font-size:14px;line-height:1.25}
.rail-brand .sb{font-size:11px;color:var(--rail-text)}
.rail nav{padding:10px;flex:1}
.nav-group{font-size:10.5px;letter-spacing:.09em;color:#6d84a3;text-transform:uppercase;padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--rail-text);padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13.5px}
.nav-item:hover{background:var(--rail-2);color:#fff}
.nav-item.active{background:var(--rail-2);color:#fff;box-shadow:inset 3px 0 0 var(--blue)}
.nav-item .ic{width:18px;text-align:center;opacity:.9}
.nav-item .tagx{margin-left:auto;font-size:9.5px;border:1px solid rgba(255,255,255,.2);border-radius:4px;padding:1px 5px;color:#8fa3bf}
.rail-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08)}
.userchip{display:flex;gap:10px;align-items:center;padding:8px;border-radius:8px;background:var(--rail-2)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.userchip .nm{color:#fff;font-size:12.5px;font-weight:500}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.topbar .demo{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.view{padding:20px 22px 48px;max-width:1620px;width:100%}
.menu-btn{display:none}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card-b{padding:16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi{padding:14px 16px}
.kpi .lb{font-size:12px;color:var(--muted)}
.kpi .vl{font-size:26px;font-weight:600;margin-top:4px;letter-spacing:-.02em}
.kpi .dt{font-size:11.5px;color:var(--muted);margin-top:3px}
.btn{border:1px solid var(--border-strong);background:var(--surface);color:var(--text);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.dark{background:var(--rail);border-color:var(--rail);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-3)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--surface-3);color:var(--text-2);border:1px solid var(--border)}
.tag.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.tag.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.tag.danger{background:var(--danger-bg);color:var(--danger);border-color:transparent}
.tag.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.tag.demo{background:var(--warn-bg);color:var(--warn);border-color:transparent;font-weight:600;letter-spacing:.04em}
label.f{display:block;margin-bottom:12px}
label.f > span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=number],input[type=date],input[type=email],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface)}
textarea{font-family:inherit}
input:disabled,select:disabled{background:var(--surface-3);color:var(--muted)}
.inline{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.inline > *{flex:1;min-width:130px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.bar{height:7px;border-radius:4px;background:var(--surface-3);overflow:hidden;min-width:60px}
.bar > i{display:block;height:100%;background:var(--blue)}
.empty{padding:34px 18px;text-align:center;color:var(--muted)}
.notice{padding:11px 13px;border-radius:9px;font-size:13px;display:flex;gap:9px;align-items:flex-start}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.notice.err{background:var(--danger-bg);color:var(--danger)}
.notice.info{background:var(--info-bg);color:var(--info)}
.notice.ok{background:var(--ok-bg);color:var(--ok)}
.divider{height:1px;background:var(--border);margin:14px 0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:13px}
.kv .k{color:var(--muted)}
.kv.total{border-top:1px solid var(--border-strong);margin-top:6px;padding-top:9px;font-weight:600;font-size:15px}
.switch{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;cursor:pointer;user-select:none}
.switch input{accent-color:var(--blue);width:15px;height:15px}
.chiprow{display:flex;gap:7px;flex-wrap:wrap}
.termchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border-strong);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;background:var(--surface)}
.termchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.termchip input{display:none}

.uc{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 20px;text-align:center;gap:10px}
.uc .bigtag{font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--warn);background:var(--warn-bg);padding:8px 16px;border-radius:6px}

.fin-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.fin-toolbar .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.fin-split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
.fin-split.solo{grid-template-columns:minmax(0,1fr)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.step{display:flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid var(--border);border-radius:999px;background:var(--surface);font-size:12.5px;cursor:pointer}
.step .n{width:19px;height:19px;border-radius:50%;background:var(--surface-3);color:var(--text-2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.step.done .n{background:var(--ok);color:#fff}
.step.done{border-color:var(--ok)}
.stack{display:flex;flex-direction:column;gap:14px}
.prodrow{border:1px solid var(--border);border-radius:10px;padding:11px 12px;background:var(--surface-2)}
.prodrow + .prodrow{margin-top:10px}
.prodrow .ph{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.prodrow .ph .nm{font-weight:600}
.prodrow .ph .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.prodrow .phrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.prodrow .phrow .left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prodrow .phrow .right{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.prodrow .phrow .nm{font-weight:600}
.pkgpick{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;padding-top:9px;border-top:1px dashed var(--border)}
.prodrow2{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:1px solid var(--border);border-radius:10px;padding:12px 16px;background:var(--surface-2)}
.prodrow2 + .prodrow2{margin-top:10px}
.prodrow2 .pr-icon{flex:0 0 auto;width:34px;height:34px;border-radius:9px;background:linear-gradient(140deg,var(--blue),var(--blue-2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
.prodrow2 .pr-name{flex:1;min-width:180px}
.prodrow2 .pr-name .nm{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prodrow2 .pr-ctrls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pricebox{position:relative;width:112px}
.pricebox .pfx{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}
.pricebox input{padding-left:22px}
.pkgchk-row{display:flex;gap:10px;align-items:center}
.pkgchk{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--text-2);cursor:pointer;user-select:none}
.pkgchk input{accent-color:var(--blue);width:15px;height:15px}
.pkgchk.on{color:var(--text);font-weight:600}
.declinebtn{display:inline-flex;align-items:center;border:1px solid var(--border-strong);background:var(--rail);color:#fff;padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.declinebtn input{display:none}
.declinebtn.on{background:var(--danger);border-color:var(--danger)}
.declinebtn:hover{filter:brightness(1.1)}
.pkgpick .lb{font-size:11.5px;color:var(--muted);align-self:center;margin-right:2px}
.pkgbox{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);border-radius:8px;padding:4px 9px;font-size:12px;cursor:pointer;background:var(--surface)}
.pkgbox.on{border-color:var(--blue);background:var(--info-bg);color:var(--info);font-weight:600}
.pkgbox input{accent-color:var(--blue)}
.pkgbox.decline{border-color:var(--border)}
.pkgbox.decline.on{border-color:var(--danger);background:var(--danger-bg);color:var(--danger)}
.pkgselect-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pkgselect{display:flex;flex-direction:column;align-items:center;gap:4px;border:1.5px solid var(--border-strong);border-radius:11px;padding:16px 12px;background:var(--surface);cursor:pointer;text-align:center}
.pkgselect:hover{background:var(--surface-3)}
.pkgselect.on{border-color:var(--blue);background:var(--info-bg);box-shadow:inset 0 0 0 1px var(--blue)}
.pkgselect .pks-name{font-weight:700;font-size:13px;letter-spacing:.04em}
.pkgselect .pks-count{font-size:11.5px;color:var(--muted)}
.pkgselect .pks-total{font-size:20px;font-weight:700;margin-top:2px}
.pkgselect.on .pks-total{color:var(--blue)}
.cd-waiver{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)}
.wv-lbl{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--warn);margin-bottom:8px}
.wv-card{display:flex;align-items:center;gap:10px;border:1px solid var(--warn);background:var(--warn-bg);border-radius:9px;padding:9px 12px}
.wv-card + .wv-card{margin-top:8px}
.wv-x{flex:0 0 auto;width:22px;height:22px;border-radius:6px;background:var(--warn);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.wv-name{font-weight:700;font-size:13px;color:var(--warn)}
.wv-sub{font-size:11px;color:var(--warn);opacity:.85;margin-top:1px}
.cfgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:9px;margin-top:10px}
.cfgrid label.f{margin-bottom:0}
.cfg-popover{background:var(--surface-2);border:1px dashed var(--border-strong);padding:11px;border-radius:9px}
.gearbtn{border:1px solid var(--border-strong);background:var(--surface);color:var(--text-2);width:24px;height:24px;border-radius:6px;cursor:pointer;font-size:12.5px;line-height:1;padding:0}
.gearbtn:hover{background:var(--surface-3)}
.gearbtn.on{background:var(--info-bg);color:var(--info);border-color:var(--info)}
.price-inline{margin:0;max-width:160px}
.catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:10px}
.catcard{border:1px solid var(--border);border-radius:10px;padding:11px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.catcard.sel{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.catcard .nm{font-weight:600;font-size:13.5px}
.catcard .ds{font-size:11.5px;color:var(--muted);line-height:1.4}
.catcard .ft{margin-top:auto;display:flex;align-items:center;gap:8px;padding-top:6px}

.monitor{position:sticky;top:78px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.monitor-bar{background:var(--rail);color:#b7c7dd;font-size:11px;padding:7px 12px;display:flex;align-items:center;gap:8px;letter-spacing:.06em}
.monitor-bar .live{width:7px;height:7px;border-radius:50%;background:#37d39b}
.monitor-bar .sp{margin-left:auto;display:flex;gap:6px}
.cd{background:var(--surface);min-height:430px;display:flex;flex-direction:column}
.cd-head{background:linear-gradient(120deg,var(--blue-deep),var(--blue));color:#fff;padding:22px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px}
.cd-head .fs{font-size:32px;font-weight:800;letter-spacing:.04em;line-height:1.1}
.cd-head .sb{font-size:11.5px;opacity:.82}
.cd-tagline{font-size:13px;opacity:.9;margin-top:4px;font-style:italic}
.cd-sub1{font-size:16px;font-weight:600;color:var(--blue);margin-top:2px}
.cd-note{background:var(--surface-3);border-top:1px solid var(--border);padding:12px 20px;text-align:center}
.cd-note .nt1{font-weight:700;font-size:13.5px}
.cd-note .nt2{font-size:11px;color:var(--muted);margin-top:3px}
.cd-mid-veh{font-size:22px;font-weight:600;letter-spacing:-.01em;margin-top:2px}
.cd-body{padding:28px 40px;flex:1;max-width:1620px;width:100%;margin:0 auto;box-sizing:border-box}
.cd-welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:56px 24px;flex:1}
.cd-welcome .hw{font-size:30px;font-weight:600;letter-spacing:-.02em}
.cd-veh{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;justify-content:center;text-align:center;border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:24px}
.cd-veh .v1{font-size:19px;font-weight:600}
.pkgrid{display:flex;flex-wrap:wrap;gap:26px;justify-content:center;align-items:flex-start}
.pkgcard{border:1px solid var(--border);border-radius:11px;overflow:hidden;background:var(--surface-2);display:flex;flex-direction:column;flex:1 1 380px;max-width:460px;min-width:300px;box-shadow:var(--shadow)}
.pkgcard .ph{background:var(--rail);color:#fff;padding:18px 14px;font-weight:800;font-size:21px;letter-spacing:.05em;text-align:center;display:flex;align-items:center;justify-content:center;gap:10px}
.pkgcard .ph-icon{opacity:.9;font-size:18px}
.pkgcard .pb{padding:14px 16px;flex:1}
.pkgcard .pi{padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;display:flex;align-items:flex-start;gap:9px}
.pkgcard .pi:last-child{border-bottom:0}
.pkgcard .pi-icon{flex:0 0 auto;width:22px;height:22px;border-radius:7px;background:linear-gradient(140deg,var(--blue),var(--blue-2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;margin-top:1px}
.pkgcard .pi-txt{min-width:0}
.pkgcard .pi .n2{font-weight:600}
.pkgcard .pi .c2{color:var(--muted);font-size:11.5px}
.paybox{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px;background:var(--surface-3);border-bottom:1px solid var(--border)}
.payterm{flex:1;min-width:84px;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 6px}
.pt-term{font-size:10.5px;color:var(--muted);letter-spacing:.04em}
.pt-amt{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.pt-freq{font-size:10px;margin-top:1px}
.cd-foot{padding:10px 20px;border-top:1px solid var(--border);color:var(--muted);font-size:11.5px;display:flex;gap:10px;flex-wrap:wrap}
.present-mode{position:fixed;inset:0;background:var(--bg);z-index:60;overflow:auto}
.present-mode .cd{min-height:100vh}
.present-exit{position:fixed;right:14px;bottom:14px;z-index:61}

.modal-bg{position:fixed;inset:0;background:rgba(4,10,20,.6);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:26px 14px;overflow:auto}
.modal{background:var(--surface);border-radius:12px;width:min(900px,100%);box-shadow:0 22px 64px rgba(0,0,0,.45)}
.modal.wide{width:min(1060px,100%)}
.modal-h{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.modal-h .sp{margin-left:auto;display:flex;gap:8px}
.modal-b{padding:18px;max-height:calc(100vh - 160px);overflow:auto}
.doc{background:#fff;color:#111;padding:26px 30px;border:1px solid #dfe5ee;border-radius:9px;font-size:12.5px}
.doc h1{font-size:19px;color:#111}
.doc h3{font-size:13px;color:#111;margin-bottom:6px}
.doc table{font-size:12px}

/* =====================================================================
   Layer 2: STATE HELPERS + THE SHARED CALCULATION ENGINE
   One transaction, one engine. FSM display, customer display, prints,
   the emailed presentation and reporting all read these functions.
   ===================================================================== */
(function () {
"use strict";
var D = window.__DCC_DATA__;

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function uid(p){ return p + "-" + Math.random().toString(36).slice(2,8); }
function money(n){ if (n === null || n === undefined || isNaN(n)) return "—";
  return "$" + Number(n).toLocaleString("en-CA",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function money0(n){ if (n === null || n === undefined || isNaN(n)) return "—";
  return "$" + Math.round(Number(n)).toLocaleString("en-CA"); }
function km(n){ return Number(n).toLocaleString("en-CA") + " km"; }
function esc(s){ return String(s === null || s === undefined ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){ if(!iso) return "—";
  var d = new Date(iso + (iso.length === 10 ? "T12:00:00" : ""));
  return d.toLocaleDateString("en-CA",{year:"numeric",month:"short",day:"2-digit"}); }
function freqLabel(f){ return f === "biweekly" ? "bi-weekly" : "monthly"; }

function newTransaction(fsmUserId, dealershipId){
  return {
    id: uid("DEMO"), createdAt: todayISO(), type:"Finance", status:"Open",
    fsmUserId: fsmUserId || null, dealershipId: dealershipId || null,
    customer:{ id:null, name:"", phone:"", email:"", address:"" },
    vehicle:{ id:null, year:"", make:"", model:"", stock:"", vin:"", odometer:"", condition:"New", price:null },
    finance:{ tradeAllowance:0, tradePayout:0, downPayment:0, fees:[], feeAmount:0, rates:{}, terms:[], frequency:null },
    lines:[],   /* { lineId, productId, term, km, interval, deductible, price, priceOverridden, packages{} } */
    display:{ mode:"welcome", showPayment:true, selection:null }
  };
}
function primaryTerm(tx){
  var ts = (tx.finance.terms || []).slice().sort(function(a,b){ return a-b; });
  return ts.length ? ts[0] : null;
}
function sortedTerms(tx){ return (tx.finance.terms || []).slice().sort(function(a,b){ return a-b; }); }

function productById(state, id){
  for (var i=0;i<state.products.length;i++) if (state.products[i].id === id) return state.products[i];
  return null;
}
function priceFor(product, line){
  if (!product || !product.pricing) return null;
  var p = product.pricing, total = Number(p.base || 0), part;
  function need(flag, key, val){
    if (!flag) return true;
    if (val === null || val === undefined || val === "") return false;
    part = p[key] ? p[key][val] : undefined;
    if (part === undefined) return false;
    total += part; return true;
  }
  if (!need(product.uses.term, "term", line.term)) return null;
  if (!need(product.uses.km, "km", line.km)) return null;
  if (!need(product.uses.interval, "interval", line.interval)) return null;
  if (!need(product.uses.deductible, "deductible", line.deductible)) return null;
  return Math.round(total);
}
function taxRateFor(product, taxCfg){
  if (!product || product.taxRule === "exempt") return 0;
  if (product.taxRule === "vrc") return Number(taxCfg.vrc)/100;
  return Number(taxCfg.standard)/100;

function periodsPerYear(freq){ return freq === "biweekly" ? 26 : 12; }

  if (!principal || principal <= 0 || !months) return 0;
  var ppy = periodsPerYear(freq), n = Math.round(months/12*ppy), r = (Number(aprPct)||0)/100/ppy;
  if (n <= 0) return 0;
  if (r === 0) return principal / n;
  return principal * r / (1 - Math.pow(1+r,-n));
}

  var d = state.config || {};
  return D.BRANDS[d.brandKey] || D.BRANDS.nissan;
}
function packageLabel(state, suffix){
  return (brandOf(state).label + " " + suffix).toUpperCase();

/* -------- the single totals engine -------- */
function totals(state, tx){
  var taxCfg = state.config.tax, fin = state.config.finance;
  var lines = [], sub = 0, taxStd = 0, taxVrc = 0, cost = 0, unpriced = 0, i;
  var presentedTerms = sortedTerms(tx);

  for (i=0;i<tx.lines.length;i++){
    var l = tx.lines[i], prod = productById(state, l.productId);
    if (!prod) continue;
    if (!l.packages) l.packages = { preferred:true, essential:false, basic:false };
    if (l.declined === undefined) l.declined = false;
    var configured = priceFor(prod, l);
    var price = (l.price === null || l.price === undefined || l.price === "") ? configured : Number(l.price);
    var rate = taxRateFor(prod, taxCfg);
    var priced = !(price === null || price === undefined || isNaN(price));
    var anyPkg = l.packages.preferred || l.packages.essential || l.packages.basic;
    if (!priced && !l.declined && anyPkg) unpriced++;
    var amount = priced ? price : 0;
    var tax = Math.round(amount*rate*100)/100;
    if (!l.declined && anyPkg){
      if (prod.taxRule === "vrc") taxVrc += tax; else taxStd += tax;
      sub += amount; cost += Math.round(amount*(prod.costFactor||0));
    }
    var termForDay = (prod.uses.term && l.term) ? Number(l.term) : (primaryTerm(tx) || 60);
    var days = termForDay * 30.44;
    var perDay = (priced && days > 0) ? Math.round((amount/days)*100)/100 : null;
    var perDayByTerm = (presentedTerms.length ? presentedTerms : [termForDay]).map(function(tm){
      var d = tm * 30.44;
      return { term:tm, perDay: (priced && d > 0) ? Math.round((amount/d)*100)/100 : null };
    });
    lines.push({ lineId:l.lineId, product:prod, cfg:l, price: priced ? amount : null, configuredPrice:configured,
      overridden: !!l.priceOverridden, rate:rate, ratePct:Math.round(rate*10000)/100, tax:tax, perDayByTerm:perDayByTerm,
      total:Math.round((amount+tax)*100)/100, cost:Math.round(amount*(prod.costFactor||0)), perDay:perDay });
  }

  var productsSub = Math.round(sub*100)/100;
  var productsTax = Math.round((taxStd+taxVrc)*100)/100;
  var productsTotal = Math.round((productsSub+productsTax)*100)/100;

  var vPrice = Number(tx.vehicle.price)||0, adminFee = Number(fin.adminFee)||0, lic = Number(fin.licensing)||0;

function buildHistory(state){

  var roster = { d1:["u2","u3","u4","u5"], d2:["u7"] };
  var today = new Date();
  for (i=0;i<200;i++){
    var dealershipId = rnd() < 0.82 ? "d1" : "d2";
    var fsms = roster[dealershipId];
    var d = new Date(today.getTime() - Math.floor(rnd()*400)*86400000);
    var iso = d.toISOString().slice(0,10);
    var r = rnd(), type = r < 0.68 ? "Finance" : (r < 0.9 ? "Lease" : "Cash");
    var tx = newTransaction(fsms[Math.floor(rnd()*fsms.length)], dealershipId);
    tx.id = "DEMO-" + (10000+i); tx.createdAt = iso; tx.type = type; tx.status = "Completed";
    tx.customer = { id:null, name:D.DEMO_NAMES[Math.floor(rnd()*D.DEMO_NAMES.length)], phone:"", email:"", address:"" };
    tx.vehicle = { id:null, year:2024+Math.floor(rnd()*3), make: dealershipId === "d2" ? "INFINITI" : "Nissan",
      model: D.DEMO_MODELS[Math.floor(rnd()*D.DEMO_MODELS.length)], stock:"N-"+(1000+Math.floor(rnd()*8999)),
      vin:"DEMOVIN"+(100000+Math.floor(rnd()*899999)), odometer:Math.floor(rnd()*30000), condition:"New",
      price:28000+Math.floor(rnd()*36000) };
    var tm = type === "Cash" ? null : [48,60,72,84,96][Math.floor(rnd()*5)];
    var histRate = type === "Cash" ? 0 : Math.round((4+rnd()*6)*100)/100;
    tx.finance = { tradeAllowance: rnd() < .4 ? Math.floor(rnd()*18000) : 0, tradePayout:0,
      downPayment: Math.floor(rnd()*6)*1000, rates: tm ? (function(){ var o={}; o[tm]=histRate; return o; })() : {},
      terms: tm ? [tm] : [], frequency: type === "Cash" ? null : (rnd() < .6 ? "biweekly" : "monthly") };
    var count = Math.floor(rnd()*4.4);
    var pool = state.products.filter(function(p){ return p.active && p.pricing; });
    var used = {};
    for (j=0;j<count;j++){
      var prod = pool[Math.floor(rnd()*pool.length)];
      if (!prod || used[prod.id]) continue;
      used[prod.id] = 1;
      var line = { lineId:uid("L"), productId:prod.id, term:null, km:null, interval:null, deductible:null,
        price:null, priceOverridden:false, packages:{ preferred:true, essential:rnd()<.5, basic:rnd()<.25 } };
      if (prod.uses.term) line.term = prod.terms[Math.floor(rnd()*prod.terms.length)];
      if (prod.uses.km) line.km = prod.kms[Math.floor(rnd()*prod.kms.length)];
      if (prod.uses.interval) line.interval = prod.intervals[Math.floor(rnd()*prod.intervals.length)];
      if (prod.uses.deductible) line.deductible = prod.deductibles[Math.floor(rnd()*prod.deductibles.length)];
      line.price = priceFor(prod, line);
      tx.lines.push(line);
    }
    out.push(tx);
  }
  return out;
}

function lineConfigText(L){
  var bits = [];
  if (L.product.uses.term && L.cfg.term) bits.push(L.cfg.term + " months");
  if (L.product.uses.km && L.cfg.km) bits.push(km(L.cfg.km));
  if (L.product.uses.interval && L.cfg.interval) bits.push("every " + km(L.cfg.interval));
  if (L.product.uses.deductible && L.cfg.deductible !== null && L.cfg.deductible !== undefined && L.cfg.deductible !== "")
    bits.push(Number(L.cfg.deductible) === 0 ? "no deductible" : "$" + L.cfg.deductible + " deductible");
  return bits.join(" · ");
}
/* If the FSM has recorded which package and term the customer chose,
   every customer-facing surface (this screen, the customer print, the
   emailed follow-up) narrows to that one package and that one term.
   Until then they show everything that has been assigned to a package. */
function packagesToShow(t, tx){
  var list, nonDeclined = t.lines.filter(function(L){ return !L.cfg.declined &&
    L.cfg.packages && (L.cfg.packages.preferred || L.cfg.packages.essential || L.cfg.packages.basic); });
  if (t.packagesUsed) list = t.packages.filter(function(p){ return p.count > 0; });
  else if (nonDeclined.length) list = [{ key:"selected", label:"SELECTED PACKAGE", blurb:"", lines:nonDeclined,
    count:nonDeclined.length, quotes:t.quotes }];
  else list = [];
  var sel = tx && tx.display && tx.display.selection;
  if (sel && sel.package){
    list = list.filter(function(p){ return p.key === sel.package; });
    list = list.map(function(p){
      var q = sel.term ? p.quotes.filter(function(x){ return x.term === sel.term; }) : p.quotes;
      return { key:p.key, label:p.label, lines:p.lines, count:p.count, quotes:q };
    });
  }
  return list;
}

function saveProduct(){

function presetRange(period){

  else from = to.slice(0,4) + "-01-01";
  return { from:from, to:to };
}

    if (d.createdAt < f.from || d.createdAt > f.to) return false;
    if (f.fsm !== "all" && d.fsmUserId !== f.fsm) return false;
    if (f.type !== "all" && d.type !== f.type) return false;

}

function saveDealer(){
  var d = state.ui.dealerForm, root = document.querySelector(".modal");
  if (!d || !root) return;
  function f(k){ return root.querySelector('[data-df="'+k+'"]'); }
  var name = f("name").value.trim();
  if (!name){ toast("Give the dealership a name.","err"); return; }
  d.name = name;
  d.brandKey = f("brandKey").value;
  d.logoMark = (f("logoMark").value.trim() || (D.BRANDS[d.brandKey]||D.BRANDS.nissan).mark).toUpperCase();
  d.dealerCode = f("dealerCode").value.trim() || "DLR-" + Math.floor(1000+Math.random()*8999);
  d.address = f("address").value.trim();
  d.city = f("city").value.trim();
  d.phone = f("phone").value.trim();
  d.email = f("email").value.trim();
  d.tax = { standard:Number(f("taxStandard").value)||13, vrc:Number(f("taxVrc").value)||8 };
  d.finance.defaultApr = Number(f("apr").value)||0;
  d.finance.defaultTerm = Number(f("term").value)||72;
  var wasNew = !d.id;
  if (wasNew){
    d.id = C.uid("d"); d.active = true;
    state.dealerships.push(d);
    toast("Dealership created. You're now signed into it — add a general manager or salesperson from Users and access.","ok");
  } else {
    for (var i=0;i<state.dealerships.length;i++) if (state.dealerships[i].id === d.id) state.dealerships[i] = d;
    if (d.id === state.activeDealershipId) state.config = d;
    toast("Dealership saved.","ok");
  }
  state.ui.dealerForm = null;
  if (wasNew) V.setDealership(d.id);
  commit();
}
function deleteDealer(id){
  if (state.dealerships.length <= 1){ toast("Keep at least one dealership.","err"); return; }
  state.dealerships = state.dealerships.filter(function(d){ return d.id !== id; });
  state.users.forEach(function(u){ if (u.dealershipId === id) u.active = false; });
  if (state.activeDealershipId === id){
    if (state.dealerships.length) V.setDealership(state.dealerships[0].id);
    else { state.activeDealershipId = null; state.config = null; state.tx = null; }
  }
  toast("Dealership removed. Its users were deactivated.","ok");
  commit();
}

/* ---------------- EMAILED PRESENTATION ----------------

function buildEmail(tx){
  var t = C.totals(state, tx), b = V.brand(), c = state.config, u = userById(tx.fsmUserId);
  var sel = state.ui.email;
  var shown = V.packagesToShow(t).filter(function(p){ return sel.pkg === "all" || sel.pkg === p.key; });
  var first = tx.customer.name ? tx.customer.name.split(" ")[0] : "there";
  var vehicle = (tx.vehicle.year + " " + tx.vehicle.make + " " + tx.vehicle.model).trim();
  var L = [];
  L.push("Hi " + first + ",");
  L.push("");
  L.push("Thanks for your time today at " + c.name + ". Here is the protection we looked at for your " + vehicle + ", with the payments exactly as they appeared on screen. Nothing here is a commitment; it is so you can read it at your own pace.");
  L.push("");
  shown.forEach(function(p){
    L.push(p.label);
    L.push(new Array(p.label.length + 1).join("-"));
    var quotes = p.quotes.filter(function(q){ return sel.term === "all" || Number(sel.term) === q.term; });
    if (quotes.length){
      L.push("Payment with this package:");
      quotes.forEach(function(q){
        if (q.payment === null){ L.push("  - " + q.term + " months: rate still to be entered"); return; }
        L.push("  - " + money(q.payment) + " " + C.freqLabel(q.frequency) + " over " + q.term + " months at " + q.rate + "%"
          + " (" + money(q.difference) + " more than the vehicle on its own)");
      });
      L.push("");
    }
    L.push("What is included:");
    p.lines.forEach(function(line){
      var cfg = V.lineConfigText(line);
      L.push("");
      L.push("  " + line.product.name + (cfg ? " (" + cfg + ")" : ""));
      if (line.product.desc) L.push("    " + line.product.desc);
      if (line.product.benefit) L.push("    Why it matters: " + line.product.benefit);
    });
    L.push("");
  });
  L.push("Every payment above is exactly what we reviewed together, taxes included.");
  L.push("If you want any of this added, or want to swap between the packages, reply to this email or call me at " + c.phone + " and I will have it ready before you come in.");
  L.push("");
  L.push(u.name);
  L.push(u.role + ", " + c.name);
  L.push(b.finLabel);
  L.push(c.phone + " · " + c.email);
  L.push("");
  L.push("[ DEMONSTRATION PREVIEW — sample wording, not a contract or a binding quote ]");
  var subjectPkg = shown.length === 1 ? shown[0].label : "protection options";
  return {
    to: tx.customer.email || "",
    subject: "Your " + subjectPkg + " for the " + vehicle + " — " + c.name,
    body: L.join("\n")
  };
}
function buildEmailHtml(tx){

      <div style="font-size:11px;letter-spacing:.1em;color:#667085;text-transform:uppercase">${esc(b.finLabel)}</div>
      <p style="font-size:14px;line-height:1.6;margin-top:14px">Hi ${esc(first)},</p>
      <p style="font-size:14px;line-height:1.6">Thanks for your time today at ${esc(c.name)}. Here is the protection we looked at for your ${esc(vehicle)}, with the payments exactly as they appeared on screen. Nothing here is a commitment — it's so you can read it at your own pace.</p>
    </div>
    <div style="padding:0 20px">${pkgCardsHtml}</div>
    <div style="padding:4px 20px 20px">
      <p style="font-size:12.5px;color:#475467;line-height:1.6">Every payment above is exactly what we reviewed together, taxes included. If you'd like any of this added, or want to swap between packages, reply to this email or call me at ${esc(c.phone)} and I'll have it ready before you come in.</p>
      <table role="presentation" cellpadding="0" cellspacing="0" style="margin-top:18px">

        <tr><td style="font-size:12px;color:#475467">${esc(u.role)}, ${esc(c.name)}</td></tr>
        <tr><td style="font-size:12px;color:#475467">${esc(b.finLabel)}</td></tr>
        <tr><td style="font-size:12px;color:#475467">${esc(c.phone)} · ${esc(c.email)}</td></tr>
      </table>
      <p style="font-size:10.5px;color:#98a2b3;letter-spacing:.08em;margin-top:18px;text-align:center">DEMONSTRATION PREVIEW — SAMPLE WORDING, NOT A CONTRACT OR BINDING QUOTE</p>
    </div>
  </div>`;
  var subjectPkg = shown.length === 1 ? shown[0].label : "protection options";
  return { to: tx.customer.email || "", subject: "Your " + subjectPkg + " for the " + vehicle + " — " + c.name, html: html };

/* ---------------- AXIOM LOGIN ---------------- */
function axiomMarkSvg(size){
  /* A geometric "A" monogram: two gradient legs meeting at an apex node
     (the "insight" the brand is named for), crossed by a cyan bar — reads
     as a letterform first, a circuit/AI mark second. Precise coordinates,
     not a freeform sketch, so it stays crisp and symmetric at any size.
     Bolder strokes + a glow filter give it real weight instead of a thin line mark. */
  var uid = "m" + Math.random().toString(36).slice(2,8);
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="axiomMarkGrad${uid}" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0%" stop-color="#2249c9"/><stop offset="55%" stop-color="#6d4fe0"/><stop offset="100%" stop-color="#8b6bf0"/>
      </linearGradient>
      <radialGradient id="axiomNodeGrad${uid}" cx="50%" cy="32%" r="70%">
        <stop offset="0%" stop-color="#d6faff"/><stop offset="55%" stop-color="#7de6ff"/><stop offset="100%" stop-color="#38bdf8"/>
      </radialGradient>
      <filter id="axiomGlow${uid}" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="3.2" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g filter="url(#axiomGlow${uid})">
      <path d="M50 11 L14 92" stroke="url(#axiomMarkGrad${uid})" stroke-width="16" stroke-linecap="round" fill="none"/>
      <path d="M50 11 L86 92" stroke="url(#axiomMarkGrad${uid})" stroke-width="16" stroke-linecap="round" fill="none"/>
      <path d="M26 66 L74 66" stroke="#38bdf8" stroke-width="11" stroke-linecap="round" fill="none"/>
      <circle cx="50" cy="11" r="10" fill="url(#axiomNodeGrad${uid})"/>
    </g>
  </svg>`;
}
function axiomTargetSvg(){
  return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="12" cy="12" r="9" stroke="#5fd4f4" stroke-width="1.6"/>
    <circle cx="12" cy="12" r="4.5" stroke="#a78bfa" stroke-width="1.6"/>
    <circle cx="12" cy="12" r="1.4" fill="#fff"/>
  </svg>`;
}
function axiomGlobeSvg(){
  /* Not a literal photoreal render (that needs a rendered/video asset, which
     would break the single self-contained-file, zero-dependency setup) —
     this pushes the same wireframe-globe idea further: a glowing core,
     five independently-timed rings for real parallax depth, a denser node
     network with connecting lines, and a soft outer bloom. */
  var nodes = [
    {x:200,y:42,r:4.5,c:"#38bdf8",d:".2s"}, {x:358,y:150,r:4,c:"#a78bfa",d:"1.4s"},
    {x:358,y:250,r:4,c:"#fff",d:"2.6s"}, {x:200,y:358,r:4.5,c:"#38bdf8",d:".8s"},
    {x:42,y:250,r:4,c:"#a78bfa",d:"2s"}, {x:42,y:150,r:4,c:"#fff",d:"3.2s"},
    {x:116,y:20,r:3,c:"#a78bfa",d:".5s"}, {x:284,y:20,r:3,c:"#38bdf8",d:"1.1s"},
    {x:392,y:116,r:3,c:"#fff",d:"1.7s"}, {x:392,y:284,r:3,c:"#a78bfa",d:"2.3s"},
    {x:284,y:392,r:3,c:"#38bdf8",d:"2.9s"}, {x:116,y:392,r:3,c:"#fff",d:"3.5s"},
    {x:20,y:284,r:3,c:"#a78bfa",d:"1.3s"}, {x:20,y:116,r:3,c:"#38bdf8",d:"1.9s"}
  ];
  var lines = [[0,6],[0,7],[1,7],[1,8],[2,9],[2,10],[3,10],[3,11],[4,11],[4,12],[5,12],[5,13],[0,13],[1,2],[4,5]];
  var lineSvg = lines.map(function(pair){
    var a = nodes[pair[0]], b = nodes[pair[1]];
    return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="rgba(255,255,255,.14)" stroke-width="1"/>`;
  }).join("");
  var dotSvg = nodes.map(function(p){ return `<circle class="axiom-dot" cx="${p.x}" cy="${p.y}" r="${p.r}" fill="${p.c}" style="animation-delay:${p.d}"/>`; }).join("");
  return `<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="axiomCoreGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#5fd4f4" stop-opacity=".35"/><stop offset="60%" stop-color="#6d4fe0" stop-opacity=".12"/><stop offset="100%" stop-color="#6d4fe0" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <circle class="axiom-core" cx="200" cy="200" r="130" fill="url(#axiomCoreGrad)"/>
    <circle cx="200" cy="200" r="150" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="1"/>
    <g class="axiom-ring1"><ellipse cx="200" cy="200" rx="150" ry="42" fill="none" stroke="rgba(167,139,250,.5)" stroke-width="1.1"/></g>
    <g class="axiom-ring2"><ellipse cx="200" cy="200" rx="150" ry="70" fill="none" stroke="rgba(95,212,244,.48)" stroke-width="1.1"/></g>
    <g class="axiom-ring3"><ellipse cx="200" cy="200" rx="150" ry="100" fill="none" stroke="rgba(255,255,255,.24)" stroke-width="1"/></g>
    <g class="axiom-ring4"><ellipse cx="200" cy="200" rx="150" ry="128" fill="none" stroke="rgba(167,139,250,.3)" stroke-width="1"/></g>
    <g class="axiom-ring5"><ellipse cx="200" cy="200" rx="120" ry="150" fill="none" stroke="rgba(95,212,244,.22)" stroke-width="1"/></g>
    ${lineSvg}
    ${dotSvg}
  </svg>`;
}

/* ---------------- ROUTER + RENDER ---------------- */
function routeView(){
  if (!state.config) return renderOnboarding();
  var allowed = V.allowedRouteKeys();
  if (allowed && allowed.indexOf(state.route) === -1) state.route = allowed[0] || "finance";
  switch (state.route){
    case "dashboard": return V.viewDashboard();
    case "finance": return V.viewFinance();
    case "lease": return V.viewUnderConstruction("Lease");
    case "cash": return V.viewUnderConstruction("Cash");
    case "products": return viewProducts();
    case "reports": return viewReports();
    case "users": return viewUsers();
    case "dealerships": return V.isMaster() ? viewDealerships() : V.viewDashboard();
    case "settings": return viewSettings();
    default: return V.viewDashboard();
  }
}
/* A full re-render replaces every DOM node, including whatever the browser
   just moved focus to (e.g. the next field after Tab), which silently drops
   focus back to <body>. We fingerprint the focused field before the rewrite
   and refocus its replacement afterwards, restoring the caret too. */
var FOCUS_ATTRS = ["data-bind","data-act","data-term","data-line","data-fee","data-product","data-package","data-df","data-uf","id"];
function focusFingerprint(el){
  if (!el || !el.getAttribute || !el.tagName) return null;
  var parts = [el.tagName.toLowerCase()];
  FOCUS_ATTRS.forEach(function(a){ var v = el.getAttribute(a); if (v) parts.push('['+a+'="'+v.replace(/"/g,'\\"')+'"]'); });
  return parts.length > 1 ? parts.join("") : null;
}
function render(){
  try { document.documentElement.setAttribute("data-theme", state.ui.theme); } catch (e) {}
  var root = document.getElementById("root"), ov = document.getElementById("overlay");
  var y = window.scrollY;
  var active = document.activeElement;
  var fp = (active && active !== document.body) ? focusFingerprint(active) : null;
  var selStart = null, selEnd = null;
  if (fp && active && typeof active.selectionStart === "number"){
    try { selStart = active.selectionStart; selEnd = active.selectionEnd; } catch (e) {}
  }
  root.innerHTML = state.loggedIn ? V.renderShell(routeView()) : renderLogin();
  ov.innerHTML = state.loggedIn ? renderOverlay() : "";
  window.scrollTo(0, y);
  if (fp){
    var next = null;
    try { next = document.querySelector(fp); } catch (e) { next = null; }
    if (next){
      next.focus();
      if (selStart !== null && typeof next.setSelectionRange === "function"){
        try { next.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }
}
window.__DCC_RENDER__ = render;

/* ---------------- SECOND CUSTOMER WINDOW ----------------
   The preview runs inside a sandboxed frame, so a second window cannot load
   the app by URL. We open a blank window, write the customer display into it,
   and rewrite it on every change to the transaction.                      */
var custWin = null;
function customerWindowDoc(){
  var css = "";
  try { var st = document.querySelector("style"); if (st) css = st.textContent || ""; } catch (e) {}
  return '<!DOCTYPE html><html data-theme="' + state.ui.theme + '"><head><meta charset="utf-8">' +
    '<meta name="viewport" content="width=device-width, initial-scale=1">' +
    '<title>Customer Display — ' + esc(state.config.name) + '</title><style>' + css +
    /* On this standalone page .monitor is the whole screen, not a sidebar
       card, so it needs to actually stretch to fill the viewport height —
       .cd's min-height:430px alone left the rest of a tall window blank. */
    ' html,body{height:100%} body{margin:0;background:var(--bg)}' +
    ' .monitor{min-height:100vh;display:flex;flex-direction:column}' +
    ' .cd{flex:1;min-height:0}</style></head><body>' +
    '<div class="monitor" style="border:0;border-radius:0;position:static">' +
    '<div class="monitor-bar"><span class="live"></span><span>CUSTOMER DISPLAY</span></div>' +
    V.renderCustomerDisplay(state.tx) + '</div></body></html>';
}
function pushCustomerWindow(){
  if (!custWin || custWin.closed) return;
  try { custWin.document.open(); custWin.document.write(customerWindowDoc()); custWin.document.close(); }
  catch (e) { custWin = null; }
}
window.__DCC_PUSH_CUSTOMER__ = pushCustomerWindow;
function openCustomerWindow(){
  var w = null;
  /* No size/position features here on purpose — passing a features string
     (e.g. width=...,height=...) is what makes browsers treat window.open as
     a popup window. Omitting it opens a normal tab instead, which is what a
     two-screen FSM desk wants: drag that tab to the customer's monitor. */
  try { w = window.open("", "dccCustomerDisplay"); } catch (e) { w = null; }
  if (!w){
    state.ui.present = true;
    toast("This browser blocked the new tab, so the customer display opened full screen instead.","err");
    commit(); return;
  }
  custWin = w; pushCustomerWindow();
  toast("Customer display opened in a new tab. It updates as you build the deal.","ok");
  commit();
}

/* ---------------- ACTIONS ---------------- */
function findLine(id){
  for (var i=0;i<state.tx.lines.length;i++) if (state.tx.lines[i].lineId === id) return state.tx.lines[i];
  return null;
}
function makeLine(p){
  var line = { lineId:C.uid("L"), productId:p.id, term:null, km:null, interval:null, deductible:null,
    price:null, priceOverridden:false, declined:false, packages:{ preferred:false, essential:false, basic:false } };
  if (p.uses.term){
    var want = C.primaryTerm(state.tx);
    if (want){ var best = p.terms[0];
      p.terms.forEach(function(x){ if (Math.abs(x-want) < Math.abs(best-want)) best = x; });
      line.term = best;
    } else line.term = p.terms[Math.min(2, p.terms.length-1)];
  }
  if (p.uses.km) line.km = p.kms[Math.min(2, p.kms.length-1)];
  if (p.uses.interval) line.interval = p.intervals[1] !== undefined ? p.intervals[1] : p.intervals[0];
  if (p.uses.deductible) line.deductible = p.deductibles[p.deductibles.length-1];
  return line;
}
function completeDeal(){
  var v = C.validate(state, state.tx);
  if (!v.ok){ toast("This deal is not ready: " + v.errors[0], "err"); commit(); return; }
  var done = C.clone(state.tx);
  done.status = "Completed"; done.createdAt = C.todayISO();
  state.completed.push(done);
  state.tx.status = "Completed";
  state.tx.display.mode = "thankyou";
  toast("Deal " + done.id + " completed and sent to reporting.","ok");
  commit();
}
function newDeal(){
  state.tx = C.newTransaction(state.tx ? state.tx.fsmUserId : V.firstFsmFor(state.activeDealershipId), state.activeDealershipId);
  V.applyFinanceDefaults(state.tx);
  state.route = "finance";
  commit();
}
function resetDemo(){
  state.dealerships = C.clone(D.DEALERSHIPS);
  state.activeDealershipId = "d1";
  state.config = state.dealerships[0];
  state.products = C.clone(D.PRODUCTS);
  state.users = C.clone(D.USERS);
  state.customers = C.clone(D.CUSTOMERS);
  state.vehicles = C.clone(D.VEHICLES);
  state.completed = [];
  state.history = C.buildHistory(state);
  newDeal();
  toast("Preview reset to demo defaults.","ok");
}
/* ---------------- AXIOM LOGIN / LOGOUT ----------------
   No backend yet, so this is a client-side email+password match against
   state.users — good enough to gate who sees what on one shared device,
   but not real security (anyone with devtools can read it). A real backend
   with hashed passwords is the follow-up once this needs to be trustworthy
   for more than one FSM on one browser. */
function doLogin(){
  var emailEl = document.getElementById("loginEmail"), pwEl = document.getElementById("loginPassword");
  var email = emailEl ? emailEl.value.trim().toLowerCase() : "";
  var pw = pwEl ? pwEl.value : "";
  if (!email || !pw){ state.ui.loginError = "Enter your email and password."; commit(); return; }
  var match = state.users.filter(function(u){
    return u.active && u.email && u.email.toLowerCase() === email;
  })[0];
  if (!match || !match.password || match.password !== pw){
    state.ui.loginError = "That email and password don't match an active account.";
    commit(); return;
  }
  state.ui.loginError = null;
  state.currentUserId = match.id;
  state.loggedIn = true;
  if (match.dealershipId) V.setDealership(match.dealershipId);
  else if (state.dealerships.length) V.setDealership(state.dealerships[0].id);
  state.route = (match.role === "Master Administrator" || match.role === "General Manager" || match.role === "FSM Manager") ? "dashboard" : "finance";
  toast("Welcome back, " + match.name.split(" ")[0] + ".","ok");
  commit();
}
function doLogout(){
  state.loggedIn = false;
  state.ui.loginError = null;
  commit();
}
function copyEmailText(){
  var box = document.getElementById("emailBody");
  var text = box ? box.value : buildEmail(state.tx).body;
  var done = false;
  try { if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text); done = true; } } catch (e) {}
  if (!done && box){
    try { box.focus(); box.select(); done = document.execCommand("copy"); } catch (e) { done = false; }
  }
  toast(done ? "Plain text copied to the clipboard." : "Copy was blocked — select the text and copy it manually.", done ? "ok" : "err");
}
function copyEmailHtml(){
  var mail = buildEmailHtml(state.tx), text = buildEmail(state.tx).body, done = false;
  try {
    if (navigator.clipboard && navigator.clipboard.write && window.ClipboardItem){
      var htmlBlob = new Blob([mail.html], { type:"text/html" });
      var textBlob = new Blob([text], { type:"text/plain" });
      navigator.clipboard.write([ new ClipboardItem({ "text/html":htmlBlob, "text/plain":textBlob }) ]);
      done = true;
    }
  } catch (e) { done = false; }
  if (!done){
    try { if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text); done = true; } } catch (e) {}
  }
  toast(done ? "Formatted email copied — paste it (Ctrl/Cmd+V) into your email draft." : "Rich copy isn't supported in this browser — use the HTML source box instead.", done ? "ok" : "err");
}
function sendEmail(){
  var subject = document.getElementById("emailSubject");
  var text = buildEmail(state.tx).body;
  var to = state.tx.customer.email || "";
  var href = "mailto:" + encodeURIComponent(to) + "?subject=" + encodeURIComponent(subject ? subject.value : "") +
    "&body=" + encodeURIComponent(text);
  var opened = null;
  try { opened = window.open(href, "_blank"); } catch (e) { opened = null; }
  if (!opened) toast("The browser blocked the mail app from this preview. Use Copy formatted email instead.","err");
  else toast("Opening your email app with the plain-text version.","ok");
}

document.addEventListener("click", function(ev){

    case "toggle-split": state.ui.split = !state.ui.split; commit(); break;

      }

    case "copy-email-html": copyEmailHtml(); break;
    case "copy-email-text": copyEmailText(); break;
    case "send-email": sendEmail(); break;
    case "select-final-package": {
      var fpk = el.getAttribute("data-package");
      state.tx.display.selection = (state.tx.display.selection && state.tx.display.selection.package === fpk)
        ? null : { package: fpk };

    case "clear-selection": state.tx.display.selection = null; commit(); break;
    case "remove-line": {
      var lid = el.getAttribute("data-line");
      state.tx.lines = state.tx.lines.filter(function(l){ return l.lineId !== lid; });
      if (!state.tx.lines.length && state.tx.display.mode === "package") state.tx.display.mode = "welcome";
      commit(); break; }
    case "reset-price": {
      var ln = findLine(el.getAttribute("data-line"));
      if (ln){ ln.price = null; ln.priceOverridden = false; } commit(); break; }
    case "set-frequency": state.tx.finance.frequency = el.getAttribute("data-freq"); commit(); break;
    case "cd-mode": state.tx.display.mode = el.getAttribute("data-mode"); commit(); break;
    case "scroll-step": {

      if (target && target.scrollIntoView) target.scrollIntoView({ behavior:"smooth", block:"start" }); break; }
    case "print-internal": state.ui.modal = { kind:"internal" }; commit(); break;
    case "print-customer": state.ui.modal = { kind:"customer" }; commit(); break;
    case "close-modal": case "close-modal-bg":
      state.ui.modal = null; state.ui.productEdit = null; state.ui.userForm = false; state.ui.dealerForm = null; commit(); break;
    case "do-print": try { window.print(); } catch (e) { toast("The browser blocked printing in this preview window.","err"); } break;
    case "product-new": state.ui.productEdit = { id:null, name:"", code:"", category:"", active:true, taxRule:"standard",
      uses:{term:true,km:false,interval:false,deductible:false}, terms:[36,48,60,72], kms:[], intervals:[], deductibles:[],
      costFactor:0.4, desc:"", benefit:"", pricing:{ base:0, term:{} } }; commit(); break;
    case "product-edit": state.ui.productEdit = C.clone(C.productById(state, el.getAttribute("data-product"))); commit(); break;
    case "product-cancel": state.ui.productEdit = null; commit(); break;
    case "product-save": saveProduct(); break;
    case "product-toggle": {
      var pr = C.productById(state, el.getAttribute("data-product"));
      if (pr){ pr.active = !pr.active;
        if (!pr.active) state.tx.lines = state.tx.lines.filter(function(l){ return l.productId !== pr.id; }); }
      commit(); break; }
    case "product-delete": {
      var did = el.getAttribute("data-product");
      state.products = state.products.filter(function(p){ return p.id !== did; });
      state.tx.lines = state.tx.lines.filter(function(l){ return l.productId !== did; });
      toast("Product removed from the master list.","ok"); commit(); break; }
    case "user-new": state.ui.userForm = true; commit(); break;
    case "user-cancel": state.ui.userForm = false; commit(); break;
    case "user-save": saveUser(); break;
    case "user-setpw": {
      var upw = userById(el.getAttribute("data-user"));
      var next = window.prompt("Set a new login password for " + upw.name + ":", "");
      if (next === null) break;
      next = next.trim();
      if (!next){ toast("Password not changed — it can't be blank.","err"); break; }
      upw.password = next;
      toast("Password updated for " + upw.name + ".","ok");
      commit(); break; }
    case "user-toggle": {
      var uu = userById(el.getAttribute("data-user"));
      if (uu.role === "Master Administrator") { toast("A master administrator can't be deactivated.","err"); break; }
      uu.active = !uu.active;
      if (!uu.active && uu.id === state.currentUserId) state.currentUserId = "u0";
      commit(); break; }
    case "user-delete": {
      var uid2 = el.getAttribute("data-user");
      var ud = userById(uid2);
      if (ud.role === "Master Administrator") { toast("A master administrator can't be removed.","err"); break; }
      if (uid2 === state.currentUserId) { toast("You can't remove your own account.","err"); break; }
      state.users = state.users.filter(function(u){ return u.id !== uid2; }); commit(); break; }
    case "dealer-new": state.ui.dealerForm = { id:null, name:"", brandKey:"ford", logoMark:"", active:true,
      address:"", city:"", phone:"", email:"", dealerCode:"",

});

document.addEventListener("change", function(ev){
  var el = ev.target, act = el.getAttribute("data-act");
  if (act === "switch-user"){
    state.currentUserId = el.value;
    var u = userById(el.value);
    if (u.dealershipId && u.dealershipId !== state.activeDealershipId) V.setDealership(u.dealershipId);
    if (!V.isMaster() && state.route === "dealerships") state.route = "dashboard";
    commit(); return;
  }
  if (act === "switch-dealership"){ V.setDealership(el.value); commit(); return; }
  if (act === "assign-dealership"){
    var target = userById(el.getAttribute("data-user"));
    target.dealershipId = el.value; commit(); return;
  }
  if (act === "dealer-brand"){
    if (state.ui.dealerForm){
      state.ui.dealerForm.brandKey = el.value;
      state.ui.dealerForm.logoMark = (D.BRANDS[el.value]||D.BRANDS.nissan).mark;
    }
    commit(); return;
  }
  if (act === "pick-customer"){
    var c = state.customers.filter(function(x){ return x.id === el.value; })[0];
    if (c) state.tx.customer = { id:c.id, name:c.name, phone:c.phone, email:c.email, address:c.address };
    commit(); return;
  }
  if (act === "pick-vehicle"){
    var v = state.vehicles.filter(function(x){ return x.id === el.value; })[0];
    if (v){
      state.tx.vehicle = { id:v.id, year:v.year, make:v.make, model:v.model, stock:v.stock, vin:v.vin,
        odometer:v.odometer, condition:v.condition, price:v.price };
      if (!state.tx.customer.name){
        var owner = state.customers.filter(function(x){ return x.id === v.customerId; })[0];
        if (owner) state.tx.customer = { id:owner.id, name:owner.name, phone:owner.phone, email:owner.email, address:owner.address };
      }
      if (!state.tx.finance.terms.length){
        var dt = state.config.finance.defaultTerm;
        state.tx.finance.terms = [dt];
        if (!state.tx.finance.rates) state.tx.finance.rates = {};
        if (state.tx.finance.rates[dt] === undefined) state.tx.finance.rates[dt] = state.config.finance.defaultApr;
      }
      if (!state.tx.finance.frequency) state.tx.finance.frequency = state.config.finance.defaultFrequency;
    }
    commit(); return;
  }
  if (act === "toggle-term"){
    var tm = Number(el.getAttribute("data-term")), list = state.tx.finance.terms.slice();
    if (!state.tx.finance.rates) state.tx.finance.rates = {};
    if (el.checked){
      if (list.indexOf(tm) === -1) list.push(tm);
      if (state.tx.finance.rates[tm] === undefined) state.tx.finance.rates[tm] = state.config.finance.defaultApr;
    } else {
      list = list.filter(function(x){ return x !== tm; });
      delete state.tx.finance.rates[tm];
      if (state.tx.display.selection && state.tx.display.selection.term === tm) state.tx.display.selection = null;
    }
    state.tx.finance.terms = list.sort(function(a,b){ return a-b; });
    commit(); return;
  }
  if (act === "term-rate"){
    var trm = Number(el.getAttribute("data-term"));
    if (!state.tx.finance.rates) state.tx.finance.rates = {};
    state.tx.finance.rates[trm] = el.value === "" ? null : Number(el.value);
    commit(); return;
  }
  if (act === "toggle-package-list"){
    var pid2 = el.getAttribute("data-product"), pkgKey = el.getAttribute("data-package");
    var line2 = state.tx.lines.filter(function(l){ return l.productId === pid2; })[0];
    if (!line2){
      if (!el.checked) return;
      var prod2 = C.productById(state, pid2);
      if (!prod2) return;
      line2 = makeLine(prod2);
      state.tx.lines.push(line2);
    }
    if (!line2.packages) line2.packages = { preferred:false, essential:false, basic:false };
    var wasInAnyPkg = line2.packages.preferred || line2.packages.essential || line2.packages.basic;
    line2.packages[pkgKey] = el.checked;
    if (el.checked) line2.declined = false;
    var anyPkg = line2.packages.preferred || line2.packages.essential || line2.packages.basic;
    /* The customer display lists products in the order they were selected
       into a package. A price typed in before any package is picked (or a
       product declined and later brought back) shouldn't count as "selected"
       yet — only the moment it first joins a package sets its display order,
       so move it to the end of the line-up right then. */
    if (el.checked && !wasInAnyPkg){
      state.tx.lines = state.tx.lines.filter(function(l){ return l.lineId !== line2.lineId; });
      state.tx.lines.push(line2);
    }
    if (!anyPkg && !line2.declined) state.tx.lines = state.tx.lines.filter(function(l){ return l.lineId !== line2.lineId; });
    if (state.tx.lines.length && state.tx.display.mode === "welcome") state.tx.display.mode = "package";
    if (!state.tx.lines.length && state.tx.display.mode === "package") state.tx.display.mode = "welcome";
    commit(); return;
  }
  if (act === "toggle-decline"){
    var pid3 = el.getAttribute("data-product");
    var line3 = state.tx.lines.filter(function(l){ return l.productId === pid3; })[0];
    if (el.checked){
      if (!line3){
        var prod3 = C.productById(state, pid3);
        if (!prod3) return;
        line3 = makeLine(prod3);
        state.tx.lines.push(line3);
      }
      line3.packages = { preferred:false, essential:false, basic:false };
      line3.declined = true;
    } else if (line3){
      line3.declined = false;
      var anyPkg3 = line3.packages && (line3.packages.preferred || line3.packages.essential || line3.packages.basic);
      if (!anyPkg3) state.tx.lines = state.tx.lines.filter(function(l){ return l.lineId !== line3.lineId; });
    }
    if (state.tx.lines.length && state.tx.display.mode === "welcome") state.tx.display.mode = "package";
    commit(); return;
  }
  if (act === "toggle-payment"){ state.tx.display.showPayment = el.checked; commit(); return; }
  if (act === "report-preset"){
    state.ui.reports.period = el.value;
    var r = presetRange(el.value);
    state.ui.reports.from = r.from; state.ui.reports.to = r.to;
    commit(); return;
  }
  var bind = el.getAttribute("data-bind");
  if (!bind) return;
  var raw = el.type === "checkbox" ? el.checked : el.value;
  var num = el.getAttribute("data-type") === "num";
  if (bind.indexOf("newline:") === 0){
    var nparts = bind.split(":"), nprod = C.productById(state, nparts[1]);
    if (!nprod || raw === "") return;
    var nline = state.tx.lines.filter(function(l){ return l.productId === nprod.id; })[0];
    if (!nline){ nline = makeLine(nprod); state.tx.lines.push(nline); }
    nline.price = num ? Number(raw) : raw;
    var nconf = C.priceFor(nprod, nline);
    nline.priceOverridden = !(nline.price === null || nconf === null || Number(nline.price) === Number(nconf));
    commit(); return;
  }
  if (bind.indexOf("line:") === 0){
    var parts = bind.split(":"), ln2 = findLine(parts[1]), field = parts[2];
    if (!ln2) return;
    if (raw === "") ln2[field] = null; else ln2[field] = num ? Number(raw) : raw;
    if (field === "price"){
      var prod = C.productById(state, ln2.productId), conf = C.priceFor(prod, ln2);
      ln2.priceOverridden = !(ln2.price === null || conf === null || Number(ln2.price) === Number(conf));
    } else if (!ln2.priceOverridden) ln2.price = null;
    commit(); return;
  }
  var value = raw === "" ? (num ? null : "") : (num ? Number(raw) : raw);
  V.setPath(state, bind, value);
  if (bind === "config.brandKey"){
    var bd = D.BRANDS[value];
    if (bd) state.config.logoMark = bd.mark;
  }
  commit();
});

/* ---------------- BOOT ---------------- */
function boot(){
  if (state.tx) V.applyFinanceDefaults(state.tx);
  var r = presetRange("monthly");
  state.ui.reports.from = r.from; state.ui.reports.to = r.to;
  commit();
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();

function addToPackage(pid, pkgKey){
  var line = state.tx.lines.filter(function(l){ return l.productId === pid; })[0];
  if (!line){
    var prod = C.productById(state, pid);
    if (!prod) return;
    line = makeLine(prod);
    state.tx.lines.push(line);
  }
  if (!line.packages) line.packages = { preferred:false, essential:false, basic:false };
  line.packages[pkgKey || "preferred"] = true;
}
window.__DCC_TEST__ = { state:state, render:render, addToPackage:addToPackage, completeDeal:completeDeal, newDeal:newDeal,
  filteredDeals:filteredDeals, internalPrint:internalPrint, customerPrint:customerPrint, buildEmail:buildEmail, buildEmailHtml:buildEmailHtml,
  viewProducts:viewProducts, viewReports:viewReports, viewUsers:viewUsers, viewSettings:viewSettings,
  viewDealerships:viewDealerships, routeView:routeView, presetRange:presetRange, priceRange:priceRange,
  saveDealer:saveDealer, deleteDealer:deleteDealer, customerWindowDoc:customerWindowDoc, renderOnboarding:renderOnboarding };
})();
</script>
